# The sign-in page belongs to the product's front door, not to Keycloak's
# default look. This theme changes only the paint: it inherits every template,
# message and behaviour from the stock login theme, then adds one stylesheet.
#
# Listing css/login.css before css/brand.css matters — each file is resolved
# through the theme chain, so login.css comes from the parent and brand.css
# from here, in that order.
#
# ?v= on the stylesheet is a cache buster, and the reason it is needed is
# worth knowing: theme resources are served under /resources/<server build>/,
# a path that does NOT change when a theme file changes, with a
# Cache-Control that used to say 30 days. An edit to brand.css was therefore
# invisible to everyone who had opened the sign-in page before it. The
# cluster now serves these with a short max-age (KC_SPI_THEME_STATIC_MAX_AGE
# in deploy/k8s/base/infra/keycloak.yaml) so this stays a one-off, but a
# browser that cached the old file under the old rules only asks again for a
# URL it has never seen. Raise the number when the stylesheet changes in a
# way that must reach people who have already been here.
parent=keycloak
import=common/keycloak
styles=css/login.css css/brand.css?v=2
scripts=js/brand.js
