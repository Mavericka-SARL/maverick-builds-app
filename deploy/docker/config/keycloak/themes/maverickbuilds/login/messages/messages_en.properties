# The page an invitation link opens first. Keycloak asks before it acts on
# the link, so a mail scanner that opens it changes nothing; the stock words
# ("Perform the following action(s): Update Password, Verify Email") read as
# an administrator's errand.
confirmExecutionOfActions=One step left to finish your account
proceedWithAction=Continue &raquo;
requiredAction.UPDATE_PASSWORD=choose your password
requiredAction.VERIFY_EMAIL=confirm your e-mail address

# "Forgot password?" (resetPasswordAllowed, on once the realm can send mail:
# scripts/keycloak-smtp-setup.sh) and the page it opens.
doForgotPassword=Forgot password?
emailForgotTitle=Forgot your password?
emailInstruction=Enter the e-mail address you sign in with. We will send you a link to choose a new password.
emailSentMessage=If an account uses that address, a link to choose a new password is on its way.
backToLogin=&laquo; Back to sign in
