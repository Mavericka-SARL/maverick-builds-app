# The invitation (html and text executeActions.ftl). The gateway marks the
# account first (mvx_invitation: signup or invite, with mvx_invited_by and
# mvx_workspace); an account without a mark reads mvxAccountLead. Plain
# sentences: the templates put them into HTML, escaped, so a name cannot add
# markup to the mail.
executeActionsSubject=Choose your password
mvxAccountLead=Choose your password for your {0} account.
mvxSignupLead=You signed up for {0}. Choose your password to finish setting up your account.
mvxInviteLead={0} invited you to the {1} workspace on {2}. Choose your password to sign in.
mvxInviteNoWorkspaceLead={0} invited you to {1}. Choose your password to sign in.
mvxChoosePassword=Choose your password
mvxLinkWorks=The link works for {0}.
mvxSignupIgnore=If you did not sign up, ignore this mail: nothing happens without the password.
mvxInviteIgnore=If you were not expecting this, ignore this mail: nothing happens without the password.
