# NetworkPolicy — one per pod, deny-by-default (policyTypes: [Ingress,
# Egress] on every entry means Kubernetes switches that pod to
# default-deny for both directions the moment any policy selects it).
#
# Every ingress/egress rule below is derived from a real, grep-confirmed
# call site (clients.NewAuditClient/NewPolicyClient callers,
# nats.Connect callers, identity.NewJWKSValidator callers, redis.*
# callers, pkg/objectstore importers, ANTHROPIC_API_KEY usage) — not
# inferred from the shared mavericks-config/mavericks-secrets ConfigMap/
# Secret, which every pod gets identically via envFrom regardless of what
# it actually calls. See IMPLEMENTATION_PLAN.md's P2 "Distributed
# topology validation" entry for the full call-graph table this was
# built from.
#
# Notably: nothing in the current in-cluster call graph calls any
# backend service's gRPC port except audit/policy (which DO have real
# callers, listed explicitly below) — gateway executes equivalent logic
# in-process rather than calling out over gRPC today. Every backend
# service's ingress is therefore restricted to `app: gateway` — matching
# the intended architecture (gateway is the one legitimate caller) without
# leaving it open cluster-wide, and without blocking that path's natural
# next step. kubectl port-forward bypasses NetworkPolicy entirely, so this
# doesn't block ad-hoc debugging.
#
# kube-dns's exact namespace/pod labels vary by cluster/CNI, so every
# egress list ends with a port-only (UDP+TCP/53), unrestricted-destination
# DNS rule rather than a specific podSelector/namespaceSelector — getting
# that selector wrong would silently break every Service-name lookup in
# the namespace.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gateway
  namespace: mavericks
  labels: {app: gateway}
spec:
  podSelector: {matchLabels: {app: gateway}}
  policyTypes: [Ingress, Egress]
  ingress:
    - ports: [{protocol: TCP, port: 8080}]   # public entry point (gateway + gateway-lb Services) — no `from` restriction
  egress:
    - to: [{podSelector: {matchLabels: {app: keycloak}}}]
      ports: [{protocol: TCP, port: 8080}]
    - to: [{podSelector: {matchLabels: {app: minio}}}]
      ports: [{protocol: TCP, port: 9000}]
    - to: [{podSelector: {matchLabels: {app: pgbouncer}}}]
      ports: [{protocol: TCP, port: 5433}]
    # Outbound SMTP: the gateway runs the notification dispatcher
    # (docs/NOTIFICATIONS.md), so it is the pod that talks to the relay.
    # A NetworkPolicy cannot match a hostname, so the relay is admitted by
    # port alone — 587 submission with STARTTLS, 465 implicit TLS — the same
    # rule the backup watchdog carries below. Without it every send hangs
    # until the dispatch deadline and reads like a dead relay.
    - to: [{ipBlock: {cidr: 0.0.0.0/0}}]
      ports: [{protocol: TCP, port: 587}, {protocol: TCP, port: 465}]
    # Public HTTPS. The gateway itself calls the AI providers
    # (internal/gateway/ai_handler.go — in-process, not through the
    # ai-assistant service), fetches Google Sheets for imports and exchanges
    # OAuth tokens for REST connections. Without this rule every one of those
    # times out wherever policies are enforced; the production overlay only
    # worked because its object-storage patch restates this list with 443.
    - to: [{ipBlock: {cidr: 0.0.0.0/0}}]
      ports: [{protocol: TCP, port: 443}]
    - ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]

---
