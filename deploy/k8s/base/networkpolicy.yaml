  namespace: mavericks
  labels: {app: audit}
spec:
  podSelector: {matchLabels: {app: audit}}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:   # every real caller, confirmed via clients.NewAuditClient
        - podSelector: {matchLabels: {app: tenant}}
        - podSelector: {matchLabels: {app: identity}}
        - podSelector: {matchLabels: {app: notification}}
        - podSelector: {matchLabels: {app: calculation}}
        - podSelector: {matchLabels: {app: schema-migration}}
        - podSelector: {matchLabels: {app: model}}
        - podSelector: {matchLabels: {app: workflow}}
        - podSelector: {matchLabels: {app: ai-assistant}}
        - podSelector: {matchLabels: {app: query}}
        - podSelector: {matchLabels: {app: import}}
        - podSelector: {matchLabels: {app: policy}}
      ports: [{protocol: TCP, port: 9090}]
  egress:
    - to: [{podSelector: {matchLabels: {app: pgbouncer}}}]
      ports: [{protocol: TCP, port: 5433}]
    - ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ai-assistant
  namespace: mavericks
  labels: {app: ai-assistant}
spec:
  podSelector: {matchLabels: {app: ai-assistant}}
  policyTypes: [Ingress, Egress]
  ingress:
    - from: [{podSelector: {matchLabels: {app: gateway}}}]
      ports: [{protocol: TCP, port: 9090}]
  egress:
    - to: [{podSelector: {matchLabels: {app: audit}}}]
      ports: [{protocol: TCP, port: 9090}]
    - to: [{podSelector: {matchLabels: {app: keycloak}}}]
      ports: [{protocol: TCP, port: 8080}]
    - to: [{podSelector: {matchLabels: {app: pgbouncer}}}]
      ports: [{protocol: TCP, port: 5433}]
    # Anthropic API access (ANTHROPIC_API_KEY, internal/aiassistant). A
    # NetworkPolicy can only match by IP/pod/namespace selector, never by
    # hostname, so this is scoped by port only — a deliberate looseness,
    # tightenable later with a CIDR allowlist or an egress proxy if
    # Anthropic's IP ranges need pinning.
    - to: [{ipBlock: {cidr: 0.0.0.0/0}}]
      ports: [{protocol: TCP, port: 443}]
    - ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]

