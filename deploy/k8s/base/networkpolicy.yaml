---
# seed — one-shot Job, nothing calls it (no ingress rule needed at all;
# omitting `ingress:` entirely with Ingress in policyTypes = deny all).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: seed
  namespace: mavericks
  labels: {app: seed}
spec:
  podSelector: {matchLabels: {app: seed}}
  policyTypes: [Ingress, Egress]
  egress:
    - to: [{podSelector: {matchLabels: {app: pgbouncer}}}]
      ports: [{protocol: TCP, port: 5433}]
    - ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]

---
# postgres-backup — CronJob, nothing calls it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-backup
  namespace: mavericks
  labels: {app: postgres-backup}
spec:
  podSelector: {matchLabels: {app: postgres-backup}}
  policyTypes: [Ingress, Egress]
  egress:
    - to: [{podSelector: {matchLabels: {app: postgres}}}]
      ports: [{protocol: TCP, port: 5432}]
    - to: [{podSelector: {matchLabels: {app: minio}}}]
      ports: [{protocol: TCP, port: 9000}]
    - ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]

---
# postgres-backup-watchdog — the job that checks a backup actually arrived
# (infra/postgres-backup.yaml). It never touches Postgres: it reads the bucket
# and, when the news is bad, sends one mail.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-backup-watchdog
  namespace: mavericks
  labels: {app: postgres-backup-watchdog}
spec:
  podSelector: {matchLabels: {app: postgres-backup-watchdog}}
  policyTypes: [Ingress, Egress]
  egress:
    - to: [{podSelector: {matchLabels: {app: minio}}}]
      ports: [{protocol: TCP, port: 9000}]
    # Outbound SMTP for the alert. As everywhere else here, a NetworkPolicy
    # cannot match a hostname, so the relay is admitted by port alone: 587 is
    # submission with STARTTLS, 465 implicit TLS. An alert that a policy
    # silently dropped would be the same failure this job exists to end.
    - to: [{ipBlock: {cidr: 0.0.0.0/0}}]
      ports: [{protocol: TCP, port: 587}, {protocol: TCP, port: 465}]
    - ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres
  namespace: mavericks
  labels: {app: postgres}
spec:
  podSelector: {matchLabels: {app: postgres}}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: {matchLabels: {app: pgbouncer}}
        - podSelector: {matchLabels: {app: postgres-backup}}
        # Keycloak's DB (KC_DB_URL jdbc:postgresql://postgres:5432/keycloak)
        # — this allowance existed only LIVE since the 08-15 auth
        # enablement; re-applying the repo policy without it took logins
        # down ("Unexpected error when handling authentication request").
        # Committed now so the file IS the cluster.
        - podSelector: {matchLabels: {app: keycloak}}
        # node-stats DaemonSet INSERTs its samples directly (see
        # infra/node-stats.yaml for why not via pgbouncer).
        - podSelector: {matchLabels: {app: node-stats}}
      ports: [{protocol: TCP, port: 5432}]
  egress:
    # WAL-G (both the postgres container's own archive_command/
    # restore_command and the wal-g-basebackup sidecar in the same pod —
    # NetworkPolicy is per-pod, not per-container) pushes/fetches
    # directly to MinIO.
    #
    # Production backups target Hetzner Object Storage over HTTPS — this
    # allowance existed only LIVE; re-applying the repo policy wiped it and
    # the wal-g sidecar crash-looped on 'connection refused' to
    # *.your-objectstorage.com, taking postgres-0 out of the Service and
    # with it every DB-backed surface (second live-only-rule outage in two
    # days — the file must BE the cluster).
    - ports: [{protocol: TCP, port: 443}]
    - to: [{podSelector: {matchLabels: {app: minio}}}]
      ports: [{protocol: TCP, port: 9000}]
    - ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pgbouncer
  namespace: mavericks
  labels: {app: pgbouncer}
spec:
  podSelector: {matchLabels: {app: pgbouncer}}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:   # all 13 app-tier pods — confirmed identical DATABASE_URL in every service manifest
        - podSelector: {matchLabels: {app: gateway}}
        - podSelector: {matchLabels: {app: tenant}}
        - podSelector: {matchLabels: {app: identity}}
        - podSelector: {matchLabels: {app: audit}}
        - podSelector: {matchLabels: {app: ai-assistant}}
        - podSelector: {matchLabels: {app: calculation}}
        - podSelector: {matchLabels: {app: import}}
        - podSelector: {matchLabels: {app: model}}
        - podSelector: {matchLabels: {app: notification}}
        - podSelector: {matchLabels: {app: policy}}
        - podSelector: {matchLabels: {app: query}}
        - podSelector: {matchLabels: {app: schema-migration}}
        - podSelector: {matchLabels: {app: workflow}}
        # The integration worker's durable run queue lives in Postgres — the
        # counterpart of its own egress rule (a netpol needs BOTH directions).
        - podSelector: {matchLabels: {app: integration}}
        - podSelector: {matchLabels: {app: seed}}
      ports: [{protocol: TCP, port: 5433}]
  egress:
    - to: [{podSelector: {matchLabels: {app: postgres}}}]
      ports: [{protocol: TCP, port: 5432}]
    - ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]

