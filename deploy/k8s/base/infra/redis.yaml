# Redis 7 — in-memory cache, session store, and distributed lock provider.
# Single-instance configuration; switch to Redis Sentinel or Redis Cluster
# for production high-availability requirements.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: mavericks
  labels:
    app: redis
    app.kubernetes.io/name: redis
    app.kubernetes.io/component: cache
    app.kubernetes.io/part-of: mavericks-engine
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  strategy:
    # Recreate prevents two Redis instances writing to the same data dir.
    type: Recreate
  template:
    metadata:
      labels:
        app: redis
        app.kubernetes.io/name: redis
        app.kubernetes.io/component: cache
        app.kubernetes.io/part-of: mavericks-engine
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: redis
          image: redis:7-alpine
          imagePullPolicy: IfNotPresent
          args:
            # Append-only-file persistence keeps data across restarts.
            # Remove --appendonly yes if you prefer purely in-memory behaviour.
            - "--appendonly"
            - "yes"
            - "--appendfsync"
            - "everysec"
          ports:
            - name: redis
              containerPort: 6379
              protocol: TCP
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false  # redis needs /data for AOF
            runAsNonRoot: true
            runAsUser: 999
            capabilities:
              drop: ["ALL"]

---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: mavericks
  labels:
    app: redis
    app.kubernetes.io/name: redis
    app.kubernetes.io/component: cache
    app.kubernetes.io/part-of: mavericks-engine
spec:
  type: ClusterIP
  selector:
    app: redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
      protocol: TCP
