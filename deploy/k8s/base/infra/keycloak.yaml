# Keycloak 24 — identity and access management (OIDC / OAuth2).
# start-dev mode uses an embedded H2 database; set KC_DB=postgres and
# provide KC_DB_URL for production.  The realm.json ConfigMap is mounted
# at /opt/keycloak/data/import/ so Keycloak auto-imports it on first boot.
#
# "On first boot" is literal: --import-realm SKIPS a realm that already
# exists. Editing the ConfigMap below therefore has no effect on a cluster
# that has already imported it — delete the realm and restart Keycloak, or
# apply the change through the admin API.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-realm
  namespace: mavericks
  labels:
    app: keycloak
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/component: identity
    app.kubernetes.io/part-of: mavericks-engine
data:
  # The realm the application actually requires, not a placeholder. What was
  # here before declared "clients": [] and roles named admin/user, which
  # imports cleanly and then fails at the only two things that matter:
  #
  #   1. No mavericks-web client, so the console's keycloak.init() has
  #      nothing to authenticate against and login is impossible.
  #   2. Roles that match nothing. The gateway reads a user's roles from
  #      identity.role_assignment, whose enum is platform_admin /
  #      tenant_admin / developer / business_admin / business_user
  #      (migrations/002_identity.sql and 032_tenant_admin_role.sql), and
  #      the console reads the same names from realm_access.roles to decide
  #      which console to show.
  #
  # Users are deliberately NOT here — they carry credentials and belong in
  # neither git nor a ConfigMap. Create them through the admin console or
  # admin API, and mirror each one into identity.user (matching keycloak_sub)
  # plus identity.role_assignment, which is what the gateway authorizes on.
  #
  # Brute-force protection is ON. It is off by default in Keycloak, and this
  # realm's login page is reachable from the internet the moment the auth
  # hostname is published. permanentLockout stays false on purpose: with a
  # handful of named users, a permanent lock means anyone who knows an email
  # address can lock that person out for good just by guessing wrong.
  # quickLoginCheckMilliSeconds is the setting that actually stops scripted
  # attacks — verified live, a rapid-fire run locked the account after two
  # counted failures rather than the full ten.
  #
  # Hostnames are placeholders; patch redirectUris/webOrigins per environment.
  realm.json: |
    {
      "realm": "mavericks",
      "enabled": true,
      "registrationAllowed": false,
      "loginTheme": "keycloak",
      "sslRequired": "external",
      "displayName": "Maverick",
      "bruteForceProtected": true,
      "failureFactor": 10,
      "waitIncrementSeconds": 60,
      "maxFailureWaitSeconds": 900,
      "minimumQuickLoginWaitSeconds": 60,
      "quickLoginCheckMilliSeconds": 1000,
      "maxDeltaTimeSeconds": 43200,
      "permanentLockout": false,
      "roles": {
        "realm": [
          {"name": "platform_admin", "description": "Full access across all customers"},
          {"name": "tenant_admin", "description": "Manages one customer's workspaces, apps and users"},
          {"name": "developer", "description": "Builds models, forms and workflows"},
          {"name": "business_admin", "description": "Administers business consoles within a workspace"},
          {"name": "business_user", "description": "Enters and reviews data"}
        ]
      },
      "clients": [
        {
          "clientId": "mavericks-web",
          "name": "Mavericks Console",
          "enabled": true,
          "protocol": "openid-connect",
          "publicClient": true,
          "standardFlowEnabled": true,
          "implicitFlowEnabled": false,
          "serviceAccountsEnabled": false,
          "directAccessGrantsEnabled": false,
          "fullScopeAllowed": true,
          "redirectUris": ["https://mavericks.example.com/*"],
          "webOrigins": ["https://mavericks.example.com"],
          "attributes": {
            "pkce.code.challenge.method": "S256",
            "post.logout.redirect.uris": "https://mavericks.example.com/*"
          }
        },
        {
          "clientId": "mavericks-admin",
          "name": "Gateway user provisioning",
          "description": "Service account the gateway uses to create users and send invitations. NOT for browser login.",
          "enabled": true,
          "protocol": "openid-connect",
          "publicClient": false,
          "standardFlowEnabled": false,
          "implicitFlowEnabled": false,
          "directAccessGrantsEnabled": false,
          "serviceAccountsEnabled": true
        }
      ]
    }

---
# The sign-in page in the product's colours. A CSS-only theme: it inherits
# every template and message from Keycloak's own login theme and adds one
# stylesheet, so an upgrade cannot break signing in. The source of truth is
# deploy/docker/config/keycloak/themes/maverickbuilds/login/ — edit there and
# copy the files here (they are small and change rarely; a ConfigMap cannot
# reference a directory). deploy/k8s/base/infra/keycloak_theme_test.go fails
# if the two drift.
#
# A realm uses it when its loginTheme is "maverickbuilds"; realm.json sets that
# on first import, and an existing realm is switched in the admin console or
# with a PUT to /admin/realms/<realm>.
apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-theme
  namespace: mavericks
  labels:
    app: keycloak
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/part-of: mavericks-engine
data:
  theme.properties: |
    # The sign-in page belongs to the product's front door, not to Keycloak's
    # default look. This theme changes only the paint: it inherits every template,
    # message and behaviour from the stock login theme, then adds one stylesheet.
    #
    # Listing css/login.css before css/brand.css matters — each file is resolved
    # through the theme chain, so login.css comes from the parent and brand.css
    # from here, in that order.
    #
    # ?v= on the stylesheet is a cache buster, and the reason it is needed is
    # worth knowing: theme resources are served under /resources/<server build>/,
    # a path that does NOT change when a theme file changes, with a
    # Cache-Control that used to say 30 days. An edit to brand.css was therefore
    # invisible to everyone who had opened the sign-in page before it. The
    # cluster now serves these with a short max-age (KC_SPI_THEME_STATIC_MAX_AGE
    # in deploy/k8s/base/infra/keycloak.yaml) so this stays a one-off, but a
    # browser that cached the old file under the old rules only asks again for a
    # URL it has never seen. Raise the number when the stylesheet changes in a
    # way that must reach people who have already been here.
    parent=keycloak
    import=common/keycloak
    styles=css/login.css css/brand.css?v=3
    scripts=js/brand.js
  brand.css: |
    /*
     * Sign-in, in the product's own colours: the same near-black ground, warm
     * accent and heavy headline the console's public pages use
     * (web/src/public/public.css). Keep the two in step — a visitor moves from
     * one to the other in a single click.
     *
     * Only colours, type and spacing are touched. Every template, message and
     * flow stays the stock one, so a Keycloak upgrade cannot break sign-in here;
     * at worst a selector stops matching and that element returns to its default.
     * Selectors are written for both the PatternFly 4 classes Keycloak 24 emits
     * (.pf-c-*) and the older Bootstrap ones, so an upgrade in either direction
     * keeps working.
     */

    :root {
      --mvx-bg: #0a0a0a;
      --mvx-raised: #141414;
      --mvx-line: #262626;
      --mvx-line-strong: #3a3a3a;
      --mvx-text: #ffffff;
      --mvx-muted: #b4b4b4;
      --mvx-quiet: #7c7c7c;
      --mvx-accent: #eeb900;
      --mvx-accent-hover: #ffc915;
      --mvx-ink: #0a0a0a;
      --mvx-danger: #ff6b6b;
      --mvx-font: "Avenir Next", Avenir, "Segoe UI Variable Display", "Segoe UI",
        system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
    }

    html,
    body,
    body.login-pf,
    .login-pf body {
      background: var(--mvx-bg) !important;
      /* The same warm glow as /signup, drawn rather than fetched. */
      background-image:
        radial-gradient(60rem 40rem at 12% -10%, rgba(238, 185, 0, 0.14), transparent 60%),
        radial-gradient(45rem 30rem at 100% 0%, rgba(238, 185, 0, 0.05), transparent 55%) !important;
      color: var(--mvx-text) !important;
      font-family: var(--mvx-font) !important;
    }

    /* The head of the page is the product's wordmark, the same mark the console
       and the front door carry. Keycloak prints the realm's display name here;
       this theme overrides no template, so the name is pushed out of sight rather
       than removed — it stays in the page for a screen reader, and the mark is
       drawn behind it. */
    #kc-header-wrapper {
      display: block !important;
      box-sizing: content-box !important;
      height: 4rem !important;
      padding: 2rem 0 1.5rem !important;
      background-image: url("../img/wordmark.svg") !important;
      background-repeat: no-repeat !important;
      background-position: center !important;
      background-size: auto 4rem !important;
      background-origin: content-box !important;
      overflow: hidden !important;
      white-space: nowrap !important;
      text-indent: -200vw !important;
    }

    .login-pf-page .card-pf,
    .login-pf-page .pf-c-login__main {
      background: transparent !important;
      border: none !important;
      box-shadow: none !important;
      padding: 0 !important;
    }

    .login-pf-page {
      padding-top: min(12vh, 5rem) !important;
    }

    #kc-page-title,
    .pf-c-login__main-header-desc,
    .login-pf-page .login-pf-header h1 {
      color: var(--mvx-text) !important;
      font-size: clamp(1.75rem, 1.2rem + 2.2vw, 2.5rem) !important;
      line-height: 1.05 !important;
      font-weight: 800 !important;
      letter-spacing: -0.02em !important;
      text-align: left !important;
    }

    label,
    .pf-c-form__label,
    .pf-c-form__label-text,
    #kc-form-options,
    #kc-registration,
    #kc-registration-container,
    .login-pf-page .login-pf-signup,
    .instruction,
    #kc-info-message p {
      color: var(--mvx-muted) !important;
      font-family: var(--mvx-font) !important;
    }

    input[type="text"],
    input[type="password"],
    input[type="email"],
    .pf-c-form-control,
    input.form-control {
      background: var(--mvx-raised) !important;
      border: 1px solid var(--mvx-line) !important;
      border-radius: 0.5rem !important;
      color: var(--mvx-text) !important;
      font-family: var(--mvx-font) !important;
      font-size: 0.9375rem !important;
      padding: 0.8125rem 0.875rem !important;
      height: auto !important;
      box-shadow: none !important;
    }

    input::placeholder,
    .pf-c-form-control::placeholder {
      color: var(--mvx-quiet) !important;
    }

    input:focus,
    .pf-c-form-control:focus {
      border-color: var(--mvx-accent) !important;
      box-shadow: 0 0 0 3px rgba(238, 185, 0, 0.18) !important;
      outline: none !important;
    }

    /* Keycloak marks invalid fields with a red underline only; make the whole
       field say so, as the console's fields do. */
    .pf-c-form-control[aria-invalid="true"],
    input.form-control[aria-invalid="true"] {
      border-color: var(--mvx-danger) !important;
    }

    input[type="submit"],
    .pf-c-button.pf-m-primary,
    .btn-primary,
    #kc-login {
      background: var(--mvx-accent) !important;
      border: 1px solid transparent !important;
      border-radius: 0.5rem !important;
      color: var(--mvx-ink) !important;
      font-family: var(--mvx-font) !important;
      font-size: 0.9375rem !important;
      font-weight: 700 !important;
      padding: 0.8125rem 1.25rem !important;
      text-transform: none !important;
      box-shadow: none !important;
    }

    input[type="submit"]:hover,
    .pf-c-button.pf-m-primary:hover,
    .btn-primary:hover,
    #kc-login:hover {
      background: var(--mvx-accent-hover) !important;
    }

    /* The password field's show/hide toggle sits in an input group whose wrapper
       carries PatternFly's white background. The button itself is already
       transparent, so that white showed through as a square beside the field. */
    .pf-c-input-group,
    .input-group {
      background: transparent !important;
    }

    /* Field and toggle read as one control: square the edges where they meet. */
    .pf-c-input-group > .pf-c-form-control {
      border-top-right-radius: 0 !important;
      border-bottom-right-radius: 0 !important;
      border-right: none !important;
    }

    .pf-c-input-group > .pf-c-button.pf-m-control {
      border-top-left-radius: 0 !important;
      border-bottom-left-radius: 0 !important;
    }

    /* Secondary actions — an identity provider, "try another way", cancel. */
    .pf-c-button.pf-m-secondary,
    .pf-c-button.pf-m-control,
    .btn-default,
    #kc-social-providers a,
    .login-pf-page .kc-social-item {
      background: transparent !important;
      border: 1px solid var(--mvx-line-strong) !important;
      border-radius: 0.5rem !important;
      color: var(--mvx-text) !important;
      font-family: var(--mvx-font) !important;
      font-weight: 600 !important;
    }

    .pf-c-button.pf-m-secondary:hover,
    .btn-default:hover,
    #kc-social-providers a:hover,
    .login-pf-page .kc-social-item:hover {
      background: rgba(255, 255, 255, 0.06) !important;
      text-decoration: none !important;
    }

    a,
    a:visited,
    #kc-registration a,
    #kc-info-message a,
    .login-pf-page .login-pf-signup a {
      color: var(--mvx-accent) !important;
    }

    /* Field-level errors ("Invalid username or password.") render as helper text
       under the input, which inherits the label colour without this. */
    #input-error,
    #input-error-username,
    #input-error-password,
    .pf-c-form__helper-text.pf-m-error,
    .kc-feedback-text {
      color: var(--mvx-danger) !important;
    }

    /* Alerts: Keycloak's greens and reds are far too bright on black. */
    .alert,
    .pf-c-alert {
      background: var(--mvx-raised) !important;
      border: 1px solid var(--mvx-line) !important;
      border-left: 3px solid var(--mvx-accent) !important;
      border-radius: 0.375rem !important;
      color: var(--mvx-muted) !important;
      box-shadow: none !important;
    }

    .alert-error,
    .pf-c-alert.pf-m-danger,
    .pf-m-error {
      border-left-color: var(--mvx-danger) !important;
      color: var(--mvx-danger) !important;
    }

    .pf-c-alert__title,
    .kc-feedback-text {
      color: inherit !important;
    }

    /* The language picker and footer links sit quietly at the bottom. */
    #kc-locale,
    #kc-locale-dropdown a,
    .login-pf-page-footer,
    .pf-c-login__main-footer {
      color: var(--mvx-quiet) !important;
    }
  wordmark.svg: |
    <svg width="1332" height="383" viewBox="0 0 1332 383" fill="none" xmlns="http://www.w3.org/2000/svg">
    <!--
      The product's wordmark for a dark ground: MAVERICK in white, "Builds App" in
      the brand yellow. The console draws the same letters from
      web/src/branding/ProductMark.tsx, where MAVERICK takes currentColor because
      it has to read on light chrome too; here it is a plain image referenced from
      CSS, which cannot inherit a colour, so this file is the white cut.
    -->
