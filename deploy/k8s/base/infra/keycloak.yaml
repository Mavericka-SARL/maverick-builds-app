---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: mavericks
  labels:
    app: keycloak
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/component: identity
    app.kubernetes.io/part-of: mavericks-engine
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keycloak
  strategy:
    # Recreate avoids split-brain with the embedded dev database.
    # Switch to RollingUpdate once KC_DB=postgres is configured.
    type: Recreate
  template:
    metadata:
      labels:
        app: keycloak
        app.kubernetes.io/name: keycloak
        app.kubernetes.io/component: identity
        app.kubernetes.io/part-of: mavericks-engine
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:24.0
          imagePullPolicy: IfNotPresent
          command:
            - /opt/keycloak/bin/kc.sh
          args:
            - "start-dev"
            - "--import-realm"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: KEYCLOAK_ADMIN
              value: "admin"
            - name: KEYCLOAK_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mavericks-secrets
                  key: KEYCLOAK_ADMIN_PASSWORD
            # Dev-mode uses the embedded H2 database.
            # For production: KC_DB=postgres, KC_DB_URL, KC_DB_USERNAME, KC_DB_PASSWORD
            - name: KC_DB
              value: "dev-mem"
            # Hostname is required in production; set to your external FQDN.
            - name: KC_HOSTNAME_STRICT
              value: "false"
            - name: KC_PROXY
              value: "edge"
            # Theme resources are served under /resources/<server build>/,
            # a path that does not change when a theme file does, and the
            # default Cache-Control on them is 30 days: an edited stylesheet
            # stayed invisible to everyone who had opened sign-in before
            # (reported live, 2026-09-23 — the page kept its old head for
            # hours after the new one shipped). Five minutes instead; the
            # files are a few KB on a page nobody loads in a loop.
            - name: KC_SPI_THEME_STATIC_MAX_AGE
              value: "300"
          volumeMounts:
            - name: realm-config
              mountPath: /opt/keycloak/data/import
              readOnly: true
            # subPath, because the two files belong in different directories
            # of the theme and a ConfigMap key cannot contain a slash.
            - name: login-theme
              mountPath: /opt/keycloak/themes/maverickbuilds/login/theme.properties
              subPath: theme.properties
              readOnly: true
            - name: login-theme
              mountPath: /opt/keycloak/themes/maverickbuilds/login/resources/css/brand.css
              subPath: brand.css
              readOnly: true
            - name: login-theme
              mountPath: /opt/keycloak/themes/maverickbuilds/login/resources/img/wordmark.svg
              subPath: wordmark.svg
              readOnly: true
            - name: login-theme
              mountPath: /opt/keycloak/themes/maverickbuilds/login/resources/img/favicon.ico
              subPath: favicon.ico
              readOnly: true
            - name: login-theme
              mountPath: /opt/keycloak/themes/maverickbuilds/login/resources/js/brand.js
              subPath: brand.js
              readOnly: true
          resources:
            requests:
              cpu: "200m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          readinessProbe:
            httpGet:
              path: /realms/master
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /realms/master
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 3
      volumes:
        - name: realm-config
          configMap:
            name: keycloak-realm
        - name: login-theme
          configMap:
            name: keycloak-theme

---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: mavericks
  labels:
    app: keycloak
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/component: identity
    app.kubernetes.io/part-of: mavericks-engine
spec:
  type: ClusterIP
  selector:
    app: keycloak
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
