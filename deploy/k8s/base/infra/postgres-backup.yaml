# postgres-backup — daily pg_dump snapshot to MinIO, pruned by
# BACKUP_RETENTION_DAYS. This is a periodic full-dump snapshot mechanism,
# NOT continuous point-in-time recovery — infra/postgres.yaml's WAL
# archive is still an emptyDir (ephemeral); wiring WAL-G/pgBackRest for
# continuous archiving remains a separate, larger, not-yet-addressed item.
#
# Connects directly to postgres:5432 (see pg-backup.sh's own comment for
# why, not pgbouncer:5433 like every other service).
#
# Restore (deploy/docker/pg-backup/pg-restore.sh) is deliberately NOT
# wired into this CronJob — it's a manual, human-triggered operation, run
# via a one-off pod overriding this image's command, e.g.:
#   kubectl run pg-restore --rm -it --restart=Never \
#     --image=registry.example.com/mavericks/postgres-backup:latest \
#     --overrides='{"spec":{"containers":[{"name":"pg-restore","image":"registry.example.com/mavericks/postgres-backup:latest","command":["pg-restore.sh","latest"],"env":[{"name":"RESTORE_DATABASE_URL","value":"postgres://mavericks:<password>@postgres:5432/mavericks?sslmode=disable"},{"name":"CONFIRM_RESTORE","value":"yes"}],"envFrom":[{"configMapRef":{"name":"mavericks-config"}},{"secretRef":{"name":"mavericks-secrets"}}]}]}}' \
#     -n mavericks
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup
  namespace: mavericks
  labels:
    app: postgres-backup
    app.kubernetes.io/name: postgres-backup
    app.kubernetes.io/component: job
    app.kubernetes.io/part-of: mavericks-engine
spec:
  schedule: "0 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app: postgres-backup
            app.kubernetes.io/name: postgres-backup
            app.kubernetes.io/component: job
            app.kubernetes.io/part-of: mavericks-engine
        spec:
          restartPolicy: OnFailure
          terminationGracePeriodSeconds: 30
          containers:
            - name: postgres-backup
              image: registry.example.com/mavericks/postgres-backup:latest
              # Always, unlike the long-running services whose overlays set it:
              # a CronJob's pod template is neither a Deployment nor a Job, so
              # those patches never reached it, and the nightly run kept using
              # whatever :latest a node had cached. A published fix to the
              # backup script then could not take effect — which is exactly
              # how it happened (2026-09-17). One pull a night costs nothing.
              imagePullPolicy: Always
              envFrom:
                - configMapRef:
                    name: mavericks-config
                - secretRef:
                    name: mavericks-secrets
              # DATABASE_URL here targets postgres:5432 directly — every
              # other service's identical-looking env entry targets
              # pgbouncer:5433 instead, see pg-backup.sh's header comment.
              env:
                - name: DATABASE_URL
                  value: "postgres://mavericks:$(POSTGRES_PASSWORD)@postgres:5432/mavericks?sslmode=disable"
                # "all" also dumps every tenant_* database as its own object,
                # so one tenant can be restored alone (docs/TENANT_DATABASES.md).
                - name: BACKUP_DATABASES
                  value: "all"
              resources:
                requests:
                  cpu: "100m"
                  memory: "128Mi"
                limits:
                  cpu: "500m"
                  memory: "512Mi"
              securityContext:
                runAsUser: 70
                runAsGroup: 70

---
# The watchdog: a second job whose only purpose is to notice that the first one
# did not happen.
#
# Production ran without backups for three consecutive nights in September 2026
# because pg-backup.sh failed and nothing said so — the CronJob dutifully
# recorded each failure where nobody was looking. Checking the RESULT from a
# separate job catches every shape of that: a dump that failed, a CronJob that
# was never scheduled, a bucket that was renamed, credentials that stopped
# working. A job that watched itself could not.
#
# ALERT_EMAIL in mavericks-config is where it reports; with none set it still
# fails loudly, which is the most a job can do on its own.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup-watchdog
  namespace: mavericks
  labels:
    app: postgres-backup-watchdog
    app.kubernetes.io/name: postgres-backup-watchdog
    app.kubernetes.io/component: job
    app.kubernetes.io/part-of: mavericks-engine
spec:
  # Two hours after the 03:00 dump: long enough for a slow night to finish,
  # early enough that a person reading mail at breakfast still has the day to
  # fix it.
  schedule: "0 5 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 7
  jobTemplate:
    spec:
      # No retry: the answer would not change within a minute, and three
      # identical alerts are worse than one.
      backoffLimit: 0
      template:
        metadata:
          labels:
            app: postgres-backup-watchdog
            app.kubernetes.io/name: postgres-backup-watchdog
            app.kubernetes.io/component: job
            app.kubernetes.io/part-of: mavericks-engine
        spec:
          restartPolicy: Never
          terminationGracePeriodSeconds: 30
          containers:
            - name: postgres-backup-watchdog
              image: registry.example.com/mavericks/postgres-backup:latest
              imagePullPolicy: Always
              command: ["/usr/local/bin/backup-watchdog.sh"]
              envFrom:
                - configMapRef:
                    name: mavericks-config
                - secretRef:
                    name: mavericks-secrets
                # The relay credentials the gateway sends with
                # (scripts/seal-smtp-secret.sh); absent on a deployment
                # without a relay, where the alert is log-only.
                - secretRef:
                    name: mavericks-smtp
                    optional: true
              resources:
                requests:
                  cpu: "50m"
                  memory: "64Mi"
                limits:
                  cpu: "200m"
                  memory: "256Mi"
              securityContext:
                runAsUser: 70
                runAsGroup: 70
