# node-stats — one tiny pod per node reporting disk/memory/load into
# ops.node_stat every 5 minutes, surfaced in the admin consoles at
# /api/admin/infra/nodes, and mailing ALERT_EMAIL when the node's disk fills
# or the kernel kills a process for lack of memory. Reuses the postgres-backup image purely for its
# psql; the host filesystem is observed via a read-only hostPath statfs
# (df needs no file reads) and /proc via its own read-only mount.
# Talks to postgres:5432 directly, same as postgres-backup and for the same
# reason (its NetworkPolicy peer is postgres, not pgbouncer).
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-stats
  namespace: mavericks
  labels:
    app: node-stats
    app.kubernetes.io/name: node-stats
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: mavericks-engine
spec:
  selector:
    matchLabels: {app: node-stats}
  template:
    metadata:
      labels:
        app: node-stats
        app.kubernetes.io/name: node-stats
        app.kubernetes.io/component: monitoring
        app.kubernetes.io/part-of: mavericks-engine
    spec:
      terminationGracePeriodSeconds: 10
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      containers:
        - name: node-stats
          image: registry.example.com/mavericks/postgres-backup:latest
          # Always: under a "latest" tag a node keeps the copy it has, and an
          # older one has no node-stats.sh (the command below).
          imagePullPolicy: Always
          envFrom:
            - secretRef:
                name: mavericks-secrets
            # ALERT_EMAIL, and the relay the gateway sends with
            # (scripts/seal-smtp-secret.sh); without them the alerts are
            # log-only.
            - configMapRef:
                name: mavericks-config
            - secretRef:
                name: mavericks-smtp
                optional: true
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef: {fieldPath: spec.nodeName}
            - name: DATABASE_URL
              value: "postgres://mavericks:$(POSTGRES_PASSWORD)@postgres:5432/mavericks?sslmode=disable"
            - name: ALERT_WHERE
              valueFrom:
                fieldRef: {fieldPath: metadata.namespace}
          # Samples the node and mails ALERT_EMAIL when its disk fills or
          # the kernel kills a process for lack of memory
          # (deploy/docker/pg-backup/node-stats.sh).
          command: ["/usr/local/bin/node-stats.sh"]
          volumeMounts:
            - {name: hostroot, mountPath: /host, readOnly: true}
            - {name: hostproc, mountPath: /host_proc, readOnly: true}
          resources:
            requests: {cpu: "10m", memory: "32Mi"}
            limits: {cpu: "100m", memory: "64Mi"}
      volumes:
        - name: hostroot
          hostPath: {path: /, type: Directory}
        - name: hostproc
          hostPath: {path: /proc, type: Directory}

---
# daily-check — one mail every morning with each node's latest sample
# (deploy/docker/pg-backup/daily-check.sh). node-stats mails only when
# something is wrong; this one comes every day, so a missing mail says the
# watcher, the relay or the cluster broke, and a node whose node-stats pod
# stopped sampling is named in the subject.
#
# Labelled app: node-stats for that pod's network policy (postgres:5432 and
# the mail relay); its owner is the Job, so the DaemonSet does not adopt it.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: daily-check
  namespace: mavericks
  labels:
    app: node-stats
    app.kubernetes.io/name: daily-check
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: mavericks-engine
spec:
  # After the 05:00 backup watchdog, before a working day in Europe.
  schedule: "0 6 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # No retry: a second mail would say the same.
      backoffLimit: 0
      template:
        metadata:
          labels:
            app: node-stats
            app.kubernetes.io/name: daily-check
            app.kubernetes.io/component: monitoring
            app.kubernetes.io/part-of: mavericks-engine
        spec:
          restartPolicy: Never
          terminationGracePeriodSeconds: 10
          containers:
            - name: daily-check
              image: registry.example.com/mavericks/postgres-backup:latest
              imagePullPolicy: Always
              command: ["/usr/local/bin/daily-check.sh"]
              envFrom:
                - secretRef:
                    name: mavericks-secrets
                - configMapRef:
                    name: mavericks-config
                - secretRef:
                    name: mavericks-smtp
                    optional: true
              env:
                - name: DATABASE_URL
                  value: "postgres://mavericks:$(POSTGRES_PASSWORD)@postgres:5432/mavericks?sslmode=disable"
                - name: ALERT_WHERE
                  valueFrom:
                    fieldRef: {fieldPath: metadata.namespace}
              resources:
                requests: {cpu: "10m", memory: "32Mi"}
                limits: {cpu: "100m", memory: "64Mi"}
              securityContext:
                runAsUser: 70
                runAsGroup: 70
