# node-stats — one tiny pod per node reporting disk/memory/load into
# ops.node_stat every 5 minutes, surfaced in the admin consoles at
# /api/admin/infra/nodes. Reuses the postgres-backup image purely for its
# psql; the host filesystem is observed via a read-only hostPath statfs
# (df needs no file reads) and /proc via its own read-only mount.
# Talks to postgres:5432 directly, same as postgres-backup and for the same
# reason (its NetworkPolicy peer is postgres, not pgbouncer).
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-stats
  namespace: mavericks
  labels:
    app: node-stats
    app.kubernetes.io/name: node-stats
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: mavericks-engine
spec:
  selector:
    matchLabels: {app: node-stats}
  template:
    metadata:
      labels:
        app: node-stats
        app.kubernetes.io/name: node-stats
        app.kubernetes.io/component: monitoring
        app.kubernetes.io/part-of: mavericks-engine
    spec:
      terminationGracePeriodSeconds: 10
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      containers:
        - name: node-stats
          image: ghcr.io/konstantintokarev/mavericks/postgres-backup:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: mavericks-secrets
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef: {fieldPath: spec.nodeName}
            - name: DATABASE_URL
              value: "postgres://mavericks:$(POSTGRES_PASSWORD)@postgres:5432/mavericks?sslmode=disable"
          command:
            - /bin/sh
            - -c
            - |
              while true; do
                line=$(df -k /host | tail -1)
                total_kb=$(echo "$line" | awk '{print $2}')
                used_kb=$(echo "$line" | awk '{print $3}')
                pct=$(echo "$line" | awk '{print $5}' | tr -dc '0-9')
                total_gb=$(awk "BEGIN{printf \"%.1f\", $total_kb/1048576}")
                used_gb=$(awk "BEGIN{printf \"%.1f\", $used_kb/1048576}")
                mem_total=$(awk '/MemTotal/{printf "%d", $2/1024}' /host_proc/meminfo)
                mem_avail=$(awk '/MemAvailable/{printf "%d", $2/1024}' /host_proc/meminfo)
                load1=$(awk '{print $1}' /host_proc/loadavg)
                psql "$DATABASE_URL" -q -c "INSERT INTO ops.node_stat (node, disk_total_gb, disk_used_gb, disk_pct, mem_total_mb, mem_available_mb, load1) VALUES ('$NODE_NAME', $total_gb, $used_gb, $pct, $mem_total, $mem_avail, $load1); DELETE FROM ops.node_stat WHERE collected_at < now() - interval '7 days';" || true
                sleep 300
              done
          volumeMounts:
            - {name: hostroot, mountPath: /host, readOnly: true}
            - {name: hostproc, mountPath: /host_proc, readOnly: true}
          resources:
            requests: {cpu: "10m", memory: "32Mi"}
            limits: {cpu: "100m", memory: "64Mi"}
      volumes:
        - name: hostroot
          hostPath: {path: /, type: Directory}
        - name: hostproc
          hostPath: {path: /proc, type: Directory}
