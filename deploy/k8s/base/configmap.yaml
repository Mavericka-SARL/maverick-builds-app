# Non-sensitive runtime configuration shared by the gateway and the integration worker.
# Secrets (passwords, tokens) live in mavericks-secrets and are NOT here.
apiVersion: v1
kind: ConfigMap
metadata:
  name: mavericks-config
  namespace: mavericks
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/part-of: mavericks-engine
data:
  # PostgreSQL connection via PgBouncer (transaction pool mode, port 5433).
  # DATABASE_URL is NOT set here: envFrom (used to inject this ConfigMap)
  # never performs $(VAR) expansion on the values it contributes — only a
  # container's own explicit `env:` list does that, and only by referencing
  # a variable already present in the environment (including one already
  # contributed by envFrom). Each service manifest therefore composes its
  # own DATABASE_URL via an explicit `env:` entry referencing
  # $(POSTGRES_PASSWORD), which mavericks-secrets already provides via
  # envFrom's secretRef. See services/gateway.yaml for the pattern.

  # Keycloak identity provider (internal cluster address)
  KEYCLOAK_URL: "http://keycloak:8080"
  KEYCLOAK_REALM: "mavericks"

  # MinIO object storage (S3-compatible). MINIO_ROOT_USER is plain
  # (non-secret) config, matching infra/minio.yaml's own pod env; the
  # password counterpart is in mavericks-secrets (MINIO_ROOT_PASSWORD).
  # Previously only MinIO's own pod had MINIO_ROOT_USER — consumers (the
  # gateway) had no way to authenticate against it until this key was added.
  MINIO_URL: "http://minio:9000"
  MINIO_ROOT_USER: "mavericks"
  OBJECT_STORE_BUCKET: "mavericks"

  # The gateway's listener port
  HTTP_PORT: "8080"

  # OpenTelemetry collector endpoint (no schema — gRPC plain-text)
  OTEL_ENDPOINT: "otel-collector:4317"

  # AI Developer LLM call caps: per chat session, and per user per UTC day.
  # Every model call counts, read-tool round trips included.
  AI_MAX_CALLS_PER_SESSION: "200"
  AI_MAX_CALLS_PER_DAY: "1000"
