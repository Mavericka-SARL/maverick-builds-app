# The single public entry point, terminating TLS in-cluster with Traefik +
# cert-manager.
#
# Path routing rather than two hostnames: the frontend calls RELATIVE /api
# paths (see web/src/api/client.ts — fetch(path), no base URL), so serving the
# console and the API from one origin avoids CORS entirely and keeps cookies
# same-site. Traefik ranks routers by the length of their rule, so the /api
# prefix is tried before "/", which would otherwise swallow it.
#
# Keycloak is the one exception, and it needs its OWN hostname rather than a
# path on the main one: KC_HOSTNAME is a whole-origin setting, and Keycloak
# builds issuer, redirect and JWKS URLs from it. Serving it under a path
# prefix means rewriting those URLs, which breaks the discovery document.
# Browsers reach it here; in-cluster callers keep using http://keycloak:8080.
#
# PREREQUISITES — this resource does nothing on its own:
#   1. Traefik installed with deploy/k8s/bootstrap/traefik-values.yaml, which
#      provides the "traefik" IngressClass, the one LoadBalancer Service that
#      fronts the whole cluster, and the HTTP-to-HTTPS redirect.
#   2. cert-manager installed, plus the ClusterIssuer in
#      deploy/k8s/bootstrap/cert-manager-issuer.yaml.
#   3. A DNS A record for the host below pointing at Traefik's LoadBalancer
#      IP. Certificate issuance FAILS until DNS resolves, because the HTTP-01
#      challenge is served through this same entry point.
#
# What ingress-nginx needed annotations for, until 2026-09, and where it lives
# now:
#   - HTTPS redirect: Traefik's web entry point redirects every request
#     (traefik-values.yaml), and this Ingress's routes exist on HTTPS only
#     (the router.entrypoints annotation below). No extra LoadBalancer
#     publishes port 80 either — the gateway-lb Service left base for that
#     reason.
#   - The 32 MB body limit CSV/XLSX imports need: the gateway enforces it
#     itself (maxRequestBodyBytes, internal/gateway/handler.go); Traefik sets
#     none.
#   - 300 s timeouts for streamed AI answers and synchronous recalculation:
#     Traefik never times out a slow backend response by default, and its
#     request read timeout is raised to 300 s for slow uploads.
#   - 16 KB header buffers: ingress-nginx answered 502 "upstream sent too big
#     header" to Keycloak's login response once a browser already had session
#     cookies (KC_RESTART alone is ~1.1 KB). Traefik has no such small fixed
#     buffer.
#
# The hosts are placeholders. Patch them, and mavericks-web-config's
# KEYCLOAK_URL, in your overlay — they must agree or login redirects break.
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mavericks
  namespace: mavericks
  labels:
    app.kubernetes.io/name: mavericks
    app.kubernetes.io/component: ingress
    app.kubernetes.io/part-of: mavericks-engine
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    # HTTPS only. Traefik attaches an Ingress's routes to every entry point,
    # port 80 included, and those outrank the HTTP-to-HTTPS redirect, which
    # traefik-values.yaml gives the lowest priority so cert-manager's challenge
    # path is served. Without this line the console answered plain HTTP with
    # 200 instead of redirecting (found rehearsing the move off ingress-nginx).
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - mavericks.example.com
      # cert-manager creates and renews this Secret; do not create it by hand.
      secretName: mavericks-tls
    # A separate certificate rather than a second SAN on the one above: the
    # two hosts are then issued and renewed independently, so a problem with
    # the auth hostname cannot take the console's working certificate with it.
    - hosts:
        - auth.mavericks.example.com
      secretName: mavericks-auth-tls
  rules:
    - host: mavericks.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: gateway
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 8080
    - host: auth.mavericks.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: keycloak
                port:
                  number: 8080
