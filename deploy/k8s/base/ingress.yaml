# The single public entry point, terminating TLS in-cluster with
# ingress-nginx + cert-manager.
#
# Path routing rather than two hostnames: the frontend calls RELATIVE /api
# paths (see web/src/api/client.ts — fetch(path), no base URL), so serving the
# console and the API from one origin avoids CORS entirely and keeps cookies
# same-site. /api is listed first because ingress-nginx matches the longest
# prefix, and "/" would otherwise swallow it.
#
# Keycloak is the one exception, and it needs its OWN hostname rather than a
# path on the main one: KC_HOSTNAME is a whole-origin setting, and Keycloak
# builds issuer, redirect and JWKS URLs from it. Serving it under a path
# prefix means rewriting those URLs, which breaks the discovery document.
# Browsers reach it here; in-cluster callers keep using http://keycloak:8080.
#
# PREREQUISITES — this resource does nothing on its own:
#   1. ingress-nginx installed (provides the ingressClass and the one
#      LoadBalancer Service that fronts the whole cluster).
#   2. cert-manager installed, plus the ClusterIssuer in
#      deploy/k8s/bootstrap/cert-manager-issuer.yaml.
#   3. A DNS A record for the host below pointing at the ingress-nginx
#      LoadBalancer's IP. Certificate issuance FAILS until DNS resolves,
#      because the HTTP-01 challenge is served through this same Ingress.
#
# The host is a placeholder. Patch it, and mavericks-web-config's KEYCLOAK_URL,
# in the prod overlay — they must agree or login redirects break.
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mavericks
  namespace: mavericks
  labels:
    app.kubernetes.io/name: mavericks
    app.kubernetes.io/component: ingress
    app.kubernetes.io/part-of: mavericks-engine
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    # Redirect plain HTTP to HTTPS. The gateway-lb Service was removed from
    # base for the same reason: with TLS terminating here, an extra
    # LoadBalancer publishing the API over port 80 would bypass it.
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    # CSV and XLSX imports post whole files; the default 1m body limit
    # rejects them (see internal/importpkg — a 10,000-row upload is routine).
    nginx.ingress.kubernetes.io/proxy-body-size: "32m"
    # The AI assistant streams responses and large imports recalculate
    # synchronously; the 60s default cuts both off mid-flight.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    # Keycloak's login response carries several Set-Cookie headers, and
    # KC_RESTART alone is ~1.1KB (a JWE holding the whole pending auth
    # request). A fresh request totals ~1.9KB of headers, but a browser that
    # already has session cookies pushes the response past nginx's 4k default
    # and nginx answers 502 with "upstream sent too big header" — a hard
    # failure on the login redirect itself, so nobody can sign in.
    #
    # curl does not reproduce it: without prior cookies the response stays
    # under 4k and returns 200, which is why this survived the earlier checks.
    nginx.ingress.kubernetes.io/proxy-buffer-size: "16k"
    nginx.ingress.kubernetes.io/proxy-buffers-number: "4"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - mavericks.example.com
      # cert-manager creates and renews this Secret; do not create it by hand.
      secretName: mavericks-tls
    # A separate certificate rather than a second SAN on the one above: the
    # two hosts are then issued and renewed independently, so a problem with
    # the auth hostname cannot take the console's working certificate with it.
    - hosts:
        - auth.mavericks.example.com
      secretName: mavericks-auth-tls
  rules:
    - host: mavericks.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: gateway
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 8080
    - host: auth.mavericks.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: keycloak
                port:
                  number: 8080
