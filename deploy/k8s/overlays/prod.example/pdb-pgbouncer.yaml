# PgBouncer runs two replicas (pgbouncer-ha.yaml): a voluntary
# eviction (a node drain) keeps one serving.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: pgbouncer
  namespace: mavericks
  labels: {app: pgbouncer}
spec:
  minAvailable: 1
  selector:
    matchLabels: {app: pgbouncer}
