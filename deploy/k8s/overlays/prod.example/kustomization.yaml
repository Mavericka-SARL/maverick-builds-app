# Example production overlay. Copy this directory to deploy/k8s/overlays/prod
# (ignored by git here) and edit the copy — docs/SELF_HOSTING.md, "Install on
# Kubernetes", walks through every value. Nothing here names a real cluster.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: mavericks

resources:
  - ../../base
  - pdb-gateway.yaml             # keep a gateway replica through node drains
  # Sealed secrets, if the overlay lives in git (docs/SELF_HOSTING.md, step 4):
  #   - sealed-secrets.yaml      # scripts/seal-secrets.sh
  #   - sealed-integration.yaml  # scripts/seal-integration-secret.sh
  #   - sealed-smtp.yaml         # scripts/seal-smtp-secret.sh

# The gateway and the console are the parts people wait on; two of each ride
# out a node drain. Scale the rest as load requires.
replicas:
  - name: gateway
    count: 2
  - name: web
    count: 2

patches:
  # Host names, storage, the mail relay, Keycloak on Postgres: every value
  # that belongs to this site.
  - path: site.yaml
  - path: networkpolicy-keycloak.yaml
  # Object storage outside the cluster (docs/SELF_HOSTING.md, step 3):
  #   - path: minio-remove.yaml
  #   - path: networkpolicy-external-objectstore.yaml

  # Pull on every pod start, so a tag pushed again is never served stale from
  # a node's cache. Deployments, StatefulSets and Jobs each need their own
  # target, and postgres's second container (the WAL-G base backup) its own.
  - patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Always
    target:
      kind: Deployment
  - patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Always
    target:
      kind: StatefulSet
  - patch: |-
      - op: replace
        path: /spec/template/spec/containers/1/imagePullPolicy
        value: Always
    target:
      kind: StatefulSet
      name: postgres

# Where the images come from: the published release images of
# ghcr.io/mavericka-sarl/mavericks (one tag per release, listed on the
# repository's Releases page). To run images you built yourself, replace this
# block with the one scripts/build-images.sh prints. Each name is the base
# manifests' own; newName and newTag say where to pull it. Never "latest": a
# pod restarted for any reason would pull whatever was pushed last.
images:
  - name: registry.example.com/mavericks/ai-assistant
    newName: ghcr.io/mavericka-sarl/mavericks/ai-assistant
    newTag: "2026.09.26"
