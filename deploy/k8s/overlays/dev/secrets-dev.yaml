# DEV OVERLAY ONLY — known, throwaway credentials for a local cluster.
#
# This used to sit in base/, which meant every overlay (including prod)
# inherited "changeme" as its JWT signing secret. It now lives here so that
# applying the prod overlay CANNOT silently pick up these values: prod gets a
# SealedSecret instead, which is encrypted to one specific cluster's key and is
# safe to commit. See deploy/k8s/overlays/prod/README-secrets.md.
#
# base64 is ENCODING, not encryption — treat every value below as public:
#   POSTGRES_PASSWORD   → "mavericks"
#   MINIO_ROOT_PASSWORD → "mavericks123"
#   JWT_SECRET          → "changeme"
#
# Never point this overlay at anything reachable from the internet.
apiVersion: v1
kind: Secret
metadata:
  name: mavericks-secrets
  namespace: mavericks
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/part-of: mavericks-engine
  annotations:
    # Remind operators that real secrets must be injected externally.
    mavericks.io/secret-source: "placeholder — replace with ESO or Vault"
type: Opaque
data:
  POSTGRES_PASSWORD: bWF2ZXJpY2tz          # mavericks
  MINIO_ROOT_PASSWORD: bWF2ZXJpY2tzMTIz   # mavericks123
  JWT_SECRET: Y2hhbmdlbWU=                 # changeme
  # Keycloak admin password (reuses POSTGRES_PASSWORD slot for dev convenience)
  KEYCLOAK_ADMIN_PASSWORD: bWF2ZXJpY2tz   # mavericks
