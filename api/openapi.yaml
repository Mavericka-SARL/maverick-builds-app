    ValidateWorkflowResponse:
      type: object
      required: [valid, errors]
      properties:
        valid:  { type: boolean }
        errors: { type: array, items: { type: string } }

    WorkflowDefUsage:
      type: object
      required: [rule_id, rule_name, trigger_type, enabled]
      properties:
        rule_id:      { type: string, format: uuid }
        rule_name:    { type: string }
        trigger_type: { type: string }
        enabled:      { type: boolean }

    WorkflowInstanceSummary:
      type: object
      required: [id, rule_id, application_id, status, trigger_payload, started_at]
      properties:
        id:              { type: string, format: uuid }
        rule_id:         { type: string }
        application_id:  { type: string, format: uuid }
        status:          { type: string }
        trigger_payload: { type: object, additionalProperties: { type: string } }
        instance_id:     { type: string, format: uuid }
        error:           { type: string }
        started_at:      { type: string, format: date-time }
        completed_at:    { type: string, format: date-time, nullable: true }

    TriggerPayloadField:
      type: object
      required: [key, type, required]
      properties:
        key:      { type: string }
        type:     { type: string }
        required: { type: boolean }

    TriggerEventCatalogItem:
      type: object
      required: [key, label, description, category, source_type, payload_schema, enabled, created_from]
      properties:
        key:            { type: string }
        label:          { type: string }
        description:    { type: string }
        category:       { type: string }
        source_type:    { type: string }
        source_id:      { type: string }
        source_name:    { type: string }
        payload_schema: { type: array, items: { $ref: "#/components/schemas/TriggerPayloadField" } }
        enabled:        { type: boolean }
        created_from:   { type: string }

    WorkflowRoleRef:
      type: object
      required: [id, name]
      properties:
        id:   { type: string, format: uuid }
        name: { type: string }

    UserAssignment:
      type: object
      required: [role, workspace_id, workspace_name, customer_name]
      properties:
        role:           { type: string }
        workspace_id:   { type: string, description: Empty string means platform-level role }
        workspace_name: { type: string }
        customer_name:  { type: string }

    AdminUser:
      type: object
      required: [id, email, display_name, created_at, assignments, app_ids, model_ids, home_tenant, permissions, grantable_roles]
      properties:
        tenant_id:
          type: string
          description: >-
            The database the row lives in, as the console addresses it
            (X-Tenant-Id): a dedicated tenant's id, "control-plane" for the
            control plane, or empty with a single database. Lists span every
            database a platform admin sees, or every home of anyone else.
        tenant_name:   { type: string, description: The dedicated tenant's name, when the row is in one. }
        id:            { type: string, format: uuid }
        email:         { type: string, format: email }
        display_name:  { type: string }
        created_at:    { type: string }
        assignments:
          type: array
          items: { $ref: "#/components/schemas/UserAssignment" }
          description: >-
            The account's roles. For a caller whose scope is not every tenant,
            only those in workspaces of the caller's tenants, and those with no
            workspace when the account's home_tenant is "own" or "none" (they
            apply there); its roles elsewhere are not shown. The caller's own
            account is shown whole.
        app_ids:
          type: array
          items: { type: string, format: uuid }
          description: Its application grants; limited as assignments are, to applications of the caller's tenants.
        model_ids:
          type: array
          items: { type: string, format: uuid }
          description: Its model grants; limited as assignments are, to models of the caller's tenants.
        home_tenant:
          type: string
          enum: [own, other, none]
          description: >-
            Where the account's own tenant (identity.user customer_id) is, seen
            from the caller: one of the tenants the caller administers ("own";
            for a caller whose scope is every tenant, any tenant), another
            tenant ("other"), or no tenant ("none"). A member whose account
            another database holds is "other".
        permissions: { $ref: "#/components/schemas/AdminUserPermissions" }
        grantable_roles:
          type: array
          items: { type: string }
          description: >-
            The roles the caller may grant this account with no workspace, by
            its tier in the account's own tenant: none on an account whose
            home_tenant is "other", and for an account with no tenant never
            developer or tenant_admin unless the caller is a platform admin.
            Inside a workspace, that workspace's grantable_roles apply.

    AdminUserPermissions:
      type: object
      description: >-
        The account-level actions the caller may take on this account,
        computed by the same rule the mutations enforce (accountPermissionsFor
        in internal/gateway/account_boundaries.go). Anyone but a platform admin
        renames, deletes, disables, re-invites or changes the e-mail of an
        account only when its home_tenant is "own" (or, for a caller whose
        scope is every tenant, "none"), it is not a platform admin or a
        platform-wide builder, and the caller may revoke every role the
        account holds, anywhere (its own account it renames and re-invites
        whatever it holds); an account whose home is elsewhere is removed
        from the caller's tenant instead (remove_from_tenant), by a tenant
        admin who may revoke every role it holds there. A platform admin has
        every action but deleting itself, and no remove_from_tenant (its
        scope names no one tenant). The gateway has no disable endpoint;
        "disable" states the rule for the account's own tenant (SCIM).
      required: [rename, delete, disable, reinvite, remove_from_tenant]
      properties:
        rename:             { type: boolean }
        delete:             { type: boolean }
        disable:            { type: boolean }
        reinvite:           { type: boolean }
        remove_from_tenant: { type: boolean }

    RevokedGrant:
      type: object
      description: >-
        An unscoped developer grant a removal also took away: the removal took
        the last application or model grant narrowing an account with no
        tenant, which would otherwise have been a builder of every tenant.
      required: [user_id, email, role]
      properties:
        user_id: { type: string, format: uuid }
        email:   { type: string }
        role:    { type: string }

    AuditEvent:
      type: object
      description: >-
        The shape actually returned by GET /api/admin/audit (auditEventItem
        in internal/gateway/handler.go). The endpoint accepts no query
        parameters despite the SQL comment structure suggesting filters —
        it unconditionally returns the 200 most recent events.
      required: [id, category, event_type, actor_name, actor_role, application_id, application_name, resource_type, resource_id, revision_id, revision_name, occurred_at]
      properties:
        tenant_id:
          type: string
          description: >-
            The database the row lives in, as the console addresses it
            (X-Tenant-Id): a dedicated tenant's id, "control-plane" for the
            control plane, or empty with a single database. Lists span every
            database a platform admin sees, or every home of anyone else.
        tenant_name:   { type: string, description: The dedicated tenant's name, when the event is in one. }
        id:            { type: string, format: uuid }
        category:
          type: string
          enum: [auth, data_change, model_change, policy_change, admin, ai_assistant]
        event_type:    { type: string }
        actor_name:    { type: string, description: "\"system\" when there is no actor user" }
        actor_role:    { type: string }
        application_id:   { type: string }
        application_name: { type: string }
        resource_type: { type: string }
        resource_id:   { type: string }
        revision_id:   { type: string }
        revision_name: { type: string }
        metadata:
          type: object
          additionalProperties: {}
        occurred_at:   { type: string, format: date-time }

    AdminRevisionItem:
      type: object
      required: [id, name, created_at]
      properties:
        id:         { type: string, format: uuid }
        name:       { type: string }
        created_at: { type: string }

    AdminModel:
      type: object
      required: [id, name, storage_type, active_revision, revisions]
      properties:
        id:              { type: string, format: uuid }
        name:            { type: string }
        storage_type:    { type: string }
        active_revision: { type: string, nullable: true }
        revisions:       { type: array, items: { $ref: "#/components/schemas/AdminRevisionItem" } }

    AdminApp:
      type: object
      required: [id, name, mode, status, models]
      properties:
        id:     { type: string, format: uuid }
        name:   { type: string }
        mode:   { type: string, enum: [planning, crud, execution] }
        status: { type: string }
        models: { type: array, items: { $ref: "#/components/schemas/AdminModel" } }

    AdminWorkspace:
      type: object
      required: [id, name, customer_name, customer_id, grantable_roles, manage_access]
      properties:
        tenant_id:
          type: string
          description: >-
            The database the row lives in, as the console addresses it
            (X-Tenant-Id): a dedicated tenant's id, "control-plane" for the
            control plane, or empty with a single database. Lists span every
            database a platform admin sees, or every home of anyone else.
        id:            { type: string, format: uuid }
        name:          { type: string }
        customer_name: { type: string }
        customer_id:   { type: string, format: uuid }
        grantable_roles:
          type: array
          items: { type: string }
          description: >-
            The roles the caller may grant inside this workspace (to an
            existing account, or by invitation), by its tier in the
            workspace's tenant: a tenant admin of that tenant every role but
            platform_admin, a developer of it the business roles. Roles count
            per tenant: what the caller holds in another tenant adds nothing
            here.
        manage_access:
          type: boolean
          description: >-
            Whether the caller may grant and revoke access to this tenant's
            applications and models: a platform admin, or a tenant admin of
            the workspace's tenant.

    AdminTenant:
      type: object
      required: [id, name, plan, created_at, applications]
      properties:
        status:       { type: string, description: "Why a dedicated tenant's database could not be read (provisioning, failed, disabled); absent when it was." }
        error:        { type: string }
        id:           { type: string, format: uuid }
        name:         { type: string }
        plan:         { type: string }
        created_at:   { type: string }
        applications: { type: array, items: { $ref: "#/components/schemas/AdminApp" } }
        plan_state:   { $ref: "#/components/schemas/PlanState" }
        dedicated:
          type: boolean
          description: >-
            The tenant has a database of its own. A platform admin acts on its
            people by addressing it (X-Tenant-Id).

    CreateTenantRequest:
      type: object
      required: [name]
      properties:
        name: { type: string }
        plan: { type: string, default: standard }

    UpdateTenantRequest:
      type: object
      properties:
        name: { type: string }
        # Platform administrators only: the plan key.
        plan: { type: string }

    AdminApplicationItem:
      type: object
      required: [id, customer_id, name, mode, status, created_at]
      properties:
        id:          { type: string, format: uuid }
        customer_id: { type: string, format: uuid }
        name:        { type: string }
        mode:        { type: string, enum: [planning, crud, execution] }
        status:      { type: string }
        created_at:  { type: string }

    CreateApplicationRequest:
      type: object
      required: [customer_id, name]
      properties:
        customer_id: { type: string, format: uuid }
        name:        { type: string }
        mode:        { type: string, enum: [planning, crud, execution], default: planning }

    UpdateApplicationRequest:
      type: object
      properties:
        name: { type: string }

    CreateAdminModelRequest:
      type: object
      required: [application_id, name]
      properties:
        application_id: { type: string, format: uuid }
        name:           { type: string }
        storage_type:   { type: string, default: oltp }

    ActiveRevisionRequest:
      type: object
      required: [revision_name]
      properties:
        revision_name: { type: string }

    CreateAdminRevisionRequest:
      type: object
      required: [model_id, name]
      properties:
        model_id:    { type: string, format: uuid }
        name:        { type: string }
        description: { type: string }

    UpdateAdminRevisionRequest:
      type: object
      properties:
        name:        { type: string }
        description: { type: string }

    UpdateAdminUserRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          description: >
            Immutable. Accepted only when it equals the stored address, so a
            client may echo back what it read; any other value is rejected.
        display_name: { type: string }

    AddUserRoleRequest:
      type: object
      required: [role]
      properties:
        role:         { type: string }
        workspace_id: { type: string, format: uuid, description: "Omit for a platform-level (unscoped) grant" }

    ModelExportPackage:
      type: object
      description: >-
        Self-contained export of one model revision — the same entity set
        model.revision duplication copies (dimensions, metrics, dependencies,
        grids, folders, dashboards, forms, form records/mappings,
        integrations, workflows, automation rules, facts), plus an envelope.
        Nested entity shapes mirror the corresponding Developer Console
        resources and are not separately typed here.
      required: [format, version, exported_at, model_name, storage_type, revision_name]
      properties:
        format:           { type: string }
        version:          { type: integer }
        include_data:     { type: boolean, description: "false = definitions only (no facts, no form records)" }
        exported_at:      { type: string, format: date-time }
        model_name:       { type: string }
        storage_type:     { type: string }
        revision_name:    { type: string }
        facts_policy:     { type: string, description: "Explicit, inspectable statement of the export policy applied to facts: one latest-wins value per cell for direct entries, plus every form-posted value for that same cell (both survive — they are summed, not alternatives)." }
        dimensions:       { type: array, items: { type: object, additionalProperties: {} } }
        metrics:          { type: array, items: { type: object, additionalProperties: {} } }
        dependencies:     { type: array, items: { type: object, additionalProperties: {} } }
        grids:            { type: array, items: { type: object, additionalProperties: {} } }
        folders:          { type: array, items: { type: object, additionalProperties: {} } }
        dashboards:       { type: array, items: { type: object, additionalProperties: {} } }
        forms:            { type: array, items: { type: object, additionalProperties: {} } }
        form_records:     { type: array, items: { type: object, additionalProperties: {} } }
        form_mappings:    { type: array, items: { type: object, additionalProperties: {} } }
        integrations:     { type: array, items: { type: object, additionalProperties: {} } }
        workflows:        { type: array, items: { type: object, additionalProperties: {} } }
        automation_rules: { type: array, items: { type: object, additionalProperties: {} } }
        facts:            { type: array, items: { type: object, additionalProperties: {} } }

    ModelImportRequest:
      type: object
      required: [application_id, package]
      properties:
        application_id: { type: string, format: uuid }
        package:        { $ref: "#/components/schemas/ModelExportPackage" }

    BARole:
      type: object
      required: [id, name, member_count, dashboard_ids]
      properties:
        id:            { type: string, format: uuid }
        name:          { type: string }
        member_count:  { type: integer }
        dashboard_ids: { type: array, items: { type: string, format: uuid } }

    BARoleRequest:
      type: object
      required: [name]
      properties:
        name: { type: string }

    SetRoleDashboardsRequest:
      type: object
      required: [dashboard_ids]
      properties:
        dashboard_ids: { type: array, items: { type: string, format: uuid } }

    BARoleMember:
      type: object
      required: [user_id, display_name, email]
      properties:
        user_id:      { type: string, format: uuid }
        display_name: { type: string }
        email:        { type: string, format: email }

    AddRoleMemberRequest:
      type: object
      required: [user_id]
      properties:
        user_id: { type: string, format: uuid }

    BAUser:
      type: object
      required: [id, display_name, email, role]
      properties:
        id:           { type: string, format: uuid }
        display_name: { type: string }
        email:        { type: string, format: email }
        role:         { type: string }

    UserAccessRule:
      type: object
      required: [rule_type, ref_id, ref_name, access]
      properties:
        rule_type: { type: string }
        ref_id:    { type: string }
        ref_name:  { type: string, description: "Always empty — not populated by the current query" }
        access:    { type: string }

    SetUserAccessRulesRequest:
      type: object
      required: [rules]
      properties:
        rules:
          type: array
          items:
            type: object
            required: [rule_type, ref_id, access]
            properties:
              rule_type: { type: string }
              ref_id:    { type: string }
              access:    { type: string }

    BAAvailableItem:
      type: object
      required: [id, name]
      properties:
        id:    { type: string, format: uuid }
        name:  { type: string }
        group: { type: string, description: "Populated only for type=dashboards (tag list) and type=dimension_members (owning dimension name)" }

    AiSession:
      type: object
      required: [id, app_id, model_id, user_id, llm_provider, llm_model, created_at]
      properties:
        id:                { type: string, format: uuid }
        app_id:            { type: string, format: uuid }
        model_id:          { type: string, format: uuid, description: "The model the session belongs to, fixed at creation" }
        user_id:           { type: string, format: uuid }
        llm_provider:      { type: string }
        llm_model:         { type: string }
        title:             { type: string, description: "Human name; auto-generated from the first request, renameable. Empty = unnamed." }
        draft_revision_id: { type: string, format: uuid, description: "Set once this session's first confirmed proposal lazily creates an isolated draft revision" }
        created_at:        { type: string, format: date-time }
        promoted_at:       { type: string, format: date-time, description: "Set once its draft was promoted: the session is finished and refuses messages (409 SESSION_PROMOTED)" }

    AiConversion:
      type: object
      required: [id, session_id, document_id, filename, row_count, columns, created_at]
      properties:
        id:          { type: string, format: uuid }
        session_id:  { type: string, format: uuid }
        document_id: { type: string, format: uuid }
        sheet:       { type: string }
        reshape:     { type: object, additionalProperties: true, description: "importpkg.Reshape: header_row, fill_down, skip_rows, unpivot, constants, value_map, number_columns, decimal_comma, scale, delimiter" }
        column_map:  { type: object, additionalProperties: { type: string } }
        filename:    { type: string }
        row_count:   { type: integer }
        columns:     { type: array, items: { type: string } }
        created_at:  { type: string, format: date-time }

    AiToolCall:
      type: object
      required: [id, name, arguments]
      properties:
        id:        { type: string }
        name:      { type: string }
        arguments: { type: object, additionalProperties: {} }

    AiChatMessage:
      type: object
      required: [id, session_id, role, content, created_at]
      properties:
        id:            { type: string, format: uuid }
        session_id:    { type: string, format: uuid }
        role:          { type: string, enum: [user, assistant, tool] }
        content:       { type: string }
        tool_calls:    { type: array, items: { $ref: "#/components/schemas/AiToolCall" } }
        tool_call_id:  { type: string }
        tool_name:     { type: string }
        created_at:    { type: string, format: date-time }

    AiDocument:
      type: object
      required: [id, session_id, filename, mime_type, char_count, truncated, created_at]
      properties:
        id:         { type: string, format: uuid }
        session_id: { type: string, format: uuid }
        filename:   { type: string }
        mime_type:  { type: string }
        char_count: { type: integer }
        truncated:  { type: boolean }
        created_at: { type: string, format: date-time }

    AiSendMessageRequest:
      type: object
      required: [content]
      properties:
        content: { type: string }

    AiProposalStep:
      type: object
      required: [tool, description, params]
      properties:
        tool:        { type: string }
        description: { type: string }
        params:      { type: object, additionalProperties: {} }
        status:      { type: string, enum: [pending, success, failed] }
        result:      { type: string, description: "Human-readable outcome, set after execution" }
        created_id:  { type: string, description: "ID of the resource the step created, if any" }

    AiProposal:
      type: object
      required: [id, session_id, steps, status, created_at]
      properties:
        id:          { type: string, format: uuid }
        session_id:  { type: string, format: uuid }
        steps:       { type: array, items: { $ref: "#/components/schemas/AiProposalStep" } }
        status:      { type: string, enum: [pending, confirmed, rejected, executed, partial] }
        created_at:  { type: string, format: date-time }
        executed_at: { type: string, format: date-time, nullable: true }

    AiProposalWithSummary:
      allOf:
        - $ref: "#/components/schemas/AiProposal"
        - type: object
          required: [summary]
          properties:
            summary: { type: string, description: "Human-readable one-liner: buildExecutionSummary's per-step-collapsed text for executed/partial proposals, a short status line otherwise" }

    AiLLMSettings:
      type: object
      required: [provider, model, has_key]
      properties:
        provider: { type: string }
        model:    { type: string }
        has_key:  { type: boolean, description: "True when an API key is stored; the key itself is never returned" }

    AiSaveSettingsRequest:
      type: object
      properties:
        provider: { type: string, default: openai, description: "openai, anthropic, google, mistral or deepseek; anything else is refused" }
        model:    { type: string, description: "Any model ID the provider offers; empty means the provider's default model" }
        api_key:  { type: string, description: "Omit to keep the existing stored key" }

    AiTestSettingsRequest:
      type: object
      properties:
        provider: { type: string, description: "Falls back to the caller's stored settings, then \"openai\"" }
        model:    { type: string, description: "Falls back to the caller's stored settings, then the provider's default model" }
        api_key:  { type: string, description: "Falls back to the caller's stored (decrypted) key, then a provider-specific env var" }

    ImportUploadRequest:
      type: object
      properties:
        csv:          { type: string, description: "Raw CSV text; required unless xlsx_base64 is given" }
        xlsx_base64:  { type: string, description: "Base64-encoded .xlsx workbook; required unless csv is given" }
        revision_id:  { type: string, format: uuid, description: "Defaults to the model's active revision" }
        import_mode:  { type: string, enum: [incremental, replace, full_reload], default: incremental }

    ProtoTimestamp:
      type: object
      description: >-
        The wire shape of a google.protobuf.Timestamp field on this endpoint
        — ImportJob is a protobuf-generated Go struct serialized with the
        standard library's encoding/json (not protojson), so timestamps
        appear as their raw {seconds, nanos} fields rather than an RFC3339
        string.
      properties:
        seconds: { type: integer }
        nanos:   { type: integer }

    ColumnMapping:
      type: object
      properties:
        source_column: { type: string }
        target_field:  { type: string }

    ImportJob:
      type: object
      description: >-
        Also a raw protobuf-generated struct (see ProtoTimestamp) — status is
        the numeric enum value, not a string: 0=unspecified, 1=validating,
        2=staged, 3=committed, 4=failed, 5=aborted.
      properties:
        id:            { type: string, format: uuid }
        model_id:      { type: string, format: uuid }
        scenario:      { type: string, description: "Deprecated — use revision_id" }
        status:        { type: integer, enum: [0, 1, 2, 3, 4, 5] }
        total_rows:    { type: integer }
        valid_rows:    { type: integer }
        error_rows:    { type: integer }
        mappings:      { type: array, items: { $ref: "#/components/schemas/ColumnMapping" } }
        created_at:    { $ref: "#/components/schemas/ProtoTimestamp" }
        completed_at:  { $ref: "#/components/schemas/ProtoTimestamp" }
        revision_id:   { type: string, format: uuid }

    ExportSpec:
      type: object
      description: A file_export integration's config. Names, not ids, so it survives revision copies and model export. Leaf-level only — a dimension that is not a column must be filtered to exactly one leaf.
      properties:
        format: {type: string, enum: [csv, xlsx, json], default: csv}
        layout: {type: string, enum: [wide, long, pivot], default: wide}
        pivot_dimension: {type: string, description: "pivot: the dimension whose leaf members become columns"}
        metrics: {type: array, items: {type: string}, description: Metric names in column order; empty = every grid metric}
        dimensions: {type: array, items: {type: string}, description: Dimension names in column order; empty = every grid dimension}
        member_display: {type: string, enum: [code, label, code_and_label], default: code}
        metric_display: {type: string, enum: [name, label], default: name}
        filters: {type: object, additionalProperties: {type: array, items: {type: string}}, description: Dimension name -> member codes; a parent stands for every leaf under it}
        column_names: {type: object, additionalProperties: {type: string}, description: Default header -> header in the file}
        decimals: {type: integer, minimum: 0, maximum: 10}
        delimiter: {type: string, enum: [",", ";", "tab", "|"], default: ","}
        decimal_separator: {type: string, enum: [".", ","], default: "."}
        include_header: {type: boolean, default: true}
        include_empty_rows: {type: boolean, default: false}
        sheet_name: {type: string, default: Data}
        file_name: {type: string}
    IntegrationRunRequest:
      type: object
      description: A csv_import run carries its file — csv, or xlsx_base64 (+ sheet). A google_sheets run carries none; it re-fetches the sheet named by its config's sheet_url. The integration's saved column_map is applied in the Import Wizard's vocabulary (metric or dimension names, "metric" + "value" for a long file, form fields, code/label/parent_code/property:<name> for a dimension, "ignore"), so a file holding names runs as it is.
      properties:
        csv:
          type: string
          description: The file as CSV text (csv_import).
        xlsx_base64:
          type: string
          description: The file as a base64 .xlsx/.xlsm workbook (csv_import), read as stored cell values. At most 16 MB before encoding.
        sheet:
          type: string
          description: The workbook's sheet; the first when omitted.

    FormField:
      type: object
      required: [name, label, type, required]
      properties:
        name:            { type: string }
        label:           { type: string }
        type:            { type: string, enum: [text, number, select, date, boolean, dimension, metric] }
        required:        { type: boolean }
        options:         { type: array, items: { type: string } }
        dimension_id:    { type: string, format: uuid, description: "Set when type=dimension" }
        allowed_members: { type: array, items: { type: string }, description: "Set when type=dimension" }
        metric_id:       { type: string, format: uuid, description: "Set when type=metric" }
        value_field:     { type: string, description: "Set when type=metric — name of the sibling field holding the numeric amount" }

    FormDef:
      type: object
      required: [id, model_id, name, label, fields, created_at]
      properties:
        id:         { type: string, format: uuid }
        model_id:   { type: string, format: uuid }
        name:       { type: string }
        label:      { type: string }
        fields:     { type: array, items: { $ref: "#/components/schemas/FormField" } }
        created_at: { type: string, format: date-time }

    ListedForm:
      description: A form as GET /api/forms lists it — its definition and what the caller may do with its records.
      allOf:
        - $ref: "#/components/schemas/FormDef"
        - type: object
          required: [permissions]
          properties:
            permissions: { $ref: "#/components/schemas/FormPermissions" }

    FormPermissions:
      type: object
      description: >-
        What the caller the form is listed to may do with its records as a whole, decided by the same
        scope the record routes decide by, so the interface offers only what the server accepts. A
        caller who reaches the form's application may create records as draft or submitted; an
        administrator of the application (a business_admin of its workspace, a developer or
        tenant_admin within their scope, a platform_admin) may also create them in any status and
        sync the form.
      required: [sync, create_statuses]
      properties:
        sync:
          type: boolean
          description: The caller may re-post the form's records into their metrics (POST /api/forms/{id}/sync).
        create_statuses:
          type: array
          description: The statuses the caller may create a record in, in lifecycle order; empty when none.
          items: { type: string, enum: [draft, submitted, approved, rejected] }

    CreateFormRequest:
      type: object
      properties:
        name:   { type: string }
        label:  { type: string }
        fields: { type: array, items: { $ref: "#/components/schemas/FormField" } }

    FormRecord:
      type: object
      required: [id, form_id, data, status, created_by, created_at, updated_at, permissions]
      properties:
        id:         { type: string, format: uuid }
        form_id:    { type: string, format: uuid }
        data:       { type: object, additionalProperties: {} }
        status:     { type: string, enum: [draft, submitted, approved, rejected] }
        created_by:
          type: string
          format: uuid
          nullable: true
          description: The user who created the record; null for a legacy record whose creator was not recorded or was deleted.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        permissions: { $ref: "#/components/schemas/RecordPermissions" }

    RecordPermissions:
      type: object
      description: >-
        What the caller the record is served to may do to it, computed by the same rule the record's
        update and delete check ("submitter + admins"). An administrator of the form's application (a
        business_admin of its workspace, a developer or tenant_admin within their scope, a
        platform_admin) may edit any record, set any status and delete it. The record's creator may
        edit and delete it while it is draft or submitted, and move it only between draft and
        submitted. Anyone else who reaches the form may only read it.
      required: [edit, delete, set_status]
      properties:
        edit:   { type: boolean, description: The caller may change the record's fields. }
        delete: { type: boolean, description: The caller may delete the record. }
        set_status:
          type: array
          description: The statuses the caller may move the record to; never its current status; empty when none.
          items: { type: string, enum: [draft, submitted, approved, rejected] }

    CreateRecordRequest:
      type: object
      properties:
        data: { type: object, additionalProperties: {} }
        status:
          type: string
          enum: [draft, submitted, approved, rejected]
          default: draft
          description: >-
            The new record's status. Anyone who reaches the form may create a draft or a submitted
            record; approved and rejected are for an administrator of the form's application (403
            otherwise).

    UpdateRecordRequest:
      type: object
      properties:
        data:
          type: object
          additionalProperties: {}
          description: The record's new fields; omitted, the record keeps its fields.
        status:
          type: string
          enum: [draft, submitted, approved, rejected]
          description: The record's new status; omitted, the record keeps its status.

    FormImportRequest:
      type: object
      properties:
        csv:         { type: string, description: "Raw CSV text; required unless xlsx_base64 is given. Columns match form field names, falling back to labels." }
        xlsx_base64: { type: string, description: "Base64-encoded .xlsx workbook; required unless csv is given" }

    AutomationRule:
      type: object
      required: [id, application_id, name, description, trigger_type, workflow_name, enabled, created_at, max_retries, retry_backoff_seconds]
      properties:
        id:                     { type: string, format: uuid }
        application_id:         { type: string, format: uuid }
        revision_id:            { type: string, format: uuid, description: "Empty means revision-global" }
        name:                   { type: string }
        description:            { type: string }
        trigger_type:           { type: string, enum: [manual, form_submit, api, form_approval, grid_change, schedule, integration_completed, integration_failed] }
        workflow_name:          { type: string }
        workflow_def_id:        { type: string, format: uuid }
        source_form_id:         { type: string, format: uuid }
        source_grid_id:         { type: string, format: uuid }
        source_integration_id:  { type: string, format: uuid, description: integration_completed / integration_failed rules only — one integration, or any when absent }
        enabled:                { type: boolean }
        created_at:             { type: string, format: date-time }
        cron_expr:              { type: string, description: "Standard 5-field cron expression; set only when trigger_type=schedule" }
        timezone:               { type: string, description: "IANA timezone name the cron expression is evaluated in" }
        misfire_policy:         { type: string, enum: [skip, fire_now], description: "What happens to a tick found significantly overdue (e.g. after downtime): skip it, or fire once for the most recent one" }
        max_retries:            { type: integer }
        retry_backoff_seconds:  { type: integer }
        next_fire_at:           { type: string, format: date-time, nullable: true }
        last_fire_at:           { type: string, format: date-time, nullable: true }

    AutomationRuleRequest:
      type: object
      properties:
        name:                  { type: string }
        description:           { type: string }
        trigger_type:          { type: string, enum: [manual, form_submit, api, form_approval, grid_change, schedule, integration_completed, integration_failed], default: manual }
        workflow_name:         { type: string }
        workflow_def_id:       { type: string, format: uuid }
        source_form_id:        { type: string, format: uuid }
        source_grid_id:        { type: string, format: uuid }
        source_integration_id: { type: string, format: uuid }
        enabled:               { type: boolean, description: "PATCH only" }
        cron_expr:             { type: string, description: "Required when trigger_type=schedule (create), or to (re)configure an existing schedule (update)" }
        timezone:              { type: string, default: UTC }
        misfire_policy:        { type: string, enum: [skip, fire_now], default: skip }
        max_retries:           { type: integer, default: 0 }
        retry_backoff_seconds: { type: integer, default: 60 }

    TriggerAutomationRequest:
      type: object
      properties:
        payload: { type: object, additionalProperties: { type: string } }

    AutomationExecution:
      type: object
      required: [id, rule_id, application_id, status, trigger_payload, started_at]
      properties:
        id:              { type: string, format: uuid }
        rule_id:         { type: string }
        application_id:  { type: string, format: uuid }
        status:          { type: string }
        trigger_payload: { type: object, additionalProperties: { type: string } }
        instance_id:     { type: string, format: uuid }
        error:           { type: string }
        started_at:      { type: string, format: date-time }
        scheduled_for:   { type: string, format: date-time, nullable: true, description: "Set only for scheduler-originated executions — the cron tick this execution claims" }
        claimed_by:      { type: string, description: "Worker-instance identifier that claimed this scheduled tick, for execution-ownership observability" }
        completed_at:    { type: string, format: date-time, nullable: true }

    BusinessDashboardSummary:
      type: object
      required: [id, name, tags]
      properties:
        id:        { type: string, format: uuid }
        name:      { type: string }
        tags:      { type: array, items: { type: string } }
        folder_id: { type: string, format: uuid, nullable: true, description: "Folder this dashboard is filed under; null = at the root" }

    ChartRuntimeRequest:
      type: object
      properties:
        context: { type: object, additionalProperties: { type: string }, description: "Overrides the widget's saved context_defaults for this render" }

    ChartContextMember:
      type: object
      required: [code, label]
      properties:
        code:        { type: string }
        label:       { type: string }
        parent_code: { type: string }

    ChartContextDim:
      type: object
      required: [id, name, members]
      properties:
        id:      { type: string, format: uuid }
        name:    { type: string }
        members: { type: array, items: { $ref: "#/components/schemas/ChartContextMember" } }

    ChartMetricLabel:
      type: object
      required: [id, label, format, format_decimals, format_currency]
      properties:
        id:              { type: string, format: uuid }
        label:           { type: string }
        format:          { type: string }
        format_decimals: { type: integer }
        format_currency: { type: string }

    ConnectorInfo:
      type: object
      required: [enabled, hosts]
      properties:
        enabled: { type: boolean }
        url: { type: string, description: The connector's URL (MCP_RESOURCE_URL) }
        scope: { type: string }
        hosts:
          type: array
          items:
            type: object
            required: [name, client_id]
            properties:
              name: { type: string }
              client_id: { type: string }
              client_secret: { type: string, description: Absent when the deployment has not configured it }
    GridCatalogItem:
      type: object
      required: [id, name, revision_id, dimensions, metric_count]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        revision_id: { type: string, format: uuid }
        dimensions:
          type: array
          items:
            type: object
            required: [id, name]
            properties:
              id: { type: string, format: uuid }
              name: { type: string }
        metric_count: { type: integer, description: Metrics of the grid the caller may see }
        rollup_source_grid_id: { type: string, format: uuid, description: Set when the grid mirrors another grid's metrics through a cross-dimension rollup }
    GridChartCategory:
      type: object
      required: [key, label]
      properties:
        key:   { type: string }
        label: { type: string }

    GridChartSeries:
      type: object
      required: [metric_id, label, values, format, format_decimals, format_currency]
      properties:
        metric_id:       { type: string, format: uuid }
        label:           { type: string }
        values:          { type: array, items: { type: number, nullable: true } }
        format:          { type: string }
        format_decimals: { type: integer }
        format_currency: { type: string }

    CategoryChartData:
      type: object
      description: Returned when the widget's chart_type is bar, line, or pie.
      required: [chart_type, as_of, categories, series, context_dims]
      properties:
        chart_type:   { type: string, enum: [bar, line, pie] }
        as_of:        { type: string, format: date-time }
        categories:   { type: array, items: { $ref: "#/components/schemas/GridChartCategory" } }
        series:       { type: array, items: { $ref: "#/components/schemas/GridChartSeries" } }
        context_dims: { type: array, items: { $ref: "#/components/schemas/ChartContextDim" } }
        context:
          type: object
          additionalProperties: { type: string }
          description: >-
            The context the data was resolved for. Differs from the request when a
            requested member is hidden from the caller: the resolver substitutes that
            dimension's default visible member instead of failing.

    ScatterPoint:
      type: object
      required: [key, label, x, y]
      properties:
        key:   { type: string }
        label: { type: string }
        x:     { type: number }
        y:     { type: number }

    ScatterChartData:
      type: object
      description: Returned when the widget's chart_type is scatter.
      required: [chart_type, as_of, x_metric, y_metric, points, context_dims]
      properties:
        chart_type:   { type: string, enum: [scatter] }
        as_of:        { type: string, format: date-time }
        x_metric:     { $ref: "#/components/schemas/ChartMetricLabel" }
        y_metric:     { $ref: "#/components/schemas/ChartMetricLabel" }
        points:       { type: array, items: { $ref: "#/components/schemas/ScatterPoint" } }
        context_dims: { type: array, items: { $ref: "#/components/schemas/ChartContextDim" } }
        context:
          type: object
          additionalProperties: { type: string }
          description: >-
            The context the data was resolved for. Differs from the request when a
            requested member is hidden from the caller: the resolver substitutes that
            dimension's default visible member instead of failing.

    HistogramBin:
      type: object
      required: [min, max, count]
      properties:
        min:   { type: number }
        max:   { type: number }
        count: { type: integer }

    HistogramChartData:
      type: object
      description: Returned when the widget's chart_type is histogram.
      required: [chart_type, as_of, metric, observation_count, bins, context_dims]
      properties:
        chart_type:        { type: string, enum: [histogram] }
        as_of:             { type: string, format: date-time }
        metric:            { $ref: "#/components/schemas/ChartMetricLabel" }
        observation_count: { type: integer }
        bins:              { type: array, items: { $ref: "#/components/schemas/HistogramBin" } }
        context_dims:      { type: array, items: { $ref: "#/components/schemas/ChartContextDim" } }
        context:
          type: object
          additionalProperties: { type: string }
          description: >-
            The context the data was resolved for. Differs from the request when a
            requested member is hidden from the caller: the resolver substitutes that
            dimension's default visible member instead of failing.

    DevPersona:
      type: object
      required: [key, label, email, roles, tenant]
      properties:
        key:    { type: string, description: "Value to send as the X-Dev-User header" }
        label:  { type: string }
        email:  { type: string, format: email }
        roles:  { type: array, items: { type: string } }
        tenant: { type: string }

    UserApp:
      type: object
      required: [id, name, mode, workspace_name, model_name, active_revision]
      properties:
        tenant_id:   { type: string, description: The tenant the application belongs to; a person's applications span every database that holds them. }
        tenant_name: { type: string }
        id:              { type: string, format: uuid }
        name:            { type: string }
        mode:            { type: string, enum: [planning, crud, execution] }
        workspace_name:  { type: string }
        model_name:      { type: string }
        active_revision: { type: string }

    FormulaRefsRequest:
      type: object
      required: [formula]
      properties:
        formula: { type: string }

paths:
  /healthz:
    get:
      operationId: healthz
      summary: Health check
      security: []
      responses:
        "200":
          description: Service healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }

  /api/demo:
    get:
      operationId: getDemo
      summary: Get demo context (model, revision, actor for current persona)
      responses:
        "200":
          description: Demo context
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DemoContext" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/me:
    get:
      operationId: getMe
      summary: Get the resolved actor for the current identity (no model/app context required)
      responses:
        "200":
          description: Actor
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Actor" }
        "401": { description: Unauthorized }

  /api/me/preferences:
    patch:
      operationId: updateMyPreferences
      summary: Update the caller's own display preferences (any signed-in role; only their own account)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PreferencesUpdate" }
      responses:
        "200":
          description: The preferences as now stored
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PreferencesResponse" }
        "400": { description: Unknown preference or value }
        "401": { description: Unauthorized }
        "404": { description: Account not found }

  /api/notifications/settings:
    get:
      operationId: getNotificationSettings
      summary: Outbound notification settings for this tenant — which channels deliver, and whether overdue tasks are reminded (administrators)
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationSettings" }
        "403": { description: Forbidden }
    put:
      operationId: updateNotificationSettings
      summary: Update the outbound notification settings (administrators)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NotificationSettings" }
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationSettings" }
        "400":
          description: Invalid settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403": { description: Forbidden }
    delete:
      operationId: clearNotificationSettings
      summary: Drop the tenant's own delivery settings so it inherits the deployment's again (administrators)
      responses:
        "200":
          description: The settings now in force
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationSettings" }
        "400": { description: The deployment's own row cannot be cleared }
        "403": { description: Forbidden }

  /api/notifications/settings/test:
    post:
      operationId: sendNotificationTestMail
      summary: Send the calling administrator a test e-mail through the deployment's relay, synchronously — the relay's verdict comes back as the response (administrators)
      responses:
        "200":
          description: The relay accepted the message
          content:
            application/json:
              schema:
                type: object
                required: [sent_to]
                properties:
                  sent_to: { type: string, description: The caller's own address, the only recipient this can reach }
        "403": { description: Forbidden }
        "409":
          description: No relay is configured (SMTP_HOST), or the caller's account has no e-mail address
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "502":
          description: The relay refused the message or did not answer; the error carries the relay's own words
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/admin/ai-settings:
    get:
      operationId: getTenantAISettings
      summary: The tenant-level AI provider key for this tenant (administrators; enterprise feature tenant_ai_keys)
      responses:
        "200":
          description: Tenant AI settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TenantAISettings" }
        "403": { description: "Forbidden, or the licence does not include tenant_ai_keys" }
    put:
      operationId: updateTenantAISettings
      summary: Set the tenant AI provider, model, key and whether it is enforced (administrators; enterprise)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TenantAISettings" }
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TenantAISettings" }
        "400":
          description: Unknown provider, or enforcing with no key stored
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403": { description: "Forbidden, or the licence does not include tenant_ai_keys" }

  /api/admin/ai-settings/test:
    post:
      operationId: testTenantAISettings
      summary: Verify the tenant key with a live tool-calling probe before enforcing it (administrators; enterprise)
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TenantAISettings" }
      responses:
        "200":
          description: Probe result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProviderProbeResult" }
        "403": { description: "Forbidden, or the licence does not include tenant_ai_keys" }

  /api/admin/ai-settings/key:
    delete:
      operationId: clearTenantAIKey
      summary: Remove the stored tenant key and stop enforcing it, returning the tenant to personal keys (administrators; enterprise)
      responses:
        "200":
          description: Settings after clearing
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TenantAISettings" }
        "403": { description: "Forbidden, or the licence does not include tenant_ai_keys" }

  /api/developer/integrations/google-service-account:
    get:
      operationId: getGoogleConnection
      summary: The tenant's Google service account, public half only — the address to share sheets with (developers and administrators; the tenant of the application in X-App-Id)
      responses:
        "200":
          description: The connection
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GoogleConnection" }
        "403": { description: Forbidden }
        "409": { description: A platform admin named no tenant }
    put:
      operationId: putGoogleConnection
      summary: Store a Google service-account key file for this tenant — the JSON Google Cloud downloaded; only the address and the private key are kept, sealed (developers and administrators)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key_file]
              properties:
                key_file: { type: string, description: The key file's JSON text }
      responses:
        "200":
          description: Stored
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GoogleConnection" }
        "400": { description: Not a service-account key file, or its key does not parse }
        "403": { description: Forbidden }
        "503": { description: The deployment has no INTEGRATION_CRED_KEY and refuses to store credentials }
    delete:
      operationId: deleteGoogleConnection
      summary: Forget the tenant's Google service account; private sheets become unreachable again (developers and administrators)
      responses:
        "200":
          description: Removed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GoogleConnection" }
        "403": { description: Forbidden }

  /api/developer/integrations/google-service-account/test:
    post:
      operationId: testGoogleConnection
      summary: Prove the stored key by obtaining an access token from Google; nothing is read (developers and administrators)
      responses:
        "200":
          description: Google issued a token for the account
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  client_email: { type: string }
        "403": { description: Forbidden }
        "409": { description: No account is stored }
        "502": { description: Google refused the account; the error carries its words }

  /api/sso/discover:
    get:
      operationId: ssoDiscover
      security: []
      summary: Before sign-in, whether single sign-on exists and which provider an e-mail belongs to (public, rate-limited; answers nothing about e-mails it does not know)
      parameters:
        - in: query
          name: email
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Discovery result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SsoDiscovery" }
        "429": { description: Too many requests }

  /api/admin/sso:
    get:
      operationId: getSsoSettings
      summary: This tenant's single sign-on provider (administrators; enterprise feature sso)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SsoSettings" }
        "403": { description: "Forbidden, or the licence does not include this feature" }
    put:
      operationId: updateSsoSettings
      summary: Register or update the tenant's identity provider in Keycloak and save the settings (administrators; enterprise)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SsoSettings" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SsoSettings" }
        "400": { description: "Invalid settings, or the provider document could not be read" }
        "403": { description: "Forbidden, or the licence does not include this feature" }
        "502": { description: The identity-provider registry refused the change }
    delete:
      operationId: removeSso
      summary: Remove the tenant's identity provider from Keycloak and clear the settings (administrators; enterprise)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SsoSettings" }
        "403": { description: "Forbidden, or the licence does not include this feature" }

  /api/admin/sso/test:
    post:
      operationId: testSsoProvider
      summary: Read the provider's discovery or metadata document without registering it (administrators; enterprise)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SsoSettings" }
      responses:
        "200": { description: "What the document declares (issuer, endpoints, certificate presence)" }
        "400": { description: The document could not be read }
        "403": { description: "Forbidden, or the licence does not include this feature" }

  /api/admin/scim/tokens:
    get:
      operationId: listScimTokens
      summary: This tenant's SCIM tokens, revoked ones included, never the secret (administrators; enterprise feature scim)
      responses:
        "200": { description: Tokens }
        "403": { description: "Forbidden, or the licence does not include this feature" }
    post:
      operationId: createScimToken
      summary: Issue a SCIM bearer token; the plaintext is returned once (administrators; enterprise)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScimToken" }
      responses:
        "201":
          description: The token, with its plaintext
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScimToken" }
        "400": { description: Invalid request }
        "403": { description: "Forbidden, or the licence does not include this feature" }

  /api/admin/scim/tokens/{id}:
    delete:
      operationId: revokeScimToken
      summary: Revoke a SCIM token (administrators; enterprise)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Revoked }
        "403": { description: "Forbidden, or the licence does not include this feature" }
        "404": { description: Not found }

  /api/scim/v2/ServiceProviderConfig:
    get:
      operationId: scimServiceProviderConfig
      security:
        - scimBearer: []
      summary: SCIM 2.0 service provider configuration (SCIM bearer token)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScimResource" }
        "401": { description: Missing or invalid SCIM token }

  /api/scim/v2/ResourceTypes:
    get:
      operationId: scimResourceTypes
      security:
        - scimBearer: []
      summary: SCIM 2.0 resource types (SCIM bearer token)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScimResource" }
        "401": { description: Missing or invalid SCIM token }

  /api/scim/v2/Schemas:
    get:
      operationId: scimSchemas
      security:
        - scimBearer: []
      summary: SCIM 2.0 schemas (SCIM bearer token)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScimResource" }
        "401": { description: Missing or invalid SCIM token }

  /api/scim/v2/Users:
    get:
      operationId: scimListUsers
      security:
        - scimBearer: []
      summary: List or filter this tenant's users as SCIM resources (SCIM bearer token); filter supports attr eq "value" joined by and
      parameters:
        - { in: query, name: filter, required: false, schema: { type: string } }
        - { in: query, name: startIndex, required: false, schema: { type: integer } }
        - { in: query, name: count, required: false, schema: { type: integer } }
      responses:
        "200":
          description: ListResponse
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScimResource" }
        "400": { description: Invalid filter }
        "401": { description: Missing or invalid SCIM token }
    post:
      operationId: scimCreateUser
      security:
        - scimBearer: []
      summary: Create a user exactly as the console's Users screen would (SCIM bearer token)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScimResource" }
      responses:
        "201":
          description: The created user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScimResource" }
        "400": { description: Invalid resource }
        "401": { description: Missing or invalid SCIM token }
        "409": { description: userName already exists }
        "502": { description: The identity provider refused the account }

  /api/scim/v2/Users/{id}:
    get:
      operationId: scimGetUser
      security:
        - scimBearer: []
      summary: One user (SCIM bearer token)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScimResource" }
        "401": { description: Missing or invalid SCIM token }
        "404": { description: Not found }
    put:
      operationId: scimReplaceUser
      security:
        - scimBearer: []
      summary: Replace a user's attributes (SCIM bearer token)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScimResource" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScimResource" }
        "401": { description: Missing or invalid SCIM token }
        "404": { description: Not found }
        "409": { description: userName already exists }
    patch:
      operationId: scimPatchUser
      security:
        - scimBearer: []
      summary: Apply PatchOp operations to a user; active=false deactivates sign-in immediately (SCIM bearer token)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScimResource" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScimResource" }
        "400": { description: Unsupported operation or path }
        "401": { description: Missing or invalid SCIM token }
        "404": { description: Not found }
    delete:
      operationId: scimDeleteUser
      security:
        - scimBearer: []
      summary: Delete the user and their identity-provider account (SCIM bearer token)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204": { description: Deleted }
        "401": { description: Missing or invalid SCIM token }
        "404": { description: Not found }

  /api/scim/v2/Groups:
    get:
      operationId: scimListGroups
      security:
        - scimBearer: []
      summary: List or filter this tenant's business roles as SCIM groups (SCIM bearer token)
      parameters:
        - { in: query, name: filter, required: false, schema: { type: string } }
        - { in: query, name: startIndex, required: false, schema: { type: integer } }
        - { in: query, name: count, required: false, schema: { type: integer } }
      responses:
        "200":
          description: ListResponse
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScimResource" }
        "400": { description: Invalid filter }
        "401": { description: Missing or invalid SCIM token }
    post:
      operationId: scimCreateGroup
      security:
        - scimBearer: []
      summary: Create a business role with members (SCIM bearer token)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScimResource" }
      responses:
        "201":
          description: The created group
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScimResource" }
        "400": { description: Invalid resource or unknown member }
        "401": { description: Missing or invalid SCIM token }
        "409": { description: displayName already exists }

  /api/scim/v2/Groups/{id}:
    get:
      operationId: scimGetGroup
      security:
        - scimBearer: []
      summary: One group (SCIM bearer token)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScimResource" }
        "401": { description: Missing or invalid SCIM token }
        "404": { description: Not found }
    put:
      operationId: scimReplaceGroup
      security:
        - scimBearer: []
      summary: Replace a group's name and members (SCIM bearer token)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScimResource" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScimResource" }
        "401": { description: Missing or invalid SCIM token }
        "404": { description: Not found }
        "409": { description: displayName already exists }
    patch:
      operationId: scimPatchGroup
      security:
        - scimBearer: []
      summary: Add or remove members, rename (SCIM bearer token)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScimResource" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScimResource" }
        "400": { description: Unsupported operation }
        "401": { description: Missing or invalid SCIM token }
        "404": { description: Not found }
    delete:
      operationId: scimDeleteGroup
      security:
        - scimBearer: []
      summary: Delete the business role (SCIM bearer token)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204": { description: Deleted }
        "401": { description: Missing or invalid SCIM token }
        "404": { description: Not found }

  /api/cells/history:
    get:
      operationId: getCellHistory
      summary: Every value one intersection held, newest first, including rows later deleted and why (any user who can see the cell; enterprise feature cell_history)
      parameters:
        - { in: query, name: model_id, required: true, schema: { type: string } }
        - { in: query, name: revision_id, required: false, schema: { type: string } }
        - { in: query, name: metric_id, required: true, schema: { type: string } }
        - in: query
          name: dim_codes
          required: false
          schema: { type: string }
          description: JSON object of dimension id to member code, exactly as the cell write sends it.
        - { in: query, name: limit, required: false, schema: { type: integer } }
      responses:
        "200":
          description: History, newest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CellHistoryEntry" }
        "403": { description: "Forbidden — the cell is hidden from the caller, or the licence does not include cell_history" }
        "404": { description: Unknown metric or member }

  /api/branding:
    get:
      operationId: getBranding
      security: []
      summary: The brand to apply — a signed-in caller's tenant, else the tenant registered for the request's host, else the platform's own (public)
      responses:
        "200":
          description: Brand
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BrandView" }

  /api/admin/branding:
    get:
      operationId: getAdminBranding
      summary: This tenant's branding (administrators; feature white_label)
      responses:
        "200":
          description: Branding
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Branding" }
        "403": { description: "Forbidden, or the licence does not include white_label" }
    put:
      operationId: updateBranding
      summary: Set the tenant's name, tagline, logo, favicon, colour, e-mail sender name and custom domain (administrators; feature white_label)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Branding" }
      responses:
        "200":
          description: Saved branding
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Branding" }
        "400": { description: "Invalid colour, oversized or non-image data URL, invalid or already-registered domain" }
        "403": { description: "Forbidden, or the licence does not include white_label" }
    delete:
      operationId: removeBranding
      summary: Return the tenant to the platform's own look (administrators; feature white_label)
      responses:
        "200":
          description: Cleared branding
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Branding" }
        "403": { description: "Forbidden, or the licence does not include white_label" }

  /api/admin/usage:
    get:
      operationId: getUsage
      summary: Per-tenant usage — every tenant for a platform admin, their own for a tenant admin (administrators; enterprise feature usage_analytics)
      parameters:
        - { in: query, name: period, required: false, schema: { type: string }, description: Days of activity to count, e.g. 7d, 30d (default), 90d. }
      responses:
        "200":
          description: Usage per tenant
          content:
            application/json:
              schema:
                type: object
                properties:
                  period_days: { type: integer }
                  since: { type: string, format: date-time }
                  tenants:
                    type: array
                    items: { $ref: "#/components/schemas/TenantUsage" }
        "400": { description: Invalid period }
        "403": { description: "Forbidden, or the licence does not include usage_analytics" }

  /api/admin/audit/export:
    get:
      operationId: exportAudit
      summary: Stream the caller's audit events, oldest first, as a CSV download or JSON Lines for a collector; the same tenant scope as the listing (administrators; enterprise feature audit_export)
      parameters:
        - { in: query, name: format, required: false, schema: { type: string, enum: [csv, jsonl] } }
        - { in: query, name: since, required: false, schema: { type: string }, description: A date (2006-01-02) or RFC 3339 time, inclusive. }
        - { in: query, name: until, required: false, schema: { type: string }, description: A date (whole day) or RFC 3339 time, exclusive. }
        - { in: query, name: category, required: false, schema: { type: string } }
        - { in: query, name: event_type, required: false, schema: { type: string } }
        - { in: query, name: after, required: false, schema: { type: string }, description: Cursor from the previous page's final next_cursor line (jsonl). }
        - { in: query, name: limit, required: false, schema: { type: integer }, description: Events per page, default 10000, at most 100000. }
      responses:
        "200":
          description: The events; jsonl ends with a {"next_cursor"} line when another page follows
          content:
            text/csv: { schema: { type: string } }
            application/x-ndjson: { schema: { type: string } }
        "400": { description: "Invalid time, cursor or format" }
        "403": { description: "Forbidden, or the licence does not include audit_export" }

  /api/admin/audit/settings:
    get:
      operationId: getAuditSettings
      summary: The audit retention policy (administrators; enterprise)
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditSettings" }
        "403": { description: "Forbidden, or the licence does not include audit_export" }
    put:
      operationId: updateAuditSettings
      summary: Set how long audit events are kept; 0 forever, otherwise at least 30 days (administrators; enterprise)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AuditSettings" }
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditSettings" }
        "400": { description: Below the retention floor }
        "403": { description: "Forbidden, or the licence does not include audit_export" }
    delete:
      operationId: clearAuditSettings
      summary: Drop the tenant's own retention so it inherits the deployment's again (administrators; enterprise)
      responses:
        "200":
          description: The settings now in force
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditSettings" }
        "400": { description: The deployment's own row cannot be cleared }
        "403": { description: "Forbidden, or the licence does not include audit_export" }

  /api/license:
    get:
      operationId: getLicense
      summary: Report the edition in force, the features it unlocks and the full gated-feature catalog (any signed-in user; see pkg/license)
      responses:
        "200":
          description: License status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LicenseInfo" }
        "401": { description: Unauthorized }

  /api/legal:
    get:
      operationId: getLegalInfo
      security: []
      summary: The operator's identity and the documents it publishes, for the terms of service and privacy notice a visitor reads before signing up (public; see internal/gateway/legal.go)
      responses:
        "200":
          description: Legal information
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LegalInfo" }

  /api/signup/options:
    get:
      operationId: getSignupOptions
      security: []
      summary: Whether public self-service sign-up is open on this deployment and on what terms (public; see internal/gateway/signup.go)
      responses:
        "200":
          description: Sign-up options
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SignupOptions" }

  /api/signup:
    post:
      operationId: signup
      security: []
      summary: Register a tenant from the public sign-up page — the tenant on the self-service plan, its first administrator/developer, an application with the starter models, and an invitation to set a password (public, rate-limited per address)
      description: >-
        The application gets four starter models in one transaction, all of them or none: the "Learn the
        platform" tour, which is made the application's default model (the one business consoles open),
        and a developer, a business admin and a tenant admin guide. model_id in the result is the tour's.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SignupRequest" }
      responses:
        "200":
          description: Created; invited when an identity provider is configured
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SignupResult" }
        "400": { description: Invalid input }
        "409": { description: An account with this e-mail address already exists }
        "429": { description: Too many attempts from this address }
        "502": { description: "The identity provider refused, or the invitation could not be sent; nothing was created" }
        "503": { description: Sign-up is not enabled here }

  /api/admin/plans:
    get:
      operationId: listPlans
      tags: [Admin]
      summary: The plan catalog in display order (platform_admin and tenant_admin; internal/plan)
      responses:
        "200":
          description: Plans
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Plan" } }
        "401": { description: Unauthorized }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/admin/plans/{key}:
    put:
      operationId: upsertPlan
      tags: [Admin]
      summary: Create or change a plan — name, self-service flag and limits (platform_admin; applies to every tenant on the plan within a minute)
      parameters:
        - name: key
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlanInput" }
      responses:
        "200":
          description: The plan as stored
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Plan" }
        "400": { description: Invalid plan }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/apps:
    get:
      operationId: listUserApps
      summary: List applications accessible to the current user, scoped by tenant/workspace membership and app/model access grants
      responses:
        "200":
          description: Application list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/UserApp" }

  /api/dev/personas:
    get:
      operationId: listDevPersonas
      summary: List every user in the database as a switchable dev persona (dev mode only — 404s in production)
      responses:
        "200":
          description: Persona list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/DevPersona" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/formula/refs:
    post:
      operationId: extractFormulaRefs
      summary: Parse a formula string and return the metric/dimension names it references
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FormulaRefsRequest" }
      responses:
        "200":
          description: Referenced names (or a parse error, still with a 200 and an empty refs array)
          content:
            application/json:
              schema:
                type: object
                properties:
                  refs:  { type: array, items: { type: string } }
                  error: { type: string }

  /api/grid/export:
    get:
      operationId: exportGrid
      summary: Export a grid's raw input-metric values as CSV or XLSX (one row per dimension-member combination; round-trips through POST /api/import/upload)
      parameters:
        - name: grid_def_id
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: format
          in: query
          schema: { type: string, enum: [csv, xlsx], default: csv }
        - name: revision_id
          in: query
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: File download
          content:
            text/csv:
              schema: { type: string, format: binary }
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/grids:
    get:
      operationId: listReadableGrids
      summary: List the grids of the selected model the caller can read
      description: >-
        The grids of the request's model (X-App-Id / X-Model-Id) in a revision, for anyone who opens the
        model — the same reach as GET /api/grid, which has no per-grid grant. A grid whose every metric is
        hidden from the caller is left out; metric_count counts only metrics the caller may see.
      parameters:
        - name: revision_id
          in: query
          description: Revision to list; omitted resolves the model's active revision
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Readable grids
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/GridCatalogItem" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/grid/series:
    get:
      operationId: getGridSeries
      summary: Resolve a grid's metrics along one of its dimensions (the dashboard chart resolver, without a dashboard)
      description: >-
        Values are the engine's: inputs rolled up by their aggregation and time-summary rules, formulas
        evaluated per member, values withheld where they depend on data hidden from the caller. Reach is
        GET /api/grid's. A context member that does not exist or is hidden from the caller is refused with
        the same 400, never replaced by another member.
      parameters:
        - name: grid_def_id
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: revision_id
          in: query
          description: Revision to read; omitted resolves the model's active revision
          schema: { type: string, format: uuid }
        - name: chart_type
          in: query
          schema: { type: string, enum: [bar, line, pie, scatter, histogram], default: bar }
        - name: dimension_id
          in: query
          required: true
          description: The grid dimension the metrics are resolved along
          schema: { type: string, format: uuid }
        - name: metric_ids
          in: query
          description: Comma-separated metric ids (1–5 for bar/line, exactly 1 for pie/histogram)
          schema: { type: string }
        - name: x_metric_id
          in: query
          schema: { type: string, format: uuid }
        - name: y_metric_id
          in: query
          schema: { type: string, format: uuid }
        - name: bin_count
          in: query
          schema: { type: integer, minimum: 3, maximum: 30 }
        - name: hide_rollup_members
          in: query
          description: "1 keeps only leaf members of the resolved dimension"
          schema: { type: string, enum: ["0", "1"] }
        - name: context
          in: query
          description: JSON object of dimension id to member code fixing the grid's other dimensions
          schema: { type: string }
      responses:
        "200":
          description: Resolved values — shape depends on chart_type
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: "#/components/schemas/CategoryChartData" }
                  - { $ref: "#/components/schemas/ScatterChartData" }
                  - { $ref: "#/components/schemas/HistogramChartData" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/grid:
    get:
      operationId: getGrid
      summary: Get planning grid for a revision
      parameters:
        - name: revision_id
          in: query
          description: Revision to read; omitted resolves the caller's ambient revision (X-Revision-Id header, else the model's active revision)
          schema: { type: string, format: uuid }
        - name: grid_def_id
          in: query
          description: Restrict metrics/dimensions to one grid definition; omitted returns the whole model
          schema: { type: string, format: uuid }
        - name: scope
          in: query
          description: 'JSON object of dimension id -> pinned member code, e.g. {"<dim-uuid>":"Q1"}. Cells/totals are restricted to the pinned subtree; a pin covering a whole dimension (its sole universal root) is dropped. Calc totals for a one-dimension pin are served from precomputed slice rows when available.'
          schema: { type: string }
        - name: meta_only
          in: query
          description: '"1" returns dimensions/metrics only — no cells or totals (fast first paint on large models)'
          schema: { type: string, enum: ["1"] }
        - name: totals_only
          in: query
          description: '"1" returns per-metric totals with no per-combo cells — the KPI read shape'
          schema: { type: string, enum: ["1"] }
      responses:
        "200":
          description: Grid data
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GridData" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/cells:
    post:
      operationId: writeback
      summary: Write a single cell value (triggers recalculation)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WritebackRequest" }
      responses:
        "200":
          description: Cell written
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
        "400": { $ref: "#/components/responses/BadRequest" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/metrics:
    get:
      operationId: listMetrics
      summary: List all metrics for the demo model
      parameters:
        - name: revision_id
          in: query
          schema: { type: string, format: uuid }
          description: >-
            The revision whose metrics are listed; it must be a revision of the model (404 otherwise).
            Omitted, the model's active revision.
      responses:
        "200":
          description: Metric list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Metric" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/tasks:
    get:
      operationId: listTasks
      summary: List pending workflow tasks for the current user
      responses:
        "200":
          description: Task list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Task" }

  /api/tasks/{stepId}/complete:
    post:
      operationId: completeTask
      summary: Approve or reject a workflow step
      parameters:
        - name: stepId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TaskActionRequest" }
      responses:
        "200":
          description: Task completed
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/workflow/submit:
    post:
      operationId: submitBudget
      tags: [Workflow]
      summary: Submit a budget for approval (starts the model's workflow)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SubmitBudgetRequest" }
      responses:
        "200":
          description: Workflow started
          content:
            application/json:
              schema:
                type: object
                properties:
                  instance_id: { type: string, format: uuid }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/workflow/history:
    get:
      operationId: getWorkflowHistory
      tags: [Workflow]
      summary: List the 50 most recent workflow instances of the applications the caller administers (business_admin)
      description: >-
        Newest first. Only instances of workflows of applications the caller administers: an application
        in a workspace where the caller holds business_admin, or one kept under a tenant with no workspace
        when the caller holds business_admin in any workspace of that tenant, narrowed by the caller's
        per-application grants when they have any. A caller who is also tenant_admin covers the
        applications of its tenants; a platform_admin or platform-level developer covers every
        application. When X-App-Id names an application, only that application's instances are listed.
        A developer's test runs are never listed.
      responses:
        "200":
          description: Workflow history
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/WorkflowInstance" }

  /api/workflow/my-history:
    get:
      operationId: getMyWorkflowHistory
      tags: [Workflow]
      summary: List the 50 most recent workflow instances where the caller started the instance or was assigned a step
      responses:
        "200":
          description: Workflow history
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/WorkflowInstance" }

  /api/workflow/definitions:
    get:
      operationId: listWorkflowDefinitions
      tags: [Workflows]
      summary: Published workflow definitions of the caller's application, with context schemas — what the Planning workspace renders its start-workflow dialog from
      responses:
        "200":
          description: Published definitions
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:            { type: string, format: uuid }
                    name:          { type: string }
                    description:   { type: string }
                    trigger_event: { type: string }
                    context_schema:
                      type: array
                      items:
                        type: object
                        properties:
                          key:          { type: string }
                          label:        { type: string }
                          data_type:    { type: string }
                          dimension_id: { type: string }
        "401": { description: Unauthorized }

  /api/workflow/instances:
    post:
      operationId: startWorkflowInstance
      tags: [Workflow]
      summary: Start a workflow instance from a published workflow definition
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StartWorkflowInstanceRequest" }
      responses:
        "200":
          description: Instance started
          content:
            application/json:
              schema:
                type: object
                properties:
                  instance_id: { type: string, format: uuid }
        "400":
          description: Workflow is not published
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Caller has no RACI scope for this workflow
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: A duplicate instance already exists
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/workflow/instances/{id}:
    patch:
      operationId: updateWorkflowInstance
      tags: [Workflow]
      summary: Admin override of a workflow instance's status (business_admin)
      description: >-
        Only an instance GET /api/workflow/history could list for the caller: a workflow of an
        application the caller administers, and not a developer's test run. Any other instance answers
        404, the same as an id that does not exist, and nothing is changed.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateWorkflowInstanceRequest" }
      responses:
        "200":
          description: Instance updated
          content:
            application/json:
              schema: { type: object, properties: { status: { type: string } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404":
          description: >-
            No such instance within the caller's scope: unknown or malformed id, an instance of an
            application the caller does not administer, or a test run
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/notifications:
    get:
      operationId: listNotifications
      tags: [Workflow]
      summary: List the 50 most recent notifications for the current user
      responses:
        "200":
          description: Notification list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Notification" }

  /api/notifications/mark-read:
    post:
      operationId: markNotificationRead
      tags: [Workflow]
      summary: Mark one or more of the caller's own notifications as read
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MarkNotificationReadRequest" }
      responses:
        "200":
          description: Number of notifications updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  updated: { type: integer }

  /api/developer/model:
    get:
      operationId: getDeveloperModel
      tags: [Developer Console]
      summary: Get full model definition with metrics and dependencies
      parameters:
        - name: revision_id
          in: query
          schema: { type: string, format: uuid }
          description: When omitted, returns metrics across all revisions of the model.
      responses:
        "200":
          description: Developer model view
          content:
            application/json:
              schema:
                type: object
                required: [app_name, model_name, model_id, metrics]
                properties:
                  app_name:   { type: string }
                  model_id:   { type: string, format: uuid }
                  model_name: { type: string }
                  metrics:    { type: array, items: { $ref: "#/components/schemas/MetricDef" } }

  /api/developer/revisions:
    get:
      operationId: listRevisions
      tags: [Developer Console]
      summary: List revisions for a model
      parameters:
        - name: model_id
          in: query
          schema: { type: string, format: uuid }
          description: Defaults to the demo/current model for the caller's app context.
      responses:
        "200":
          description: Revision list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/DevRevision" }
    post:
      operationId: createRevision
      tags: [Developer Console]
      summary: Duplicate a revision (deep-copies metrics, dimensions, grids, dashboards, forms, workflows, and facts)
      description: >-
        The new revision is made in the model of source_revision_id when the body names one, else in
        model_id, else in the model the request resolves (X-Model-Id within the X-App-Id application,
        else the application's default model). A source revision must be one the caller may open, of a
        model in the X-App-Id application when the request names one.
      parameters:
        - name: model_id
          in: query
          schema: { type: string, format: uuid }
          description: >-
            The model to create the revision in. With source_revision_id, it must be that revision's
            model (400 otherwise).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateRevisionRequest" }
      responses:
        "200":
          description: Revision created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
        "400":
          description: name is missing, or source_revision_id is a revision of another model than model_id
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: >-
            source_revision_id does not exist, or is a revision the caller may not open (another
            application than X-App-Id, or a model outside the caller's access)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/developer/revisions/{id}:
    delete:
      operationId: deleteRevision
      tags: [Developer Console]
      summary: Delete a revision (rejected if it is the model's active revision)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Revision deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
        "409":
          description: Cannot delete the active revision
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/developer/revisions/{id}/activate:
    put:
      operationId: activateRevision
      tags: [Developer Console]
      summary: Make a revision the model's active revision
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Revision activated
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
        "400": { $ref: "#/components/responses/FormulaRejected" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/developer/metrics:
    post:
      operationId: createMetric
      tags: [Developer Console]
      summary: Create a new metric definition
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateMetricRequest" }
      responses:
        "200":
          description: Metric created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:     { type: string, format: uuid }
                  status: { type: string }
        "400": { $ref: "#/components/responses/FormulaRejected" }
        "409":
          description: >-
            METRIC_NAME_TAKEN: the revision already has a metric with this name.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/developer/metrics/{id}:
    patch:
      operationId: updateMetric
      tags: [Developer Console]
      summary: Update a metric definition (re-wires formula dependencies and recalculates affected revisions)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateMetricRequest" }
      responses:
        "200":
          description: Metric updated, with per-revision recalculated values
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  recalc:
                    type: array
                    items:
                      type: object
                      properties:
                        revision_id: { type: string, format: uuid }
                        metric:      { type: string }
                        value:       { type: number, nullable: true }
        "400": { $ref: "#/components/responses/FormulaRejected" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: >-
            METRIC_NAME_TAKEN: the revision already has a metric with this name.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      operationId: deleteMetric
      tags: [Developer Console]
      summary: Delete a metric definition
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Metric deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }

  /api/developer/dimensions:
    get:
      operationId: listDimensions
      tags: [Developer Console]
      summary: List dimensions with members
      parameters:
        - name: revision_id
          in: query
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Dimension list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Dimension" }
    post:
      operationId: createDimension
      tags: [Developer Console]
      summary: Create a new dimension
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateDimensionRequest" }
      responses:
        "200":
          description: Dimension created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:     { type: string, format: uuid }
                  status: { type: string }
                  derived_members: { type: array, items: { type: string }, description: "A property grouping only: the member codes derive_members added" }
        "400":
          description: >-
            INVALID_GROUPING: source_dimension_id / source_property / derive_members do not form a
            valid property grouping (see CreateDimensionRequest.source_dimension_id).
            INVALID_PARENT_DIMENSION: parent_dimension_id is not a dimension of the same model
            and revision, is the dimension itself, would form a cycle, or is set on a time
            dimension (a time dimension has no parent dimension). Other malformed bodies are
            plain text.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: >-
            DIMENSION_NAME_TAKEN: the revision already has a dimension with this name.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/developer/dimensions/{dimId}:
    patch:
      operationId: updateDimension
      tags: [Developer Console]
      summary: Update a dimension (rejects cycles in the parent-dimension hierarchy)
      parameters:
        - name: dimId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateDimensionRequest" }
      responses:
        "200":
          description: Dimension updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  derived_members: { type: array, items: { type: string }, description: "When the grouping was sent: the member codes derive_members added" }
        "400":
          description: >-
            INVALID_GROUPING: source_dimension_id / source_property / derive_members do not form a
            valid property grouping (see CreateDimensionRequest.source_dimension_id).
            INVALID_PARENT_DIMENSION: parent_dimension_id is not a dimension of the same model
            and revision, is the dimension itself, would form a cycle, or is set on a time
            dimension (a time dimension has no parent dimension). Other malformed bodies are
            plain text.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: >-
            DIMENSION_NAME_TAKEN: the revision already has a dimension with this name.
            DIMENSION_IN_USE: the grouping's source cannot be cleared or replaced while formulas read through it.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      operationId: deleteDimension
      tags: [Developer Console]
      summary: Delete a dimension
      parameters:
        - name: dimId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Dimension deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
        "409":
          description: >-
            DIMENSION_IN_USE: formulas name the dimension (the error lists the metrics), or a property
            grouping groups its members; change those formulas or clear that grouping first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/developer/dimensions/{dimId}/members:
    post:
      operationId: createDimensionMember
      tags: [Developer Console]
      summary: Add a member to a dimension (splits parent-level facts and triggers recalculation when this is the first child of an existing parent member)
      parameters:
        - name: dimId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MemberRequest" }
      responses:
        "200":
          description: Member created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409":
          description: >-
            MEMBER_CODE_TAKEN: the dimension already has a member with this code.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/developer/dimensions/{dimId}/members/generate:
    post:
      operationId: generateDimensionPeriods
      tags: [Developer Console]
      summary: Bulk-generate a time dimension's periods between two dates (same validation and chronological indexing as single members; time dimensions only)
      parameters:
        - name: dimId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GeneratePeriodsRequest" }
      responses:
        "200":
          description: Periods created (existing codes are left untouched)
          content:
            application/json:
              schema:
                type: object
                properties:
                  created: { type: integer }
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/developer/dimensions/{dimId}/members/order:
    put:
      operationId: reorderDimensionMembers
      tags: [Developer Console]
      summary: Set the order of one level of a dimension's members (developer only; not on a time dimension)
      description: >-
        member_ids must be exactly the current children of parent_member_id in this dimension (null for the
        top-level members), each once, in the wanted order. The whole dimension is then renumbered in tree
        order (each member followed by its children), which is the order grids, pickers and charts show.
        Audited as dimension.members_reordered. A dimension outside the caller's scope answers 404.
      parameters:
        - name: dimId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [member_ids]
              properties:
                parent_member_id:
                  type: string
                  format: uuid
                  nullable: true
                  description: The level's parent member; null for the top-level members.
                member_ids:
                  type: array
                  items: { type: string, format: uuid }
      responses:
        "200":
          description: Members reordered
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
        "400":
          description: >-
            member_ids is not exactly the level's members (one missing, listed twice, not a member of the
            dimension or not a child of the parent), the parent is neither a member of the dimension, nor the
            parent of members here, nor a member of its parent dimension, or the dimension is a time dimension
            ("time periods keep calendar order").
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/developer/dimensions/{dimId}/members/{memberId}:
    patch:
      operationId: updateDimensionMember
      tags: [Developer Console]
      summary: Update a dimension member (rejects cycles in the parent-member hierarchy)
      parameters:
        - name: dimId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: memberId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MemberRequest" }
      responses:
        "200":
          description: Member updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: >-
            MEMBER_CODE_TAKEN: the dimension already has a member with the new code.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      operationId: deleteDimensionMember
      tags: [Developer Console]
      summary: Delete a dimension member
      parameters:
        - name: dimId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: memberId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Member deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: >-
            MEMBER_IN_USE: formulas name the member's code (a literal LOOKUP member, a TIMESUM period, an
            equality criterion or a comparison); the error lists the metrics. Change those formulas first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/developer/dimensions/{dimId}/properties:
    get:
      operationId: listDimensionProperties
      tags: [Developer Console]
      summary: List typed properties defined on a dimension
      parameters:
        - name: dimId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Property list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/DimensionProperty" }
    post:
      operationId: createDimensionProperty
      tags: [Developer Console]
      summary: Define a new typed property on a dimension
      parameters:
        - name: dimId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PropertyRequest" }
      responses:
        "200":
          description: Property created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
        "400":
          description: >-
            INVALID_PROPERTY_NAME (not letters, digits and underscores starting with a letter or
            underscore, so a formula can read it as dimension.name), INVALID_PROPERTY_TYPE (not one of
            the property data types), PROPERTY_NAME_TAKEN (the dimension already has a property of that
            name, compared case-insensitively). Other malformed bodies are plain text.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/developer/dimensions/{dimId}/properties/{propId}:
    patch:
      operationId: updateDimensionProperty
      tags: [Developer Console]
      summary: Update a dimension property
      parameters:
        - name: dimId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: propId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PropertyRequest" }
      responses:
        "200":
          description: Property updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
        "400":
          description: >-
            INVALID_PROPERTY_NAME (not letters, digits and underscores starting with a letter or
            underscore, so a formula can read it as dimension.name), INVALID_PROPERTY_TYPE (not one of
            the property data types), PROPERTY_NAME_TAKEN (the dimension already has a property of that
            name, compared case-insensitively). Other malformed bodies are plain text.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deleteDimensionProperty
      tags: [Developer Console]
      summary: Delete a dimension property
      parameters:
        - name: dimId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: propId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Property deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: >-
            PROPERTY_IN_USE: formulas read the property as dimension.property (the error lists the metrics);
            change those formulas first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/developer/migration/generate:
    post:
      operationId: generateMigration
      tags: [Developer Console]
      summary: Generate (but do not apply) the next schema migration for a model's current definition
      responses:
        "200":
          description: Generated migration files
          content:
            application/json:
              schema:
                type: object
                properties:
                  model_id:       { type: string, format: uuid }
                  version_number: { type: integer }
                  files:
                    type: object
                    additionalProperties: { type: string }

  /api/developer/migration/apply:
    post:
      operationId: applyMigration
      tags: [Developer Console]
      summary: Generate and immediately apply a schema migration for a model
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MigrationApplyRequest" }
      responses:
        "200":
          description: Migration applied
          content:
            application/json:
              schema:
                type: object
                properties:
                  migration_id:   { type: string, format: uuid }
                  version_number: { type: integer }
                  status:         { type: string }
                  files_applied:  { type: integer }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/developer/debug/facts:
    get:
      operationId: debugFacts
      tags: [Developer Console]
      summary: List the 50 most recently entered raw fact_input rows for a model (debugging aid)
      parameters:
        - name: revision_id
          in: query
          schema: { type: string, format: uuid }
          description: >-
            Rows of every revision of the model are listed, each filtered by its own revision's access
            rules. This revision's rules also filter the rows that carry no revision, and a metric it
            hides is hidden in every row of that metric. It must be a revision of the model (404
            otherwise); omitted, the model's active revision.
      responses:
        "200":
          description: Recent fact rows
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    metric_id:     { type: string, format: uuid }
                    metric_name:   { type: string }
                    dim_members:   { type: string, description: "Raw jsonb dim_members, as text" }
                    value:         { type: number }
                    revision_name: { type: string }
                    revision_id:   { type: string, format: uuid, nullable: true }
                    entered_at:    { type: string }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/developer/debug/calc:
    get:
      operationId: debugCalc
      tags: [Developer Console]
      summary: Inspect persisted runtime.calc_result rows (debugging aid) — per-metric summary, or every metric's row at one exact dim_members combo
      parameters:
        - name: revision_id
          in: query
          schema: { type: string, format: uuid }
        - name: dim_members
          in: query
          description: 'Exact dim_members JSON to match, e.g. {"<dimension-id>":"Q1"}. Omit for the per-metric summary.'
          schema: { type: string }
      responses:
        "200":
          description: Without dim_members, a per-metric summary of persisted rows; with it, each metric's latest row at that exact combo
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    metric_id:      { type: string, format: uuid }
                    metric_name:    { type: string }
                    total_rows:     { type: integer, description: "Summary mode only" }
                    has_aggregate:  { type: boolean, description: "Summary mode only: a '{}' grand-total row exists" }
                    one_dim_slices: { type: integer, description: "Summary mode only: rows pinning exactly one dimension" }
                    value:          { type: number, description: "dim_members mode only" }
                    calc_at:        { type: string, description: "dim_members mode only" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403":
          description: >-
            With dim_members: the caller has a hidden dimension member. Persisted rows are unrestricted
            values (a parent row aggregates hidden members; a LOOKUP or time-window row can read one), so
            none of them is served.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/developer/integrations/export-preview:
    post:
      operationId: previewExportIntegration
      tags: [Developer Console]
      summary: Render a file_export spec against a grid without saving — the columns, the first rows (default 20, at most 200) and the row count, built from the caller's own view of the grid. 400 lists every spec problem.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target_id, config]
              properties:
                target_id: {type: string, format: uuid, description: The grid}
                name: {type: string, description: The export's name (default file name)}
                rows: {type: integer}
                config: { $ref: "#/components/schemas/ExportSpec" }
      responses:
        "200":
          description: Preview
          content:
            application/json:
              schema:
                type: object
                properties:
                  header: {type: array, items: {type: string}}
                  default_header: {type: array, items: {type: string}, description: The columns before column_names renamed them (its keys)}
                  rows: {type: array, items: {type: array, items: {type: string}}}
                  total_rows: {type: integer}
                  warnings: {type: array, items: {type: string}}
                  file_name: {type: string}
                  summary: {type: string}
        "400":
          description: The spec's problems
          content: {application/json: {schema: {type: object, properties: {error: {type: string}, problems: {type: array, items: {type: string}}}}}}
        "404": { $ref: "#/components/responses/NotFound" }

  /api/developer/integrations/{id}/duplicate:
    post:
      operationId: duplicateIntegration
      tags: [Developer Console]
      summary: Duplicate a rest_api integration (test state cleared, schedule copied disabled, no run history)
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        "200": {description: The duplicated integration, content: {application/json: {schema: {type: object}}}}
        "404": { $ref: "#/components/responses/NotFound" }

  /api/developer/integrations/{id}/validate:
    post:
      operationId: validateIntegration
      tags: [Developer Console]
      summary: Validate a rest_api integration's configuration and target/connection ownership without saving
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        "200": {description: Validation result, content: {application/json: {schema: {type: object, properties: {valid: {type: boolean}, config_hash: {type: string}, errors: {type: array, items: {type: string}}}}}}}
        "404": { $ref: "#/components/responses/NotFound" }

  /api/developer/integrations/{id}/test:
    post:
      operationId: testIntegration
      tags: [Developer Console]
      summary: Enqueue a test (or dry_run=1) execution — 202 + run id; the worker executes it, never the gateway. Mutation methods require acknowledge_side_effects=1.
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: dry_run, in: query, schema: {type: string, enum: ["1"]}}
        - {name: acknowledge_side_effects, in: query, schema: {type: string, enum: ["1"]}}
      responses:
        "202": {description: Queued, content: {application/json: {schema: {type: object, properties: {run_id: {type: string}, status: {type: string}}}}}}
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/developer/integration-runs/{runId}:
    get:
      operationId: getIntegrationRun
      tags: [Developer Console]
      summary: One run's full state (poll while queued/running)
      parameters: [{name: runId, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        "200": {description: Run, content: {application/json: {schema: {type: object}}}}
        "404": { $ref: "#/components/responses/NotFound" }

  /api/developer/integration-runs/{runId}/cancel:
    post:
      operationId: cancelIntegrationRun
      tags: [Developer Console]
      summary: Cancel a queued run immediately, or request cooperative cancellation of a running one
      parameters: [{name: runId, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        "200": {description: Resulting status, content: {application/json: {schema: {type: object, properties: {status: {type: string}}}}}}
        "404": { $ref: "#/components/responses/NotFound" }
        "409": {description: Not cancellable, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}

  /api/developer/integration-connections:
    get:
      operationId: listIntegrationConnections
      tags: [Developer Console]
      summary: List reusable credential connections (public metadata + has_secret only — secrets are write-only)
      responses:
        "200": {description: Connections, content: {application/json: {schema: {type: array, items: {type: object}}}}}
    post:
      operationId: createIntegrationConnection
      tags: [Developer Console]
      summary: Create a connection; the secret document is sealed with mandatory AEAD and never returned
      requestBody: {required: true, content: {application/json: {schema: {type: object, properties: {name: {type: string}, auth_type: {type: string}, meta: {type: object}, secret: {type: object}}}}}}
      responses:
        "200": {description: Created connection (no secret), content: {application/json: {schema: {type: object}}}}
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/developer/integration-connections/{id}:
    patch:
      operationId: updateIntegrationConnection
      tags: [Developer Console]
      summary: 'Update a connection. Secret semantics: field absent = keep, null = remove, object = replace.'
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody: {required: true, content: {application/json: {schema: {type: object}}}}
      responses:
        "200": {description: Updated connection (no secret), content: {application/json: {schema: {type: object}}}}
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deleteIntegrationConnection
      tags: [Developer Console]
      summary: Delete a connection (refused while any integration references it)
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        "200": {description: Deleted, content: {application/json: {schema: {type: object}}}}
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/developer/integration-connections/{id}/test:
    post:
      operationId: testIntegrationConnection
      tags: [Developer Console]
      summary: Verify the stored credential decrypts and matches its auth type's required fields (no network call — full round-trips go through an integration's own /test run)
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        "200": {description: Result, content: {application/json: {schema: {type: object, properties: {ok: {type: boolean}, error: {type: string}}}}}}
        "404": { $ref: "#/components/responses/NotFound" }

  /api/developer/integration-connections/{id}/oauth/start:
    post:
      operationId: startIntegrationOAuth
      tags: [Developer Console]
      summary: "Begin the OAuth 2.0 authorization-code consent for a connection of that auth type: records the pending authorisation (PKCE) and answers the provider URL to open; the provider returns the browser to /api/integrations/oauth/callback"
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                return_to: { type: string, description: Console path to return to afterwards ("/" when absent or not a path) }
      responses:
        "200":
          description: Where to send the browser
          content:
            application/json:
              schema:
                type: object
                required: [authorization_url, redirect_uri]
                properties:
                  authorization_url: { type: string }
                  redirect_uri: { type: string, description: The callback the provider must be registered with }
        "400": { description: Not an authorization-code connection, or its meta is incomplete }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/developer/integration-connections/{id}/oauth/disconnect:
    post:
      operationId: disconnectIntegrationOAuth
      tags: [Developer Console]
      summary: Forget the connection's tokens, keeping the client so it can be connected again
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        "200":
          description: The connection
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  name: { type: string }
                  auth_type: { type: string }
                  meta: { type: object }
                  has_secret: { type: boolean }
        "400": { description: Not an authorization-code connection }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/integrations/oauth/callback:
    get:
      operationId: integrationOAuthCallback
      security: []
      summary: "Where the provider sends the browser after consent (public: the person arrives with the state only). Exchanges the code, seals the tokens into the connection, and redirects to the console with ?oauth=connected or ?oauth=error&oauth_error=…"
      parameters:
        - { name: state, in: query, required: true, schema: { type: string } }
        - { name: code, in: query, schema: { type: string } }
        - { name: error, in: query, schema: { type: string } }
        - { name: error_description, in: query, schema: { type: string } }
      responses:
        "302": { description: Back to the console }

  /api/developer/grids:
    get:
      operationId: listGrids
      tags: [Developer Console]
      summary: List grid definitions for a model
      parameters:
        - name: revision_id
          in: query
          schema: { type: string, format: uuid }
          description: >-
            Only this revision's grids. The request works in this revision's model when that model is
            in the X-App-Id application and open to the caller; any other revision answers 404.
            Omitted, the grids of every revision of the resolved model are listed.
      responses:
        "200":
          description: Grid list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/GridDef" }
        "404":
          description: revision_id is not a revision of the model, or is not a valid id
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    post:
      operationId: createGrid
      tags: [Developer Console]
      summary: Create a new grid definition
      parameters:
        - name: revision_id
          in: query
          schema: { type: string, format: uuid }
          description: >-
            The revision to create the grid in when the body names none. It must be a revision of the
            model the request resolves, which is this revision's own when that model is in the X-App-Id
            application and open to the caller (404 otherwise).
