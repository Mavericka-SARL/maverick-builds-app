              schema: { type: object, properties: { status: { type: string } } }
    delete:
      operationId: deleteAdminRevision
      tags: [Admin]
      summary: Delete a revision
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Revision deleted
          content:
            application/json:
              schema: { type: object, properties: { status: { type: string } } }

  /api/admin/users:
    get:
      operationId: listAdminUsers
      tags: [Admin]
      summary: List users for administration
      description: Available to platform_admin, tenant_admin, and developer roles. Platform admins see all users; tenant admins and developers are scoped to reachable tenant/workspace/app/model access.
      responses:
        "200":
          description: User list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AdminUser" }
    post:
      operationId: createAdminUser
      tags: [Admin]
      summary: Create a user for administration
      description: >
        Available to platform_admin, tenant_admin, and developer roles. Non-platform
        admins create users in their tenant scope and cannot assign platform-level
        roles during creation.


        Creates a real identity-provider account and emails a set-your-password
        invitation; no password is ever set server-side. The whole operation is
        undone if any step fails, so a user that exists can always sign in. When
        no identity provider is configured (the dev stack) the account is
        local-only and `invited` is false.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, display_name]
              properties:
                email:        { type: string, format: email }
                display_name: { type: string }
                role:         { type: string }
      responses:
        "200":
          description: Created user id
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:     { type: string, format: uuid }
                  status: { type: string }
                  invited:
                    type: boolean
                    description: Whether an invitation email was sent.
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "502":
          description: >
            The identity provider rejected the request or could not send the
            invitation. No user was created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: >
            No identity provider is configured, so any account created here
            would be unable to sign in. No user was created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/admin/users/:
    post:
      operationId: createAdminUserTrailingSlash
      tags: [Admin]
      summary: Create a user for administration (identical to POST /api/admin/users)
      description: >-
        A second, directly reachable route to the same adminUserAction create
        branch that POST /api/admin/users delegates into internally — not
        just an internal implementation detail. Kept for backward
        compatibility; prefer POST /api/admin/users.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, display_name]
              properties:
                email:        { type: string, format: email }
                display_name: { type: string }
                role:         { type: string }
      responses:
        "200":
          description: Created user id
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:     { type: string, format: uuid }
                  status: { type: string }

  /api/admin/users/{id}:
    patch:
      operationId: updateAdminUser
      tags: [Admin]
      summary: Update a user's display name (only a platform_admin may modify another platform_admin)
      description: >
        Only display_name is mutable. The email address is the sign-in identity
        in the identity provider, and this endpoint writes only the
        application's copy — changing it here would leave the account signing
        in under the old address while the console showed the new one. Sending
        an email that differs from the stored one is rejected; to move someone
        to a new address, delete them and invite them again.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateAdminUserRequest" }
      responses:
        "200":
          description: User updated
          content:
            application/json:
              schema: { type: object, properties: { status: { type: string } } }
        "400":
          description: An attempt to change the email address
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deleteAdminUser
      tags: [Admin]
      summary: Delete a user (never yourself)
      description: >
        Removes the application row and the identity-provider account.
        Deleting your own account is refused: it is not undoable from inside
        the product, and for the sole platform admin it would leave nobody
        able to administer users at all. Another administrator can do it.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: User deleted
          content:
            application/json:
              schema: { type: object, properties: { status: { type: string } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/admin/users/{id}/invite:
    post:
      operationId: resendAdminUserInvitation
      tags: [Admin]
      summary: Resend the set-your-password invitation email
      description: >
        Invitations expire and mail gets lost; without this the only recovery is
        deleting and re-creating the user, which discards their roles and access
        grants. Returns 409 for users created before identity-provider
        provisioning existed — they carry a synthetic subject and have no
        account to invite.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Invitation sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  email: { type: string }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: User has no identity-provider account to invite
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "502":
          description: The identity provider could not send the email (check realm SMTP settings)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: No identity provider is configured
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/admin/users/{id}/roles:
    post:
      operationId: addAdminUserRole
      tags: [Admin]
      summary: Grant a role to a user, platform-wide or scoped to a workspace
      description: The granting actor may only assign roles strictly below their own tier (see assignableRoles in internal/gateway/handler.go) — a tenant_admin can never mint another tenant_admin, for example.
