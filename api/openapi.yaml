  /api/admin/models/{id}/export/package:
    get:
      operationId: exportModelPackage
      tags: [Admin]
      summary: Download a standalone deployment package for a model revision — a tar.gz containing the entity graph (package.json), the complete database migrations, a provenance manifest, and an infra-only docker-compose (tenant admins for their own tenant, platform admins for any)
      parameters:
        - name: id
          in: path
          required: true
