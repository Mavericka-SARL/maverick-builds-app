  /api/admin/applications:
    get:
      operationId: listAdminApplications
      tags: [Admin]
      summary: "List the applications in the caller's scope — every tenant's for a platform admin, their own tenant's for a tenant admin"
      responses:
        "200":
          description: Application list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AdminApplicationItem" }
    post:
      operationId: createAdminApplication
      tags: [Admin]
      summary: "Create an application under a tenant (a tenant admin: their own tenant only)"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateApplicationRequest" }
      responses:
        "200":
          description: Application created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:         { type: string, format: uuid }
                  created_at: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/admin/applications/{id}:
    patch:
      operationId: updateAdminApplication
      tags: [Admin]
      summary: Rename an application
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateApplicationRequest" }
      responses:
        "200":
          description: Application updated
          content:
            application/json:
              schema: { type: object, properties: { status: { type: string } } }
    delete:
      operationId: deleteAdminApplication
      tags: [Admin]
      summary: Delete an application
      description: >-
        When this takes the last application or model grant narrowing a
        developer with no tenant, and the caller is not a platform admin, that
        account's unscoped developer grant is revoked in the same transaction
        (audited as user.role_revoked, listed in `revoked`): it ends with no
        builder reach, never platform-wide. A platform admin's removal leaves
        it as it is.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Application deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  revoked:
                    type: array
                    description: >-
                      Unscoped developer grants also taken away, so as not to
                      leave an account with no tenant platform-wide (absent
                      when none).
                    items: { $ref: "#/components/schemas/RevokedGrant" }

