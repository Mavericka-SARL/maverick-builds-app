  /api/admin/revisions/{id}:
    patch:
      operationId: updateAdminRevision
      tags: [Admin]
      summary: Rename or redescribe a revision
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateAdminRevisionRequest" }
      responses:
