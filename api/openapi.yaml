openapi: "3.0.3"

info:
  title: maverickbuilds.app API
  description: |
    Every route the maverickbuilds.app gateway registers
    (route_spec_parity_test.go keeps the two in step). Authentication is a
    Keycloak-issued bearer JWT, validated against the realm's JWKS; X-Dev-User
    replaces it only when the gateway runs with DEV_MODE=true. Operations with
    `security: []` are public; SCIM uses the tenant's own SCIM token. See
    docs/API.md for an overview of route groups and role guards.
  version: "0.1.0"
  contact:
    name: maverickbuilds.app

servers:
  - url: http://localhost:8080
    description: Local development gateway

security:
  - bearerAuth: []

tags:
  - name: Developer Console
    description: Model-authoring endpoints (developer role) — metrics, dimensions, revisions, grids, dashboards, migrations, integrations, workflows.
  - name: Admin
    description: Platform/tenant administration — tenants, applications, models, revisions, users, workspaces, audit.
  - name: Business Admin
    description: >-
      Workspace-scoped role/user administration for business users — roles, dashboard assignment, access
      rules. The workspace is the X-App-Id application's (a tenant-level application resolves to a
      workspace of its tenant). Past the route's role guard, the caller must administer that workspace:
      business_admin held in it, tenant admin of its tenant, platform admin or, on the /roles routes,
      a developer of its tenant. Anyone else answers 403, a business admin of another workspace of the
      same tenant included.
  - name: AI Assistant
    description: Developer-facing chat assistant — sessions, streaming chat, write proposals, documents, LLM provider settings.
  - name: Import & Integrations
    description: Business-facing CSV/XLSX fact import and saved integration execution (any authenticated actor — writes are scoped by the generic write guard, not a platform role).
  - name: Workflow
    description: Runtime workflow execution — starting/submitting instances, history, notifications. Separate from the Developer Console's workflow-authoring surface.
  - name: CRUD Forms
    description: Business-user-facing CRUD forms and their submitted records (any authenticated actor).
  - name: Automation
    description: Event/manual automation rules that start workflow instances, and their execution history.
  - name: Business Dashboards
    description: Business-user dashboard rendering and chart-data queries, scoped by business-role dashboard assignment.

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    scimBearer:
      type: http
      scheme: bearer
      description: A tenant's SCIM token (mvx_scim_…), issued under Admin › SCIM; not a user's JWT.

  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    InternalError:
      description: Internal server error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    FormulaRejected:
      description: >-
        The formula, or the model it would leave, is refused (internal/metricformula). The error string
        starts with a stable code when there is one: #NAME? (unknown function), #VALUE! (wrong argument
        count or shape), SOURCE_MUST_BE_METRIC (LOOKUP, a conditional aggregation or a *VALUE function
        given a dimension as its source), DIMENSION_ARGUMENT_REQUIRED (PARENT, LOOKUP, a criteria range
        or dimension.property naming something that is not a dimension of the revision), UNKNOWN_PROPERTY
        (dimension.property not declared on that dimension), UNKNOWN_MEMBER (a literal member code the
        dimension does not have), DIMENSION_NOT_ON_SOURCE (a LOOKUP or criteria dimension that is not,
        and is not related to, one of the source metric's dimensions), CONFLICTING_DIMENSION_ARGUMENTS
        (two arguments selecting members of the same dimension of the source), TIME_OFFSET_NOT_INTEGER,
        MOVING_WINDOW_NOT_LITERAL, TEMPORAL_CYCLE_NOT_CAUSAL, MULTIPLE_TIME_DIMENSIONS,
        TIME_DIMENSION_REQUIRED, TIME_DIMENSION_MISMATCH, INVALID_TIME_MEMBER. A refusal without a code
        (unknown metric, dependency cycle, parse error) is plain text.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      description: >-
        The shape every gateway error response actually has (internal/gateway's
        jsonErr helper) — a single "error" string, not the {code, message}
        pair this schema previously (and incorrectly) documented. A refusal the
        caller can act on (internal/metricformula.ValidationError) starts the
        string with a stable upper-case code and a colon, e.g.
        "PROPERTY_IN_USE: Customer.region is read by Revenue; change those formulas first, then delete the property"; clients
        match on that prefix, never on the rest of the text.
      required: [error]
      properties:
        error: { type: string }

    SettingsScope:
      type: object
      description: >-
        Whose settings a per-tenant settings response shows. Every such
        request is about one tenant — named in X-Tenant-Id, or the tenant
        admin's own — or, for a platform admin naming none, the deployment's
        own row: the defaults a tenant inherits until it sets its own
        (enterprise feature deployment_settings).
      required: [deployment, inherited, deployment_settings_available]
      properties:
        customer_id: { type: string, format: uuid, description: The tenant; absent for the deployment row }
        deployment: { type: boolean }
        inherited: { type: boolean, description: The tenant has no row of its own and these are the deployment's values }
        deployment_settings_available: { type: boolean, description: Whether this edition has a deployment row at all }

    NotificationSettings:
      type: object
      description: >-
        Which outbound channels one tenant delivers on (scope says which
        tenant, or that these are the deployment's defaults). The SMTP relay
        is deployment configuration, not a setting here; mailer_configured
        (read only) says whether one exists. webhook_secret is write-only:
        it is never returned, and an empty value on update keeps the stored
        one.
      required: [email_enabled, webhook_enabled, webhook_url, reminders_enabled, reminder_lead_hours]
      properties:
        scope: { $ref: "#/components/schemas/SettingsScope" }
        email_enabled: { type: boolean }
        webhook_enabled: { type: boolean }
        webhook_url: { type: string }
        webhook_secret: { type: string, writeOnly: true }
        has_webhook_secret: { type: boolean, readOnly: true }
        reminders_enabled: { type: boolean }
        reminder_lead_hours:
          type: integer
          format: int32
          minimum: 0
          description: Remind this many hours before a task is due; 0 reminds at the due time.
        mailer_configured: { type: boolean, readOnly: true }

    GoogleConnection:
      type: object
      description: A tenant's Google service account, public half only.
      required: [configured]
      properties:
        configured: { type: boolean }
        client_email: { type: string, description: The address to share private sheets with }
        project_id: { type: string }
        updated_at: { type: string, format: date-time }

    TenantAISettings:
      type: object
      description: >-
        The tenant-level AI provider key (enterprise feature `tenant_ai_keys`).
        api_key is write-only: it is never returned, and an empty value on
        update keeps the stored one — has_key says whether one exists. When
        enforced is true the tenant key is the only key used for AI calls in
        this tenant and personal keys are ignored.
      required: [provider, model, has_key, enforced]
      properties:
        scope: { $ref: "#/components/schemas/SettingsScope" }
        provider:
          type: string
          enum: [openai, anthropic, google, mistral, deepseek]
        model:
          type: string
          description: Empty means the provider's default model.
        api_key: { type: string, writeOnly: true }
        has_key: { type: boolean, readOnly: true }
        enforced:
          type: boolean
          description: Ignore personal keys and use this one for every AI call in the tenant.

    ProviderProbeResult:
      type: object
      description: >-
        The result of a live one-shot call proving a provider/model/key can
        actually invoke tools, which the assistant requires. Always returned
        with status 200 so a failure renders inline rather than as a transport
        error.
      required: [ok, provider, model]
      properties:
        ok: { type: boolean }
        provider: { type: string }
        model: { type: string }
        reply: { type: string }
        error: { type: string }

    SsoSettings:
      type: object
      description: >-
        A tenant's single sign-on provider (enterprise feature `sso`),
        registered as a Keycloak identity provider under `alias`. The
        provider's secret is forwarded to Keycloak and never stored or
        returned; client_secret is write-only. broker_endpoint and
        sp_entity_id (read only) are what the tenant registers at their
        identity provider. registry_configured says the gateway can reach
        the identity-provider registry at all.
      required: [protocol, metadata_url, allowed_domains, jit_provisioning, default_role, enabled]
      properties:
        alias: { type: string, readOnly: true }
        protocol: { type: string, enum: [oidc, saml] }
        display_name: { type: string }
        metadata_url:
          type: string
          description: The OIDC discovery document or the SAML metadata document.
        client_id: { type: string }
        client_secret: { type: string, writeOnly: true }
        allowed_domains: { type: array, items: { type: string } }
        jit_provisioning: { type: boolean, description: Create an account on first sign-in. }
        default_role: { type: string, enum: [business_user, business_admin, developer, tenant_admin] }
        enabled: { type: boolean }
        configured: { type: boolean, readOnly: true }
        broker_endpoint: { type: string, readOnly: true }
        sp_entity_id: { type: string, readOnly: true }
        registry_configured: { type: boolean, readOnly: true }

    SsoDiscovery:
      type: object
      description: >-
        What the sign-in page needs before anyone is signed in: whether any
        tenant has single sign-on, and — given an e-mail — which provider
        alias to hint Keycloak with.
      required: [sso]
      properties:
        sso: { type: boolean }
        alias: { type: string }
        display_name: { type: string }

    ScimToken:
      type: object
      description: >-
        A SCIM bearer token. `token` is returned once, on creation, and
        never again; the database keeps only its hash.
      required: [id, name, default_role, created_at]
      properties:
        id: { type: string }
        name: { type: string }
        default_role: { type: string, enum: [business_user, business_admin, developer] }
        workspace_id: { type: string }
        created_at: { type: string, format: date-time }
        last_used_at: { type: string, format: date-time }
        revoked_at: { type: string, format: date-time }
        token: { type: string, readOnly: true }
        base_url: { type: string, readOnly: true }

    ScimResource:
      type: object
      description: A SCIM 2.0 resource (RFC 7643); the shape is the standard's, not the platform's.
      additionalProperties: true

    CellHistoryEntry:
      type: object
      description: >-
        One value an intersection held (enterprise feature `cell_history`).
        Rows come newest first; `current` marks the one the grid shows.
        Deleted rows carry when and why they left the record.
      required: [id, value, entered_at, entered_by, source, current]
      properties:
        id: { type: string }
        value: { type: number }
        entered_at: { type: string, format: date-time }
        entered_by:
          type: object
          properties:
            id: { type: string }
            name: { type: string }
            email: { type: string }
        source:
          type: object
          properties:
            kind: { type: string, enum: [typed, form, copied] }
            ref: { type: string }
            label: { type: string }
        current: { type: boolean }
        deleted_at: { type: string, format: date-time }
        delete_reason: { type: string }

    AuditSettings:
      type: object
      description: >-
        How long audit events are kept (enterprise feature `audit_export`).
        0 keeps them forever; any other value is at least min_retention_days.
      required: [retention_days]
      properties:
        retention_days: { type: integer, minimum: 0 }
        min_retention_days: { type: integer, readOnly: true }
        updated_at: { type: string, format: date-time, readOnly: true }
        scope: { $ref: "#/components/schemas/SettingsScope" }

    TenantUsage:
      type: object
      description: >-
        One tenant's usage (enterprise feature `usage_analytics`): people,
        what exists, space, and what ran in the period. active_users counts
        accounts the gateway saw or that signed in within the period.
        db_bytes is the tenant's own database size, 0 on a shared database.
      required: [customer_id, name, plan, users, active_users, applications, models, revisions]
      properties:
        status: { type: string, description: "Why the tenant could not be counted (its database not ready, or counting failed); absent when it was." }
        error:  { type: string }
        customer_id: { type: string }
        name: { type: string }
        plan: { type: string }
        created_at: { type: string, format: date-time }
        users: { type: integer }
        active_users: { type: integer }
        applications: { type: integer }
        models: { type: integer }
        revisions: { type: integer }
        fact_rows: { type: integer }
        calc_rows: { type: integer }
        form_records: { type: integer }
        object_bytes: { type: integer }
        db_bytes: { type: integer }
        integration_runs: { type: integer }
        workflow_instances: { type: integer }
        ai_messages: { type: integer }
        audit_events: { type: integer }
        last_activity_at: { type: string, format: date-time }

    Branding:
      type: object
      description: >-
        A tenant's own look (feature `white_label`, commercial and
        enterprise). Images are base64 data URLs — logo at most 256 KB,
        favicon at most 32 KB — of PNG, JPEG, SVG, WebP or ICO. brand_color
        is a hex colour. custom_domain is the host whose visitors see this
        brand before sign-in; DNS, TLS and ingress for it are the
        operator's.
      properties:
        product_name: { type: string }
        tagline: { type: string }
        logo_data_url: { type: string }
        favicon_data_url: { type: string }
        brand_color: { type: string }
        email_from_name: { type: string }
        custom_domain: { type: string }
        configured: { type: boolean, readOnly: true }
        updated_at: { type: string, format: date-time, readOnly: true }

    BrandView:
      type: object
      description: What the console applies; source says how it was resolved.
      required: [configured, source]
      properties:
        product_name: { type: string }
        tagline: { type: string }
        logo_data_url: { type: string }
        favicon_data_url: { type: string }
        brand_color: { type: string }
        configured: { type: boolean }
        source: { type: string, enum: [tenant, host, default] }

    LicenseInfo:
      type: object
      description: >-
        The license in force, as pkg/license.Status renders it. edition is the
        EFFECTIVE edition — community whenever no key is configured or the key
        is invalid or expired; the key's own details are still reported so the
        console can say what ran out.
      required: [edition, state, features, catalog, source]
      properties:
        edition: { type: string, enum: [community, commercial, enterprise] }
        state: { type: string, enum: [community, active, expired, invalid] }
        features:
          type: array
          items: { type: string }
        catalog:
          type: array
          items: { $ref: "#/components/schemas/LicenseFeature" }
        source: { type: string, enum: [env, file, none] }
        license_id: { type: string }
        customer: { type: string }
        contact: { type: string }
        issued_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        limits:
          type: object
          additionalProperties: { type: integer, format: int64 }
        error: { type: string }

    LicenseFeature:
      type: object
      required: [key, name, description, min_edition]
      properties:
        key: { type: string }
        name: { type: string }
        description: { type: string }
        min_edition: { type: string, enum: [community, commercial, enterprise] }

    Actor:
      type: object
      required: [user_id, email, display_name, roles]
      properties:
        user_id:      { type: string, format: uuid }
        email:        { type: string, format: email }
        display_name: { type: string }
        roles:        { type: array, items: { type: string } }
        # The tenant the account belongs to, when it has one of its own.
        customer_id:  { type: string, format: uuid }
        # /api/me only: what the member's plan means right now, and where
        # "change the plan" leads.
        plan:         { $ref: "#/components/schemas/PlanState" }
        contact_url:  { type: string }
        # /api/me only: the person's own display choices; null when they
        # could not be read (not the same as {}, nothing chosen).
        preferences:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/Preferences" }]

    # A person's own display choices, kept on their account. Only these keys
    # are stored; an absent key means the console default.
    Preferences:
      type: object
      properties:
        theme: { type: string, enum: [light, dark, system] }

    # A partial update: keys left out are unchanged, null resets a key to
    # the console default, an unknown key or value is refused (400).
    PreferencesUpdate:
      type: object
      properties:
        theme: { type: string, enum: [light, dark, system, null], nullable: true }

    PreferencesResponse:
      type: object
      required: [preferences]
      properties:
        preferences: { $ref: "#/components/schemas/Preferences" }

    PlanLimits:
      type: object
      description: What a plan allows; 0 or absent means unlimited (internal/plan).
      properties:
        max_users:                    { type: integer }
        max_applications:             { type: integer }
        max_models:                   { type: integer }
        max_metrics_per_model:        { type: integer }
        max_members_per_dimension:    { type: integer }
        max_fact_rows_per_model:      { type: integer }
        max_ai_messages_per_day:      { type: integer }
        max_integration_runs_per_day: { type: integer }
        max_storage_mb:               { type: integer }

    PlanInput:
      type: object
      required: [name]
      properties:
        name:         { type: string }
        description:  { type: string }
        self_service: { type: boolean, description: May be chosen at public sign-up }
        limits:       { $ref: "#/components/schemas/PlanLimits" }
        limit_note:   { type: string, description: "What a tenant is told when a limit stops it; empty: change the plan" }
        sort_order:   { type: integer }

    Plan:
      type: object
      required: [key, name, description, self_service, limits, sort_order, updated_at]
      properties:
        key:          { type: string }
        name:         { type: string }
        description:  { type: string }
        self_service: { type: boolean }
        limits:       { $ref: "#/components/schemas/PlanLimits" }
        limit_note:   { type: string }
        sort_order:   { type: integer }
        updated_at:   { type: string, format: date-time }

    PlanState:
      type: object
      description: A tenant's plan as it applies right now.
      required: [plan, plan_known, read_only, limit_state]
      properties:
        plan:             { $ref: "#/components/schemas/Plan" }
        plan_known:       { type: boolean, description: False when the tenant names a plan with no row (treated as unlimited) }
        read_only:        { type: boolean, description: Mutating requests are refused with 402 }
        code:             { type: string, enum: [over_limit] }
        reason:           { type: string }
        limit_state:      { type: string, enum: [ok, over] }
        limit_reason:     { type: string }
        usage_checked_at: { type: string, format: date-time }
        storage_bytes:    { type: integer, format: int64, description: "The tenant's data as the usage sweep last measured it (at usage_checked_at): exact in a dedicated database, an estimate in a shared one, and absent where it is not measured (a shared database on a plan without a storage limit)" }

    LegalInfo:
      type: object
      required: [published, builtin]
      properties:
        published:    { type: boolean, description: Both documents exist on this deployment }
        builtin:      { type: boolean, description: The shipped documents are rendered rather than an operator's own }
        terms_url:    { type: string, description: Where the terms of service live - empty when none are published }
        privacy_url:  { type: string, description: Where the privacy notice lives - empty when none is published }
        entity:       { type: string, description: The operator's legal name }
        address:      { type: string }
        email:        { type: string }
        jurisdiction: { type: string }
        hosting:      { type: string, description: Who hosts the deployment and where }
        updated:      { type: string, description: The date the documents last changed as YYYY-MM-DD }

    SignupOptions:
      type: object
      required: [enabled]
      properties:
        enabled:     { type: boolean }
        reason:      { type: string, description: Why sign-up is closed }
        contact_url: { type: string }
        plan:
          type: object
          properties:
            key:         { type: string }
            name:        { type: string }
            description: { type: string }
            limits:      { $ref: "#/components/schemas/PlanLimits" }
            limit_note:  { type: string, description: What a tenant is told when a limit stops it }

    SignupRequest:
      type: object
      required: [company, first_name, last_name, email]
      properties:
        company:    { type: string }
        first_name: { type: string }
        last_name:  { type: string }
        email:      { type: string, format: email }

    SignupResult:
      type: object
      required: [status, invited, email, tenant_id, application_id, model_id, plan]
      properties:
        status:         { type: string, enum: [created, invited] }
        invited:        { type: boolean }
        email:          { type: string }
        tenant_id:      { type: string, format: uuid }
        application_id: { type: string, format: uuid }
        model_id:       { type: string, format: uuid, description: "The tour model, the application's default; the three guide models are not returned" }
        plan:           { type: string }
        dev_persona:    { type: string, description: Dev stack only — the persona the new account is reachable as }

    DemoContext:
      type: object
      required: [app_id, model_id, revision, actor]
      properties:
        app_id:   { type: string, format: uuid }
        model_id: { type: string, format: uuid }
        revision: { type: string }
        actor:    { $ref: "#/components/schemas/Actor" }

    Metric:
      type: object
      required: [id, name, label, is_input]
      properties:
        id:       { type: string, format: uuid }
        name:     { type: string }
        label:    { type: string }
        formula:  { type: string, nullable: true }
        is_input: { type: boolean }
        value:
          type: number
          nullable: true
          description: >-
            GET /api/metrics only: the model-wide total (an input metric's latest whole-model entry, a
            calculated metric's persisted whole-model result). Null when there is none, and always null for a
            calculated metric when the caller has any hidden dimension member — that total includes values
            the caller cannot see.

    Department:
      type: object
      required: [code, label]
      properties:
        code:  { type: string }
        label: { type: string }
        period_start: { type: string, format: date, description: "Time members only" }
        period_end:   { type: string, format: date, description: "Time members only" }
        time_index:   { type: integer, description: "Time members only: server-owned chronological ordinal, read-only" }

    GridData:
      type: object
      required: [revision_id, metrics, dimensions, departments, cells, totals]
      description: >-
        A grid is N-dimensional. `departments` is the first dimension's members under an
        older single-dimension name, kept for compatibility; `dimensions` is the real,
        ordered dimension list and is what new callers should read.
      properties:
        revision_id: { type: string, format: uuid }
        metrics:
          type: array
          items: { $ref: "#/components/schemas/Metric" }
          description: "Metrics on this grid, hidden-metric filtered for the caller"
        all_metrics:
          type: array
          items: { $ref: "#/components/schemas/Metric" }
          description: "Every metric in the revision, so a formula can reference one outside this grid"
        dimensions:
          type: array
          items: { $ref: "#/components/schemas/GridDimension" }
          description: "This grid's configured dimensions, in order, hidden-member filtered"
        all_dimensions:
          type: array
          items: { $ref: "#/components/schemas/GridDimension" }
          description: "Every dimension in the revision, so cross-dimension formula references can resolve"
        departments:
          type: array
          items: { $ref: "#/components/schemas/Department" }
          description: "Compatibility alias for the FIRST dimension's members"
        cells:
          type: object
          description: >-
            Composite key "metricId:code1[:code2...]" to value, where the codes are that
            metric's OWN grid dimensions in order — not a single dimension code.
          additionalProperties: { type: number }
        texts:
          type: object
          description: "Text metrics' cells (format text: an input's notes, a calculation's text), keyed as cells; a dimensionless one by its bare metric id. Omitted when empty."
          additionalProperties: { type: string }
        recalc_pending:
          type: boolean
          description: "A write answered before its recalculation (recalc background) is still being calculated: calculated cells are about to change. Omitted when false."
        totals:
          type: object
          description: "metricId to its aggregate across the grid"
          additionalProperties: { type: number }
        withheld:
          type: array
          items: { type: string }
          description: >-
            Calculated values withheld from this caller because they read a dimension member
            the caller cannot see: cell keys in the cells format, and bare metric IDs for totals.
            They are absent from cells and totals; a client must not rebuild a parent value from
            children when any of them is withheld. Omitted when nothing is withheld.
        access_rules: { $ref: "#/components/schemas/GridAccessRules" }
        rollup_source_grid_id:
          type: string
          format: uuid
          nullable: true
          description: >-
            Set when this grid mirrors another grid's metrics by rollup; its cells are read-only.

    GridDimension:
      type: object
      required: [id, name, dimension_type, members]
      properties:
        id:      { type: string, format: uuid }
        name:    { type: string }
        dimension_type:          { type: string, enum: [standard, time] }
        time_granularity:        { type: string, enum: [day, week, month, quarter, half_year, year, custom], description: "Time dimensions only" }
        fiscal_year_start_month: { type: integer, minimum: 1, maximum: 12, description: "Time dimensions only" }
        business_maintained: { type: boolean, description: "Business users add, rename and remove this dimension's members (POST/PATCH/DELETE /api/dimensions/{dimId}/members)" }
        members: { type: array, items: { $ref: "#/components/schemas/Department" } }

    GridAccessRules:
      type: object
      description: "Per-caller access outcome for this grid, as applied to the payload above"
      additionalProperties: true

    WritebackRequest:
      type: object
      required: [model_id, metric_id]
      description: >-
        Identify the cell with `dim_codes` (one member code per dimension). `dim_code` is the
        older single-code form, still accepted: it writes to the one dimension of the request's
        revision that has a member with that code among the metric's own dimensions, and answers
        400 when none or several have it. There is no `revision` field — the revision is named
        by `revision_id`, and defaults to the model's active revision.
      properties:
        model_id:    { type: string, format: uuid }
        revision_id: { type: string, format: uuid, description: "Defaults to the model's active revision" }
        metric_id:   { type: string, format: uuid }
        dim_codes:
          type: object
          description: "dimensionId to member code — the preferred, N-dimensional form"
          additionalProperties: { type: string }
        dim_code:
          type: string
          description: >-
            Older single-code form, used when dim_codes is absent: writes to the one dimension of
            the request's revision that has a member with this code among the metric's own
            dimensions; 400 when none or several have it.
        value:       { type: number, description: "For a pick-list metric, the key of a member of its dimension (0 clears the cell); or send member" }
        member:
          type: string
          description: >-
            Pick-list metrics only, instead of value: the member the cell holds, by code or label
            (exact, then ignoring case); "" clears it. Anything that is not a member of the
            pick-list's dimension is refused with 400.
        text:
          type: string
          description: >-
            Text metrics (format text, an input) only, instead of value: the cell's note, at most 4000
            characters; "" clears it. A date metric (format date) takes its date as yyyy-mm-dd here,
            stored as DATE()'s serial. Refused for any other metric.
        recalc:
          type: string
          enum: [background]
          description: >-
            "background" answers once the cell is written (with "recalculating": true) and
            recalculates its dependents afterwards; until that lands, GET /api/grid reports
            recalc_pending. Omitted, the write answers after the recalculation.
        clear:
          type: boolean
          description: >-
            Empties the cell — no value, not 0: its typed rows are deleted (kept in the cell history with
            the reason "cleared"); rows a form or an import posted stay. The answer's status is "cleared".
            A dim_codes code that is no member of the dimension is refused with 400, as for any write.

    SubmitBudgetRequest:
      type: object
      properties:
        model_id:    { type: string, format: uuid }
        revision_id: { type: string, format: uuid, description: "Defaults to the model's active revision" }

    Task:
      type: object
      required: [id, instance_id, workflow_name, step_def_id, created_at]
      properties:
        tenant_id:     { type: string, description: "The tenant of the task's application; an inbox spans every database that holds the person, and completing the task addresses this tenant (X-Tenant-Id)." }
        id:            { type: string, format: uuid }
        instance_id:   { type: string, format: uuid }
        workflow_name: { type: string }
        step_def_id:   { type: string }
        context:
          type: object
          additionalProperties: {}
        context_display:
          type: array
          description: Human-readable context lines — dimension member codes and metric ids resolved to display names.
          items: { $ref: "#/components/schemas/TaskContextEntry" }
        created_at:    { type: string, format: date-time }

    TaskContextEntry:
      type: object
      required: [key, value, display]
      properties:
        key:            { type: string }
        value:          { type: string, description: "Raw context value (stable code / id)" }
        display:        { type: string, description: "Resolved human name; equals value when nothing resolves" }
        dimension_name: { type: string, description: "Dimension a member value belongs to" }

    TaskActionRequest:
      type: object
      required: [decision]
      properties:
        decision: { type: string, enum: [approve, reject, send] }
        comment:  { type: string }

    WorkflowStep:
      type: object
      required: [id, step_def_id, step_name, step_type, status]
      properties:
        id:                { type: string, format: uuid }
        step_def_id:       { type: string }
        step_name:         { type: string }
        step_type:         { type: string, enum: [task, approval, notification, condition, join], description: "join synchronises parallel branches; see activateNextSteps" }
        status:            { type: string }
        decision:          { type: string, nullable: true }
        comment:           { type: string, nullable: true }
        assignee_user_id:  { type: string, format: uuid, nullable: true }
        completed_at:      { type: string, format: date-time, nullable: true }

    WorkflowInstance:
      type: object
      required: [id, workflow_name, status, started_at]
      properties:
        id:            { type: string, format: uuid }
        workflow_name: { type: string }
        status:        { type: string, enum: [running, completed, cancelled, failed] }
        context:       { type: object, additionalProperties: {} }
        context_display:
          type: array
          description: Human-readable context lines — dimension member codes and metric ids resolved to display names.
          items: { $ref: "#/components/schemas/TaskContextEntry" }
        steps:         { type: array, items: { $ref: "#/components/schemas/WorkflowStep" } }
        started_at:    { type: string, format: date-time }
        completed_at:  { type: string, format: date-time, nullable: true }

    StartWorkflowInstanceRequest:
      type: object
      required: [workflow_def_id]
      properties:
        workflow_def_id: { type: string, format: uuid }
        context:         { type: object, additionalProperties: { type: string } }

    UpdateWorkflowInstanceRequest:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [running, completed, cancelled, failed] }

    Notification:
      type: object
      required: [id, template_id, status, created_at]
      properties:
        id:            { type: string, format: uuid }
        template_id:   { type: string }
        status:        { type: string }
        template_vars: { type: object, additionalProperties: {} }
        created_at:    { type: string, format: date-time }
        delivered_at:  { type: string, format: date-time, nullable: true }

    MarkNotificationReadRequest:
      type: object
      required: [ids]
      properties:
        ids: { type: array, items: { type: string, format: uuid } }

    MetricDef:
      type: object
      required: [id, name, label, is_input, agg_rule, format, format_decimals, format_currency, depends_on, depended_by]
      properties:
        id:              { type: string, format: uuid }
        name:            { type: string }
        label:           { type: string, description: "The stored display name, or one derived from name" }
        formula:         { type: string, nullable: true }
        is_input:        { type: boolean }
        agg_rule:        { type: string }
        format:          { type: string }
        format_decimals: { type: integer }
        format_currency: { type: string }
        time_summary:
          type: string
          enum: [sum, average, min, max, first, last, none]
          default: sum
          description: >-
            How the metric aggregates ACROSS its time dimension (agg_rule stays the rule for every
            other dimension): sum for flows, last for a closing balance, first for an opening balance,
            none when a time total is meaningless.
        picklist_dimension_id: { type: string, format: uuid, description: "format picklist: the dimension whose members the metric's cells hold" }
        picklist_allow_parents: { type: boolean, description: "format picklist: a cell may hold a parent member too; false, leaf members only" }
        highlight_rules:
          type: array
          items: { $ref: "#/components/schemas/HighlightRule" }
          description: "How the metric's cells are tinted; the first rule that holds wins. [] removes them; omitted keeps them on PATCH."
        depends_on:      { type: array, items: { type: string }, description: "Names of metrics/dimensions this formula references" }
        depended_by:     { type: array, items: { type: string }, description: "Names of metrics whose formula references this one" }
        tags:            { type: array, items: { type: string }, description: "Free-form labels the developer console filters by" }

    DimensionMember:
      type: object
      required: [id, code, label]
      properties:
        id:                { type: string, format: uuid }
        code:              { type: string }
        label:             { type: string }
        parent_member_id:  { type: string, format: uuid, nullable: true }
        period_start:      { type: string, format: date, description: "Leaf periods of a time dimension only (YYYY-MM-DD); absent on an aggregate period (H1, FY26)" }
        period_end:        { type: string, format: date, description: "Leaf periods only (YYYY-MM-DD)" }
        time_index:        { type: integer, description: "Leaf periods only: server-owned chronological ordinal, read-only. Time functions move by this order, never by code or label; aggregate periods have none." }
        formula:           { type: string, description: "A calculated member: its value, for every metric, is this formula over the dimension's other members ({RF} - {LY}); it holds no input and is in no total" }

    Dimension:
      type: object
      required: [id, name, agg_rule, dimension_type, members]
      properties:
        id:                   { type: string, format: uuid }
        name:                 { type: string }
        agg_rule:             { type: string }
        parent_dimension_id:  { type: string, format: uuid, nullable: true }
        dimension_type:
          type: string
          enum: [standard, time]
          description: "Explicit and immutable. A dimension called month is NOT a time dimension unless marked so."
        time_granularity:        { type: string, enum: [day, week, month, quarter, half_year, year, custom], description: "Time dimensions only" }
        fiscal_year_start_month: { type: integer, minimum: 1, maximum: 12, description: "Time dimensions only" }
        tags:                 { type: array, items: { type: string }, description: "Free-form labels the developer console filters by; omitted when empty" }
        source_dimension_id:  { type: string, format: uuid, description: "A property grouping: this dimension's members group this dimension's members by their source_property value (developer endpoint; omitted when none)" }
        source_property:      { type: string, description: "The declared property of source_dimension_id whose value names the group (a member's code)" }
        business_maintained:  { type: boolean, description: "Business users add, rename and remove this dimension's members (POST/PATCH/DELETE /api/dimensions/{dimId}/members); not for a time dimension or a property grouping" }
        members:              { type: array, items: { $ref: "#/components/schemas/DimensionMember" }, description: "Time members in chronological order" }

    HighlightRule:
      type: object
      required: [op, tone]
      properties:
        metric: { type: string, description: "Test this metric at the same cell instead of the cell's own value" }
        abs:    { type: boolean, description: "Compare the absolute value" }
        op:     { type: string, enum: [">", ">=", "<", "<=", "=", "<>", between, not_between, blank, not_blank] }
        value:
          description: "The constant compared with: a number, or for = and <> a text (a pick-list member's code, a note)"
          oneOf: [{ type: number }, { type: string }]
        value2: { type: number, description: "between / not_between: the upper bound" }
        than:   { type: string, description: "Compare with this metric instead of value: at the same cell when it is on the grid, else its total (a threshold setting)" }
        tone:   { type: string, enum: [negative, warning, positive, info] }

    BusinessMemberRequest:
      type: object
      properties:
        label:            { type: string, description: "The name the member shows; required on create" }
        code:             { type: string, description: "Create only; generated when omitted: the next of the dimension's numbered codes (STRAT-021), else the label in capitals" }
        parent_member_id: { type: string, format: uuid, description: "Create only: the member it goes under" }
        properties:       { type: object, additionalProperties: { type: string }, description: "Values of the dimension's declared properties" }

    DimensionProperty:
      type: object
      required: [id, dimension_id, name, data_type]
      properties:
        id:           { type: string, format: uuid }
        dimension_id: { type: string, format: uuid }
        name:         { type: string }
        data_type:    { type: string }

    DevRevision:
      type: object
      required: [id, name, description, created_at, is_active]
      properties:
        id:          { type: string, format: uuid }
        name:        { type: string }
        description: { type: string }
        created_at:  { type: string }
        is_active:   { type: boolean }

    CreateMetricRequest:
      type: object
      required: [name, is_input]
      properties:
        name:            { type: string }
        label:           { type: string, description: "Display name (\"R&D\"); omitted or blank derives it from name" }
        is_input:        { type: boolean }
        formula:         { type: string, description: "Required when is_input is false" }
        revision_id:     { type: string, format: uuid }
        agg_rule:        { type: string, default: sum }
        format:          { type: string, default: number }
        format_decimals: { type: integer }
        format_currency: { type: string, default: "$" }
        tags:            { type: array, items: { type: string } }
        picklist_dimension_id:
          type: string
          description: >-
            Required for format picklist, refused for any other: a dimension of the revision (id or
            name) whose members the metric's cells hold. A pick-list's agg_rule is none (default) or,
            calculated, formula; its time_summary none. A calculated text (format text) has the same
            rules; a date (format date) is never summed.
        picklist_allow_parents: { type: boolean, default: false, description: "format picklist: a cell may hold a parent member; otherwise leaf members only" }
        highlight_rules:
          type: array
          items: { $ref: "#/components/schemas/HighlightRule" }
          description: "How the metric's cells are tinted; the first rule that holds wins. [] removes them; omitted keeps them on PATCH."
        time_summary:
          type: string
          enum: [sum, average, min, max, first, last, none]
          default: sum
          description: >-
            How the metric aggregates ACROSS its time dimension (agg_rule stays the rule for every
            other dimension): sum for flows, last for a closing balance, first for an opening balance,
            none when a time total is meaningless.

    UpdateMetricRequest:
      type: object
      properties:
        name:            { type: string }
        label:           { type: string, description: "Omitted keeps the display name; \"\" clears it back to the name" }
        tags:            { type: array, items: { type: string }, description: "Omitted keeps the metric's tags" }
        formula:         { type: string }
        agg_rule:        { type: string }
        format:          { type: string }
        format_decimals: { type: integer }
        format_currency: { type: string }
        picklist_dimension_id: { type: string, description: "format picklist: the dimension (id or name) its cells hold members of; omitted keeps it while the format stays picklist" }
        picklist_allow_parents: { type: boolean, description: "format picklist: a cell may hold a parent member; omitted keeps it" }
        is_input:
          type: boolean
          description: >-
            Switches the metric between input and calculated, keeping its id. To an input drops its
            calculated results (send no formula); to a calculation needs formula and, for an input
            holding values, drop_values (409 otherwise).
        drop_values: { type: boolean, description: "With is_input false: delete the input's values (kept in the cell history)" }
        highlight_rules:
          type: array
          items: { $ref: "#/components/schemas/HighlightRule" }
          description: "How the metric's cells are tinted; the first rule that holds wins. [] removes them; omitted keeps them on PATCH."
        time_summary:
          type: string
          enum: [sum, average, min, max, first, last, none]
          default: sum
          description: >-
            How the metric aggregates ACROSS its time dimension (agg_rule stays the rule for every
            other dimension): sum for flows, last for a closing balance, first for an opening balance,
            none when a time total is meaningless.

    CreateRevisionRequest:
      type: object
      required: [name]
      properties:
        name:                { type: string }
        source_revision_id:  { type: string, format: uuid, description: "Revision to duplicate from, in its own model; defaults to the model's active revision" }

    CreateDimensionRequest:
      type: object
      required: [name]
      properties:
        name:                 { type: string }
        agg_rule:             { type: string, default: sum }
        revision_id:          { type: string, format: uuid }
        parent_dimension_id:  { type: string, format: uuid, nullable: true, description: "Not allowed on a time dimension" }
        tags:                 { type: array, items: { type: string } }
        source_dimension_id:
          type: string
          format: uuid
          nullable: true
          description: >-
            A property grouping: this dimension's members group the members of this standard dimension
            (same model and revision) by their value of source_property. A grouping member stands for every
            source member whose value equals its code. Not with parent_dimension_id, not on a time dimension;
            refused with INVALID_GROUPING otherwise.
        source_property:      { type: string, description: "A property DECLARED on source_dimension_id (any case; stored as declared)" }
        derive_members:       { type: boolean, default: false, description: "Also add one member (code = label = the value) per distinct non-blank value of the property" }
        business_maintained:  { type: boolean, description: "Business users add, rename and remove this dimension's members (POST/PATCH/DELETE /api/dimensions/{dimId}/members); not for a time dimension or a property grouping" }
        dimension_type:
          type: string
          enum: [standard, time]
          default: standard
          description: >-
            Omitted defaults to standard. Only a dimension created as time supports time-series
            formulas; the name never implies it. Immutable after creation.
        time_granularity:
          type: string
          enum: [day, week, month, quarter, half_year, year, custom]
          description: "Required when dimension_type is time; immutable"
        fiscal_year_start_month:
          type: integer
          minimum: 1
          maximum: 12
          description: "Required when dimension_type is time; immutable"

    UpdateDimensionRequest:
      type: object
      description: "A partial update: a field left out keeps its value."
      properties:
        name:                 { type: string }
        agg_rule:             { type: string }
        parent_dimension_id:  { type: string, format: uuid, nullable: true, description: "Send null to detach the dimension from its parent" }
        tags:                 { type: array, items: { type: string } }
        source_dimension_id:
          type: string
          format: uuid
          nullable: true
          description: >-
            Set or replace the property grouping (same rules as on create); null clears it. Clearing or replacing
            the source is refused with 409 DIMENSION_IN_USE while a formula names the dimension.
        source_property:      { type: string, description: "Change the grouping's property; recalculates the metrics reading through it" }
        derive_members:       { type: boolean, description: "Add a member for every value of the property that has none yet (e.g. after a new value appears)" }
        business_maintained:  { type: boolean, description: "Business users add, rename and remove this dimension's members (POST/PATCH/DELETE /api/dimensions/{dimId}/members); not for a time dimension or a property grouping" }

    MemberRequest:
      type: object
      properties:
        code:              { type: string }
        label:             { type: string }
        parent_member_id:  { type: string, format: uuid, nullable: true, description: "On a time dimension the parent must be an aggregate (undated) period" }
        period_start:      { type: string, format: date, description: "Time dimensions: with period_end, makes the member a leaf period (YYYY-MM-DD); omit both for an aggregate period such as H1 or FY26" }
        period_end:        { type: string, format: date, description: "See period_start" }
        formula:
          type: string
          description: >-
            Makes a top-level member of a standard dimension a calculated member: a formula over the dimension's
            other member codes ({RF} - {LY}) with IF, ABS, MIN, MAX, ROUND, AND, OR, NOT and METRICFORMAT().
            Omitted on an update keeps it; "" makes an ordinary member again. Refused (400) for a member with
            members under or above it, one holding values, an unknown member, or a cycle.

    GeneratePeriodsRequest:
      type: object
      required: [start, end]
      properties:
        start: { type: string, format: date, description: "First period start (must sit on a boundary of the dimension's granularity)" }
        end:   { type: string, format: date, description: "Last date to cover, inclusive" }
        parent_member_id: { type: string, format: uuid, description: "Optional aggregate period the generated leaves go under" }

    PropertyRequest:
      type: object
      properties:
        name:      { type: string }
        data_type: { type: string, default: text }

    MigrationApplyRequest:
      type: object
      required: [model_id]
      properties:
        model_id:       { type: string, format: uuid }
        version_number: { type: integer }

    GridDef:
      type: object
      required: [id, name, revision_id, metric_ids, dimension_ids, dimension_levels]
      properties:
        id:           { type: string, format: uuid }
        name:         { type: string }
        revision_id:  { type: string }
        metric_ids:   { type: array, items: { type: string, format: uuid } }
        dimension_ids: { type: array, items: { type: string, format: uuid } }
        dimension_levels:
          type: object
          description: "dimension_id -> display level; null means all levels shown"
          additionalProperties: { type: integer, nullable: true }

    CreateGridRequest:
      type: object
      required: [name]
      properties:
        name:        { type: string }
        revision_id: { type: string, format: uuid }

    UpdateGridRequest:
      type: object
      required: [name]
      properties:
        name: { type: string }

    GridDimensionRequest:
      type: object
      properties:
        display_level: { type: integer, nullable: true, description: "null = all levels, 0 = leaf-only, n = level n" }

    DashboardFolder:
      type: object
      required: [id, name]
      properties:
        id:        { type: string, format: uuid }
        name:      { type: string }
        parent_id: { type: string, format: uuid, nullable: true }

    FolderRequest:
      type: object
      required: [name]
      properties:
        name:      { type: string }
        parent_id: { type: string, format: uuid }

    DashboardWidget:
      type: object
      required: [id, widget_type, show_title, sort_order, col_start, col_span, pos_x, pos_y, size_w, size_h]
      properties:
        id:           { type: string, format: uuid }
        widget_type:  { type: string }
        ref_id:       { type: string, format: uuid, nullable: true }
        content:      { type: string, nullable: true }
        title:        { type: string, nullable: true }
        show_title:   { type: boolean }
        widget_props: { type: object, additionalProperties: {}, nullable: true }
        sort_order:   { type: integer }
        col_start:    { type: integer }
        col_span:     { type: integer }
        pos_x:        { type: integer }
        pos_y:        { type: integer }
        size_w:       { type: integer }
        size_h:       { type: integer }

    DashboardDef:
      type: object
      required: [id, name, tags, widgets]
      properties:
        id:        { type: string, format: uuid }
        name:      { type: string }
        tags:      { type: array, items: { type: string } }
        folder_id: { type: string, format: uuid, nullable: true, description: "Dashboard folder this dashboard is filed under; null = at the root" }
        widgets:   { type: array, items: { $ref: "#/components/schemas/DashboardWidget" } }

    CreateDashboardRequest:
      type: object
      required: [name]
      properties:
        name:        { type: string }
        tags:        { type: array, items: { type: string } }
        revision_id: { type: string, format: uuid }
        folder_id:   { type: string, format: uuid, description: "Folder to file the new dashboard under; omit or empty for the root. Must be a folder of the same model." }

    UpdateDashboardRequest:
      type: object
      required: [name]
      properties:
        name:      { type: string }
        tags:      { type: array, items: { type: string } }
        folder_id: { type: string, nullable: true, description: "Omit to leave the dashboard where it is; null or an empty string moves it to the root; a folder UUID files it under that folder. Not format:uuid because the empty string is an accepted value." }

    CreateWidgetRequest:
      type: object
      required: [widget_type]
      properties:
        widget_type:  { type: string }
        ref_id:       { type: string, format: uuid, nullable: true }
        content:      { type: string, nullable: true }
        sort_order:   { type: integer }
        col_start:    { type: integer }
        col_span:     { type: integer }
        pos_x:        { type: integer }
        pos_y:        { type: integer }
        size_w:       { type: integer, description: "Minimum enforced by the server is 20; values below that are clamped to a 200 default." }
        size_h:       { type: integer, description: "Minimum enforced by the server is 20; values below that are clamped to a 60 default." }
        widget_props: { type: object, additionalProperties: {} }
        title:        { type: string, description: "Header text; shown unless show_title is false" }
        show_title:   { type: boolean, description: "Defaults to true when a title is given" }

    UpdateWidgetRequest:
      type: object
      properties:
        ref_id:       { type: string, format: uuid, nullable: true }
        content:      { type: string, nullable: true }
        title:        { type: string, nullable: true }
        show_title:   { type: boolean, nullable: true }
