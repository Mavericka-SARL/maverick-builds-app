  /api/admin/users:
    get:
      operationId: listAdminUsers
      tags: [Admin]
      summary: List users for administration
      description: >-
        Available to platform_admin, tenant_admin, and developer roles. Platform
        admins (and platform-wide builders) see all users, in every database;
        anyone else sees the members of the tenants it holds tenant_admin or
        developer in, in every database that holds it, by its own account in
        each. Its tier in each tenant is decided by the roles it holds there,
        and each user's `permissions` by the tier in that user's own tenant;
        an application or model grant is no tier. Each row names the database
        it lives in (`tenant_id`); X-Tenant-Id limits the list to one.
      responses:
        "200":
          description: User list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AdminUser" }
    post:
      operationId: createAdminUser
      tags: [Admin]
      summary: Create a user for administration
      description: >
        Available to platform_admin, tenant_admin, and developer roles. Anyone
        but a platform admin names both a role and a workspace_id: without
        either the request is answered 400, before the address is looked at,
        alike for a new address and an existing account. The role must be one
        the caller's tier in the workspace's tenant may grant there (its
        tenant_admin or developer roles held in that tenant only). The new
        account belongs to the workspace's tenant, whoever creates it; a
        platform admin's created without a workspace belongs to none.


        An address (compared case-insensitively) or identity-provider subject
        that already has an account is not created again. For anyone but a
        platform admin, the requested role is added to that account inside
        workspace_id (checked as for a new address) and nothing else about the
        account changes: not its name, e-mail, tenant, active flag or
        identity-provider account, and no invitation is sent. The person is
        notified that they were given access (notification centre, and e-mail
        when the workspace's tenant sends notifications by e-mail; at most
        once a day per workspace and three times a day per tenant). The answer
        is the same as for a new invitation. Nothing is granted — with the
        same answer, under an id that names no account, and the refusal
        audited for the platform only — to a platform admin's account or a
        platform-wide builder's, and to an account with no tenant holding
        tenant_admin without a workspace, which a role in a new tenant's
        workspace would make that tenant's administrator. A platform admin
        creating over an existing address adopts it as before, and the
        account keeps its tenant (none, if it had none): only a new account
        takes the workspace's.


        Creates a real identity-provider account and emails a set-your-password
        invitation; no password is ever set server-side. The whole operation is
        undone if any step fails, so a user that exists can always sign in. When
        no identity provider is configured (the dev stack) the account is
        local-only and `invited` is false.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, display_name]
              properties:
                email:        { type: string, format: email }
                display_name: { type: string }
                first_name:   { type: string }
                last_name:    { type: string }
                role:         { type: string }
                workspace_id:
                  type: string
                  format: uuid
                  description: >-
                    The workspace the role is held in, and whose tenant the
                    new account belongs to. Required, with role, for anyone
                    but a platform admin.
      responses:
        "200":
          description: >-
            Created user id (the existing account's, when it was added; an id
            that names no account when nothing was granted)
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:     { type: string, format: uuid }
                  status: { type: string }
                  invited:
                    type: boolean
                    description: Whether an invitation email was sent.
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "502":
          description: >
            The identity provider rejected the request or could not send the
            invitation. No user was created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: >
            No identity provider is configured, so any account created here
            would be unable to sign in. No user was created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/admin/users/:
    post:
      operationId: createAdminUserTrailingSlash
      tags: [Admin]
      summary: Create a user for administration (identical to POST /api/admin/users)
      description: >-
        A second, directly reachable route to the same adminUserAction create
        branch that POST /api/admin/users delegates into internally — not
        just an internal implementation detail. Kept for backward
        compatibility; prefer POST /api/admin/users.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, display_name]
              properties:
                email:        { type: string, format: email }
                display_name: { type: string }
                role:         { type: string }
      responses:
        "200":
          description: Created user id
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:     { type: string, format: uuid }
                  status: { type: string }

  /api/admin/users/{id}:
    patch:
      operationId: updateAdminUser
      tags: [Admin]
      summary: Update a user's display name (only a platform_admin may modify another platform_admin)
      description: >
        Refused (403) to anyone but a platform admin unless the account's home
        is one of the caller's tenants (AdminUser.permissions.rename).
        Only display_name is mutable. The email address is the sign-in identity
        in the identity provider, and this endpoint writes only the
        application's copy — changing it here would leave the account signing
        in under the old address while the console showed the new one. Sending
        an email that differs from the stored one is rejected; to move someone
        to a new address, delete them and invite them again.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateAdminUserRequest" }
      responses:
        "200":
          description: User updated
          content:
            application/json:
              schema: { type: object, properties: { status: { type: string } } }
        "400":
          description: An attempt to change the email address
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deleteAdminUser
      tags: [Admin]
      summary: Delete a user (never yourself)
      description: >
        Refused (403) to anyone but a platform admin unless the account's home
        is one of the caller's tenants (AdminUser.permissions.delete); an
        account whose home is elsewhere is removed from the tenant instead
        (DELETE /api/admin/users/{id}/tenant-access).
        Removes the application row and the identity-provider account.
        Deleting your own account is refused: it is not undoable from inside
        the product, and for the sole platform admin it would leave nobody
        able to administer users at all. Another administrator can do it.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: User deleted
          content:
            application/json:
              schema: { type: object, properties: { status: { type: string } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/admin/users/{id}/tenant-access:
    delete:
      operationId: removeAdminUserFromTenant
      tags: [Admin]
      summary: Remove an account whose home is elsewhere from the caller's tenant
      description: >
        For an account of another tenant, or of none, that holds roles in the
        caller's workspaces (AdminUser.permissions.remove_from_tenant): deletes
        its roles in the workspaces of the caller's tenants, its memberships of
        their business roles, its grants to their applications and models, and
        its access rules on those models — nothing else; the account itself,
        its name, e-mail, tenant and identity-provider account stay. Requires
        tenant_admin (not a platform admin, whose scope names no one tenant).
        Refused for the caller itself, for an account of the caller's own
        tenant (delete it instead), for a platform admin or platform-wide
        builder, and while the account holds a role there the caller may not
        revoke. When this takes the last application or model grant narrowing
        a developer with no tenant, its unscoped developer grant is revoked in
        the same transaction (listed in `revoked`).
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Removed from the tenant
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [removed] }
                  revoked:
                    type: array
                    items: { $ref: "#/components/schemas/RevokedGrant" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/admin/users/{id}/invite:
    post:
      operationId: resendAdminUserInvitation
      tags: [Admin]
      summary: Resend the set-your-password invitation email
      description: >
        Refused (403) to anyone but a platform admin unless the account's home
        is one of the caller's tenants (AdminUser.permissions.reinvite).
        Invitations expire and mail gets lost; without this the only recovery is
        deleting and re-creating the user, which discards their roles and access
        grants. Returns 409 for users created before identity-provider
        provisioning existed — they carry a synthetic subject and have no
        account to invite.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Invitation sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  email: { type: string }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: User has no identity-provider account to invite
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "502":
          description: The identity provider could not send the email (check realm SMTP settings)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: No identity provider is configured
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/admin/users/{id}/roles:
    post:
      operationId: addAdminUserRole
      tags: [Admin]
      summary: Grant a role to a user, platform-wide or scoped to a workspace
      description: >-
        The granting actor may only assign roles strictly below their own tier
        (see assignableRoles in internal/gateway/handler.go) — a tenant_admin
        can never mint another tenant_admin, for example. Anyone but a platform
        admin grants a role without a workspace only to an account whose home
        is one of the caller's tenants.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AddUserRoleRequest" }
      responses:
        "200":
          description: Role granted
          content:
            application/json:
              schema: { type: object, properties: { status: { type: string } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/admin/users/{id}/roles/{role}:
    delete:
      operationId: removeAdminUserRole
      tags: [Admin]
      summary: Revoke a role from a user (never your own last admin role)
      description: >
        Mirrors the grant tier check. Additionally refused when the actor is
        revoking their own last grant of developer, tenant_admin or
        platform_admin — the roles that gate these endpoints — since nothing in
        the product could give it back.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: role
          in: path
          required: true
          schema: { type: string }
        - name: workspace_id
          in: query
          schema: { type: string, format: uuid }
          description: >-
            Omit to revoke the platform-level (unscoped) grant of this role —
            which anyone but a platform admin may do only on an account whose
            home is one of the caller's tenants.
      responses:
        "200":
          description: Role revoked
          content:
            application/json:
              schema: { type: object, properties: { status: { type: string } } }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/admin/users/{id}/access/apps/{appId}:
    post:
      operationId: grantAdminUserAppAccess
      tags: [Admin]
      summary: Grant a user explicit access to an application
      description: Requires platform_admin or tenant_admin. A developer may administer users but not decide who reaches which application.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: appId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Access granted
          content:
            application/json:
              schema: { type: object, properties: { status: { type: string } } }
        "403": { $ref: "#/components/responses/Forbidden" }
    delete:
      operationId: revokeAdminUserAppAccess
      tags: [Admin]
      summary: Revoke a user's explicit access to an application
      description: >-
        Requires platform_admin or tenant_admin. See grantAdminUserAppAccess.
        When this is the last application or model grant narrowing a developer
        with no tenant, and the caller is not a platform admin, that account's
        unscoped developer grant is revoked in the same transaction (audited as
        user.role_revoked, listed in `revoked`): it ends with no builder reach,
        never platform-wide.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: appId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Access revoked
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  revoked:
                    type: array
                    description: >-
                      Unscoped developer grants also taken away, so as not to
                      leave an account with no tenant platform-wide (absent
                      when none).
                    items: { $ref: "#/components/schemas/RevokedGrant" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/admin/users/{id}/access/models/{modelId}:
    post:
      operationId: grantAdminUserModelAccess
      tags: [Admin]
      summary: Grant a user explicit access to a model
      description: Requires platform_admin or tenant_admin. A developer may administer users but not decide who reaches which model.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: modelId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Access granted
          content:
            application/json:
              schema: { type: object, properties: { status: { type: string } } }
        "403": { $ref: "#/components/responses/Forbidden" }
    delete:
      operationId: revokeAdminUserModelAccess
      tags: [Admin]
      summary: Revoke a user's explicit access to a model
      description: >-
        Requires platform_admin or tenant_admin. See grantAdminUserModelAccess.
        When this is the last application or model grant narrowing a developer
        with no tenant, and the caller is not a platform admin, that account's
        unscoped developer grant is revoked in the same transaction (audited as
        user.role_revoked, listed in `revoked`): it ends with no builder reach,
        never platform-wide.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: modelId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Access revoked
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  revoked:
                    type: array
                    description: >-
                      Unscoped developer grants also taken away, so as not to
                      leave an account with no tenant platform-wide (absent
                      when none).
                    items: { $ref: "#/components/schemas/RevokedGrant" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/admin/workspaces:
    get:
      operationId: listAdminWorkspaces
      tags: [Admin]
      summary: List workspaces for user access grants
      description: Available to platform_admin, tenant_admin, and developer roles. Results are scoped to the acting admin's reachable tenant/workspace scope.
      responses:
        "200":
          description: Workspace list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AdminWorkspace" }

  /api/admin/audit:
    get:
      operationId: listAuditEvents
      tags: [Admin]
      summary: List the 200 most recent audit events
      description: >-
        Takes no query parameters. A Platform Admin sees the most recent 200 events across all tenants;
        a Tenant Admin sees only events attributable to their own customers — those whose application
        belongs to one, plus application-less events (user/tenant administration) performed by one of
        their users.
      responses:
        "200":
          description: Audit events
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AuditEvent" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/business-admin/roles:
    get:
      operationId: listBARoles
      tags: [Business Admin]
      summary: List business roles in the caller's workspace
      responses:
        "200":
          description: Role list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/BARole" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createBARole
      tags: [Business Admin]
      summary: Create a business role in the caller's workspace
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BARoleRequest" }
      responses:
        "200":
          description: Role created
          content:
            application/json:
              schema: { type: object, properties: { id: { type: string, format: uuid } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/business-admin/roles/{id}:
    patch:
      operationId: updateBARole
      tags: [Business Admin]
      summary: Rename a business role
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BARoleRequest" }
      responses:
        "200":
          description: Role updated
          content:
            application/json:
              schema: { type: object, properties: { status: { type: string } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deleteBARole
      tags: [Business Admin]
      summary: Delete a business role
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Role deleted
          content:
            application/json:
              schema: { type: object, properties: { status: { type: string } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/business-admin/roles/{id}/dashboards:
    get:
      operationId: listBARoleDashboards
      tags: [Business Admin]
      summary: List the dashboard IDs assigned to a business role
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Dashboard ID list
          content:
            application/json:
              schema: { type: array, items: { type: string, format: uuid } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      operationId: setBARoleDashboards
      tags: [Business Admin]
      summary: Set the dashboards assigned to a business role among one revision's dashboards
      description: >-
        dashboard_ids is the role's full set of dashboards within one revision: those of revision_id
        when given, else of the active revision of the model the admin is working in (X-Model-Id when it
        is a model of the application, else the application's default model). A grant the list leaves
        out is removed only among that revision's dashboards; the role's grants on other models' or
        other revisions' dashboards are kept. Every listed id is granted and must be a dashboard of the
        role's workspace.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: revision_id
          in: query
          schema: { type: string, format: uuid }
          description: >-
            The revision whose dashboards the list covers (a developer's working revision). The request
            works in this revision's model when that model is in the X-App-Id application and open to
            the caller; any other revision answers 404.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetRoleDashboardsRequest" }
      responses:
        "200":
          description: Dashboards updated
          content:
            application/json:
              schema: { type: object, properties: { status: { type: string } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403":
          description: >-
            The caller does not administer the workspace, the role is outside it, or a listed dashboard is
            not in the role's workspace
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: No such business role, or revision_id is not a revision of the model
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/business-admin/roles/{id}/members:
    get:
      operationId: listBARoleMembers
      tags: [Business Admin]
      summary: List the users assigned to a business role
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Member list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/BARoleMember" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      operationId: addBARoleMember
      tags: [Business Admin]
      summary: Add a user to a business role
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AddRoleMemberRequest" }
      responses:
        "200":
          description: Member added
          content:
            application/json:
              schema: { type: object, properties: { status: { type: string } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/business-admin/roles/{id}/members/{userId}:
    delete:
      operationId: removeBARoleMember
      tags: [Business Admin]
      summary: Remove a user from a business role
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: userId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Member removed
          content:
            application/json:
              schema: { type: object, properties: { status: { type: string } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/business-admin/users:
    get:
      operationId: listBAUsers
      tags: [Business Admin]
      summary: List business_user-role members of the caller's workspace
      responses:
        "200":
          description: User list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/BAUser" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/business-admin/users/{id}/access-rules:
    get:
      operationId: listUserAccessRules
      tags: [Business Admin]
      summary: List a user's dimension/metric access rules
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Access rule list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/UserAccessRule" }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      operationId: setUserAccessRules
      tags: [Business Admin]
      summary: Replace the full set of a user's dimension/metric access rules
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetUserAccessRulesRequest" }
      responses:
        "200":
          description: Access rules updated
          content:
            application/json:
              schema: { type: object, properties: { status: { type: string } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/business-admin/available:
    get:
      operationId: listBAAvailable
      tags: [Business Admin]
      summary: List dashboards, metrics, dimensions, or dimension members available for role/access configuration
      parameters:
        - name: type
          in: query
          required: true
          schema: { type: string, enum: [dashboards, metrics, dimensions, dimension_members] }
      responses:
        "200":
          description: Item list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/BAAvailableItem" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/ai/sessions:
    get:
      operationId: listAiSessions
      tags: [AI Assistant]
      summary: List the caller's 20 most recent AI assistant sessions in the current model
      parameters:
        - name: revision_id
          in: query
          schema: { type: string, format: uuid }
          description: Names the model whose sessions are listed (the revision's model). Without it, the application's selected or default model.
      responses:
        "200":
          description: Session list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AiSession" }
    post:
      operationId: createAiSession
      tags: [AI Assistant]
      summary: Create a new AI assistant session in the current model, seeded with the caller's saved provider/model settings
      description: A session belongs to the model it is created in; requests on it that resolve another model are refused with 409.
      parameters:
        - name: revision_id
          in: query
          schema: { type: string, format: uuid }
          description: Names the model the session belongs to (the revision's model). Without it, the application's selected or default model.
      responses:
        "200":
          description: Session created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AiSession" }

  /api/ai/sessions/{id}:
    get:
      operationId: getAiSession
      tags: [AI Assistant]
      summary: Get a session with its full message and document history
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Session detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  session:   { $ref: "#/components/schemas/AiSession" }
                  messages:  { type: array, items: { $ref: "#/components/schemas/AiChatMessage" } }
                  documents: { type: array, items: { $ref: "#/components/schemas/AiDocument" } }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: renameAiSession
      tags: [AI Assistant]
      summary: Rename a session (an explicit rename always wins over auto-naming)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title: { type: string, maxLength: 120 }
      responses:
        "200":
          description: Session renamed
          content:
            application/json:
              schema: { type: object, properties: { id: { type: string }, title: { type: string } } }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deleteAiSession
      tags: [AI Assistant]
      summary: Delete a session (and its messages/documents/proposals)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Session deleted
          content:
            application/json:
              schema: { type: object, properties: { status: { type: string } } }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/ai/sessions/{id}/messages:
    post:
      operationId: sendAiMessage
      tags: [AI Assistant]
      summary: Send a chat message and stream the assistant's reply over Server-Sent Events
      description: >-
        Response is text/event-stream, not JSON — ogen/generated clients
        cannot consume this operation and callers should use a raw fetch/
        EventSource instead. Named events: "delta" ({content}) for each
        streamed token; "tool_status" ({tool}) before executing a read tool;
        "progress" ({tool, chars, steps}) at most once a second while the
        model writes a tool call (steps: of a proposal so far);
        "proposal" ({proposal: AiProposal, messages, session, warnings}) when the model
        calls a write tool and a proposal is created instead of executing
        immediately — warnings are the plan check's (a Percentage metric
        multiplied in without / 100, SUMIFS(src, D, D) where a LOOKUP gives the
        total); "error" ({error}) on any failure (rate limit, provider
        error, invalid proposal, the turn's time limit AI_TURN_TIMEOUT —
        10 minutes by default — or the request closed by Stop, each also
        saved as the session's last message); "done" ({reply: AiChatMessage, messages,
        session}) on normal completion. 409 SESSION_PROMOTED once the
        session's draft was promoted: start a new session. Rate-limited to 50 LLM calls per
        session and 200 per user per day (429 if exceeded before any
        streaming has started — after streaming begins, limit hits are only
        reported via an "error" event since the HTTP status is already sent).
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: revision_id
          in: query
          schema: { type: string, format: uuid }
          description: Names the model, which must be the session's own (409 otherwise). Reads use the session's draft revision when it has one, else this revision, else the model's active revision.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AiSendMessageRequest" }
      responses:
        "200":
          description: SSE stream of chat events (see description)
          content:
            text/event-stream:
              schema: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: The session belongs to another model than the request names
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          description: Session or daily LLM call limit reached
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/ai/sessions/{id}/promote-draft:
    post:
      operationId: promoteAiDraft
      tags: [AI Assistant]
      summary: Make the session's isolated draft revision the model's active revision, then clear the session's draft
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Draft promoted
          content:
            application/json:
              schema:
                type: object
                properties:
                  session:  { $ref: "#/components/schemas/AiSession" }
                  messages: { type: array, items: { $ref: "#/components/schemas/AiChatMessage" } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/ai/sessions/{id}/discard-draft:
    post:
      operationId: discardAiDraft
      tags: [AI Assistant]
      summary: Delete the session's isolated draft revision and clear the session's draft, in one server-side action
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Draft discarded
          content:
            application/json:
              schema:
                type: object
                properties:
                  session:  { $ref: "#/components/schemas/AiSession" }
                  messages: { type: array, items: { $ref: "#/components/schemas/AiChatMessage" } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/ai/sessions/{id}/proposals:
    get:
      operationId: listAiProposals
      tags: [AI Assistant]
      summary: List every proposal ever made in a session, most recent first (not just pending ones) — the Activity panel's data source
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Proposal list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AiProposalWithSummary" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/ai/sessions/{id}/documents:
    post:
      operationId: uploadAiDocument
      tags: [AI Assistant]
      summary: Upload a document (pdf, xlsx, docx, csv, txt, md, json) into a session; extracted text is injected into every subsequent chat call
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        "200":
          description: Document uploaded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AiDocument" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/ai/sessions/{id}/documents/{docId}:
    delete:
      operationId: deleteAiDocument
      tags: [AI Assistant]
      summary: Delete a document from a session
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: docId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Document deleted
          content:
            application/json:
              schema: { type: object, properties: { status: { type: string } } }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/ai/sessions/{id}/conversions:
    get:
      operationId: listAiConversions
      tags: [AI Assistant]
      summary: The session's converted files (prepare_converted_file), oldest first
      description: An attachment reshaped and column-mapped into the layout an import reads. Session owner only.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Conversions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AiConversion" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/ai/sessions/{id}/conversions/{cid}:
    get:
      operationId: downloadAiConversion
      tags: [AI Assistant]
      summary: Download a converted file, rebuilt from its attachment
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: cid
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: format
          in: query
          schema: { type: string, enum: [csv, xlsx], default: csv }
      responses:
        "200":
          description: The converted file
          content:
            text/csv:
              schema: { type: string }
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422":
          description: The attachment no longer converts (its reshape no longer fits it)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/ai/sessions/{id}/proposals/{pid}/confirm:
    post:
      operationId: confirmAiProposal
      tags: [AI Assistant]
      summary: Execute a pending proposal's write steps (lazily creates the session's draft revision on first use)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: pid
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: revision_id
          in: query
          schema: { type: string, format: uuid }
          description: Names the model, which must be the session's own (409 otherwise).
      responses:
        "200":
          description: Proposal executed (fully or partially — see proposal.status)
          content:
            application/json:
              schema:
                type: object
                properties:
                  proposal: { $ref: "#/components/schemas/AiProposal" }
                  messages: { type: array, items: { $ref: "#/components/schemas/AiChatMessage" } }
                  session:  { $ref: "#/components/schemas/AiSession" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Proposal is no longer pending, or the session belongs to another model than the request names
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/ai/sessions/{id}/proposals/{pid}/reject:
    post:
      operationId: rejectAiProposal
      tags: [AI Assistant]
      summary: Reject a pending proposal without executing it
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: pid
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Proposal rejected
          content:
            application/json:
              schema:
                type: object
                properties:
                  proposal: { $ref: "#/components/schemas/AiProposal" }
                  messages: { type: array, items: { $ref: "#/components/schemas/AiChatMessage" } }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Proposal is no longer pending
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/connector:
    get:
      operationId: getConnectorInfo
      summary: The chat connector's connection details for ChatGPT and Claude (account menu)
      description: >-
        For any signed-in person: whether this deployment serves the read-only chat connector (/mcp), its URL,
        and each chat host's registered OAuth client id and secret, which they enter when adding the connector
        in that host. Every person who connects signs in with their own account and reads only what their
        access allows.
      responses:
        "200":
          description: Connection details
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConnectorInfo" }

  /api/ai/settings:
    get:
      operationId: getAiSettings
      tags: [AI Assistant]
      summary: Get the caller's saved LLM provider settings
      responses:
        "200":
          description: LLM settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AiLLMSettings" }
    put:
      operationId: saveAiSettings
      tags: [AI Assistant]
      summary: Save the caller's LLM provider settings
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AiSaveSettingsRequest" }
      responses:
        "200":
          description: Settings saved
          content:
            application/json:
              schema: { type: object, properties: { status: { type: string } } }

  /api/ai/settings/test:
    post:
      operationId: testAiSettings
      tags: [AI Assistant]
      summary: Verify a provider/model/key combination with a minimal one-shot chat call
      description: Always responds 200 with {ok, ...} — even on failure — so the frontend can render the result inline rather than as a transport error.
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AiTestSettingsRequest" }
      responses:
        "200":
          description: Test result
          content:
            application/json:
              schema:
                type: object
                required: [ok, provider, model]
                properties:
                  ok:       { type: boolean }
                  provider: { type: string }
                  model:    { type: string }
                  reply:    { type: string }
                  error:    { type: string }

  /api/import/dimension-members:
    post:
      operationId: importDimensionMembers
      tags: [Import]
      summary: One-off dimension member import (code/label/parent_code/property:<name> columns; codes auto-generated from labels when absent)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [dimension_id, csv]
              properties:
                dimension_id: { type: string, format: uuid }
                csv:          { type: string }
      responses:
        "200":
          description: Import result
          content:
            application/json:
              schema:
                type: object
                properties:
                  rows_imported: { type: integer }
                  error_rows:    { type: integer }
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/import/reshape-preview:
    post:
      operationId: previewImportReshape
      tags: [Import]
      summary: Apply a reshape to a sample file and return the rows an import would read
      description: The Import Wizard's Shape step. Uses the same code every run of a saved file integration applies (importpkg.Reshape). Nothing is stored.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                csv:         { type: string }
                xlsx_base64: { type: string }
                sheet:       { type: string }
                reshape:     { type: object, additionalProperties: true, description: "importpkg.Reshape: delimiter, header_row, fill_down, skip_rows, unpivot, constants, value_map, number_columns, decimal_comma, scale" }
      responses:
        "200":
          description: The sheet as read (first rows) and the reshaped header and rows
          content:
            application/json:
              schema:
                type: object
                properties:
                  sheets:    { type: array, items: { type: string } }
                  raw:       { type: array, items: { type: array, items: { type: string } } }
                  header:    { type: array, items: { type: string } }
                  rows:      { type: array, items: { type: array, items: { type: string } } }
                  row_count: { type: integer }
        "400": { $ref: "#/components/responses/BadRequest" }
        "422":
          description: The reshape does not fit the file; the sheet as read is returned with the error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:  { type: string }
                  raw:    { type: array, items: { type: array, items: { type: string } } }
                  sheets: { type: array, items: { type: string } }

  /api/import/upload:
    post:
      operationId: importUpload
      tags: [Import & Integrations]
      summary: Import facts from a CSV or XLSX file (atomic — any row failing validation rejects the whole file)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ImportUploadRequest" }
      responses:
        "200":
          description: Import committed
          content:
            application/json:
              schema:
                type: object
                properties:
                  job_id:      { type: string, format: uuid }
                  status:      { type: string }
                  total_rows:  { type: integer }
                  valid_rows:  { type: integer }
                  error_rows:  { type: integer }
                  revision_id: { type: string, format: uuid }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403":
          description: This revision is system-managed and read-only, or the write guard denied the write
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: One or more rows failed validation — nothing was imported
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:      { type: string }
                  error_rows: { type: integer }
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        row:       { type: integer }
                        column:    { type: string }
                        code:      { type: string }
                        message:   { type: string }
                        raw_value: { type: string }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/import/sheets/fetch:
    post:
      operationId: importSheetFetch
      tags: [Import & Integrations]
      summary: Fetch a link-shared Google Sheet as CSV text (server-side — Google's export endpoint sends no CORS headers; only docs.google.com exports for the parsed spreadsheet ID are ever requested)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sheet_url]
              properties:
                sheet_url:
                  type: string
                  description: docs.google.com spreadsheet URL (optionally carrying a worksheet gid) or a bare spreadsheet ID
      responses:
        "200":
          description: Sheet contents; the caller feeds the CSV to POST /api/import/upload (or maps it in the Import wizard) exactly like an uploaded file
          content:
            application/json:
              schema:
                type: object
                properties:
                  csv:            { type: string }
                  spreadsheet_id: { type: string }
                  gid:            { type: string }
        "400":
          description: Not a Google Sheets URL, or the sheet is not link-shared / does not exist
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "502":
          description: Google or the network failed while exporting the sheet
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/import/jobs:
    get:
      operationId: listImportJobs
      tags: [Import & Integrations]
      summary: List the 20 most recent import jobs for the model
      responses:
        "200":
          description: Import job list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ImportJob" }

  /api/import/jobs/{id}:
    delete:
      operationId: deleteImportJob
      tags: [Import & Integrations]
      summary: Delete an import job record
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Import job deleted
          content:
            application/json:
              schema: { type: object, properties: { status: { type: string } } }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/integrations:
    get:
      operationId: listBusinessIntegrations
      tags: [Import & Integrations]
      summary: List integrations visible to business users (e.g. for run-button labels)
      parameters:
        - name: revision_id
          in: query
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Integration list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/IntegrationDef" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/integrations/{id}/run:
    post:
      operationId: runIntegration
      tags: [Import & Integrations]
      summary: Run a saved integration — a csv_import with the CSV or workbook in the body, a google_sheets by re-fetching its sheet — into its form, dimension or grid. A grid run resolves names, checks members are leaves, commits valid rows through the write guard and the plan's limits (invalid rows are listed), and recalculates; every run is recorded in the integration's history. A file_export is downloaded instead (GET /api/integrations/{id}/export).
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IntegrationRunRequest" }
      responses:
        "200":
          description: Rows imported
          content:
            application/json:
              schema:
                type: object
                properties:
                  rows_imported:   { type: integer }
                  values_imported: { type: integer, description: Grid runs — one row can carry several metrics' values }
                  error_rows:      { type: integer }
                  errors:
                    type: array
                    description: Grid runs — each value that failed, by row and column
                    items: {type: object, properties: {row: {type: integer}, column: {type: string}, code: {type: string}, message: {type: string}, raw_value: {type: string}}}
        "400": { $ref: "#/components/responses/BadRequest" }
        "402": {description: The tenant's plan limit would be exceeded}
        "403": {description: The file writes a member, metric or scope the caller may not write}
        "404": { $ref: "#/components/responses/NotFound" }

  /api/integrations/{id}/export:
    get:
      operationId: downloadExportIntegration
      tags: [Import & Integrations]
      summary: Download a file_export integration — the grid's leaf-level values (inputs and calculated metrics) as CSV, XLSX or JSON in its spec's layout, built from the caller's own view of the grid (hidden members and metrics left out). Recorded in the integration's run history.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The file (Content-Disposition attachment)
          content:
            text/csv: {schema: {type: string}}
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet: {schema: {type: string, format: binary}}
            application/json: {schema: {type: array, items: {type: object}}}
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/dimensions:
    get:
      operationId: listPublicDimensions
      tags: [CRUD Forms]
      summary: List all dimensions with members for the current model (any authenticated user)
      parameters:
        - name: revision_id
          in: query
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Dimension list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Dimension" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/dimensions/{dimId}/members:
    post:
      operationId: addBusinessMember
      tags: [CRUD Forms]
      summary: A business user adds a member to a business-maintained dimension
      description: >-
        For a dimension the developer marked business_maintained (403 otherwise), on the open revision. The
        write guard applies to the parent: a hidden or read-only parent, a system-managed revision or a
        workflow lock refuses it (403).
      parameters:
        - { name: dimId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BusinessMemberRequest" }
      responses:
        "200":
          description: The member
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:   { type: string, format: uuid }
                  code: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "The code is taken, or the member has members under it, is named by a formula or held by a pick-list cell" }

  /api/dimensions/{dimId}/members/{memberId}:
    patch:
      operationId: updateBusinessMember
      tags: [CRUD Forms]
      summary: A business user renames a member of a business-maintained dimension, or sets its properties
      description: Label and properties only; a code or parent sent is refused with 400 (they are the developer's).
      parameters:
        - { name: dimId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: memberId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BusinessMemberRequest" }
      responses:
        "200": { description: Done }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deleteBusinessMember
      tags: [CRUD Forms]
      summary: A business user removes a member of a business-maintained dimension
      description: >-
        A member with members under it, one a formula names (MEMBER_IN_USE) or a pick-list cell holds is
        refused with 409. Its values go with it, kept in the cell history.
      parameters:
        - { name: dimId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: memberId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Done }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "The code is taken, or the member has members under it, is named by a formula or held by a pick-list cell" }

  /api/forms:
    get:
      operationId: listForms
      tags: [CRUD Forms]
      summary: List CRUD forms for the current model's revision
      parameters:
        - name: revision_id
          in: query
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Form list, each form with the caller's permissions on its records
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ListedForm" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      operationId: createForm
      tags: [CRUD Forms]
      summary: Create a CRUD form
      parameters:
        - name: revision_id
          in: query
          schema: { type: string, format: uuid }
          description: >-
            The revision the form belongs to; it must be a revision of the model (404 otherwise, a
            malformed id included). Omitted, the model's active revision.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateFormRequest" }
      responses:
        "200":
          description: Form created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FormDef" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/forms/{id}:
    patch:
      operationId: updateForm
      tags: [CRUD Forms]
      summary: Update a form's name, label, or fields
      description: Within the caller's builder scope (403 for a form outside it, 404 for one that does not exist).
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateFormRequest" }
      responses:
        "200":
          description: Form updated
          content:
            application/json:
              schema: { type: object, properties: { status: { type: string } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deleteForm
      tags: [CRUD Forms]
      summary: Delete a form
      description: >-
        Within the caller's builder scope (403 for a form outside it, 404 for
        one that does not exist). Deletes every record of the form with it.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Form deleted
          content:
            application/json:
              schema: { type: object, properties: { status: { type: string } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/forms/{id}/records:
    get:
      operationId: listFormRecords
      tags: [CRUD Forms]
      summary: List a form's records the caller may see, newest first, a page at a time
      description: >-
        For a caller who reaches the form's application the way the business console opens it; anyone
        else gets 404, as for a form that does not exist. Records the caller's access rules withhold are
        left out before the page is filled, so they neither shorten a page nor end the list early. Each
        record carries the caller's permissions on it. When more records may follow, the X-Next-Cursor
        response header carries the cursor for the next page.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 1000, default: 100 }
        - name: cursor
          in: query
          description: X-Next-Cursor of the previous page
          schema: { type: string }
      responses:
        "200":
          description: Record list
          headers:
            X-Next-Cursor:
              description: Cursor for the next page; absent on the last page
              schema: { type: string }
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/FormRecord" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      operationId: createFormRecord
      tags: [CRUD Forms]
      summary: Submit a new record to a form (posts to any live form-metric mappings and dispatches form_submit automation rules)
      description: >-
        For a caller who reaches the form's application (404 otherwise). The caller becomes the record's
        creator. A record created submitted dispatches form_submit rules, one created approved (by an
        administrator) form_approval rules.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateRecordRequest" }
      responses:
        "200":
          description: Record created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FormRecord" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/forms/{id}/export:
    get:
      operationId: exportFormRecords
      tags: [CRUD Forms]
      summary: Export a form's records as CSV or XLSX
      description: >-
        For a caller who reaches the form's application (404 otherwise); records the caller's access
        rules withhold are left out.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: format
          in: query
          schema: { type: string, enum: [csv, xlsx], default: csv }
      responses:
        "200":
          description: File download
          content:
            text/csv:
              schema: { type: string, format: binary }
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/forms/{id}/import:
    post:
      operationId: importFormRecords
      tags: [CRUD Forms]
      summary: Bulk-create form records from an uploaded CSV or XLSX (atomic — any row failing validation rejects the whole file)
      description: >-
        For a caller who reaches the form's application (404 otherwise), who becomes each record's
        creator. A row's optional status column sets its status; a row whose status the caller may not
        create (approved or rejected, unless the caller administers the application) fails validation.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FormImportRequest" }
      responses:
        "200":
          description: Records created
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:          { type: string }
                  records_created: { type: integer }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422":
          description: One or more rows failed validation — nothing was imported
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:      { type: string }
                  error_rows: { type: integer }
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        row:     { type: integer }
                        column:  { type: string }
                        message: { type: string }

  /api/forms/{id}/sync:
    post:
      operationId: syncFormMappings
      tags: [CRUD Forms]
      summary: Re-apply every live form-metric mapping against all of a form's existing records
      description: >-
        For an administrator of the form's application (a business_admin of
        its workspace, a developer or tenant admin within their scope, a
        platform admin): a sync re-posts every record of the form, other
        people's included. 403 for a caller who reaches the form without
        administering it, 404 for anyone else. A record whose re-post the
        caller's write guard refuses keeps the posting it has.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Sync complete
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:            { type: string }
                  mappings:          { type: integer }
                  records_processed: { type: integer }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/records/{id}:
    get:
      operationId: getFormRecord
      tags: [CRUD Forms]
      summary: Read one form record, with the caller's permissions on it
      description: >-
        For a caller who reaches the record's form's application the way the business console opens it
        and whose access rules do not withhold the record; anyone else gets 404, as for a record that
        does not exist.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The record
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FormRecord" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      operationId: updateFormRecord
      tags: [CRUD Forms]
      summary: Update a form record's data and/or status (dispatches form_submit/form_approval automation rules on status transitions)
      description: >-
        A caller who does not reach the record gets 404 (see getFormRecord). One who does may make the
        change its permissions allow (RecordPermissions: edit, and set_status for a new status) and gets
        403 for anything else. The write applies only while the record is still in the status the check
        was made against: 409 when it changed in the meantime.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateRecordRequest" }
      responses:
        "200":
          description: Record updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  record: { $ref: "#/components/schemas/FormRecord" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: The record changed since it was read; nothing was written
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      operationId: deleteFormRecord
      tags: [CRUD Forms]
      summary: Delete a form record
      description: >-
        404 for a caller who does not reach the record, 403 for one whose permissions do not include
        delete, 409 when the record changed status since it was read.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Record deleted
          content:
            application/json:
              schema: { type: object, properties: { status: { type: string } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: The record changed since it was read; nothing was deleted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/automation/rules:
    get:
      operationId: listAutomationRules
      tags: [Automation]
      summary: List automation rules for the current application/revision
      parameters:
        - name: revision_id
          in: query
          schema: { type: string, format: uuid }
          description: >-
            The revision to work in (a developer's working revision); it must be a revision of a model of
            the application (404 otherwise). Omitted, the active revision of the application's oldest model.
      responses:
        "200":
          description: Rule list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AutomationRule" }
        "404":
          description: revision_id is not a revision of a model of the application
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    post:
      operationId: createAutomationRule
      tags: [Automation]
      summary: Create an automation rule (a workflow_def_id must point at a published workflow)
      parameters:
        - name: revision_id
          in: query
          schema: { type: string, format: uuid }
          description: >-
            The revision the rule belongs to (a developer's working revision); it must be a revision of a model of
            the application (404 otherwise). Omitted, the active revision of the application's oldest model.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AutomationRuleRequest" }
      responses:
        "200":
          description: Rule created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AutomationRule" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404":
          description: revision_id is not a revision of a model of the application
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/automation/rules/{id}:
    patch:
      operationId: updateAutomationRule
      tags: [Automation]
      summary: Update an automation rule
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AutomationRuleRequest" }
      responses:
        "200":
          description: Rule updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AutomationRule" }
        "400": { $ref: "#/components/responses/BadRequest" }
    delete:
      operationId: deleteAutomationRule
      tags: [Automation]
      summary: Delete an automation rule
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Rule deleted
          content:
            application/json:
              schema: { type: object, properties: { status: { type: string } } }

  /api/automation/trigger/{id}:
    post:
      operationId: triggerAutomationRule
      tags: [Automation]
      summary: Manually trigger an automation rule, starting its workflow instance
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TriggerAutomationRequest" }
      responses:
        "200":
          description: Execution started
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AutomationExecution" }
        "400":
          description: Workflow is not published
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Caller has no RACI scope for this workflow
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: A duplicate instance already exists
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/automation/executions:
    get:
      operationId: listAutomationExecutions
      tags: [Automation]
      summary: List the 50 most recent automation rule executions for the current application
      responses:
        "200":
          description: Execution list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AutomationExecution" }

  /api/dashboards:
    get:
      operationId: listBusinessDashboards
      tags: [Business Dashboards]
      summary: List dashboards visible to the caller in the model's active revision
      description: >-
        Scoped by business-role dashboard assignment: a dashboard is visible
        if the caller has a business role it's assigned to, or if the
        dashboard's workspace defines no business roles at all (dev/demo
        fallback).
      responses:
        "200":
          description: Dashboard list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/BusinessDashboardSummary" }

  /api/dashboards/{id}:
    get:
      operationId: getBusinessDashboard
      tags: [Business Dashboards]
      summary: Get a dashboard's widgets, if the caller may access it
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Dashboard detail (tags is always empty on this endpoint — only the list endpoint populates it)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DashboardDef" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/dashboard-widgets/{id}/chart-data:
    post:
      operationId: getChartData
      tags: [Business Dashboards]
      summary: Evaluate a chart widget's live data against a grid's facts and calculated values
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChartRuntimeRequest" }
      responses:
        "200":
          description: Chart data — shape depends on the widget's configured chart_type
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: "#/components/schemas/CategoryChartData" }
                  - { $ref: "#/components/schemas/ScatterChartData" }
                  - { $ref: "#/components/schemas/HistogramChartData" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
