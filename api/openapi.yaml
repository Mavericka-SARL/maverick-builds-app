              schema: { type: object, properties: { status: { type: string } } }
        "400": { $ref: "#/components/responses/BadRequest" }
    delete:
      operationId: deleteIntegration
      tags: [Developer Console]
      summary: Delete an integration definition
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Integration deleted
          content:
            application/json:
              schema: { type: object, properties: { status: { type: string } } }

  /api/developer/integrations/{id}/runs:
    get:
      operationId: listIntegrationRuns
      tags: [Integrations]
      summary: Run history of one saved integration (most recent first, max 50)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Run list
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, status, rows_imported, error_rows, created_at]
                  properties:
                    id:            { type: string, format: uuid }
                    status:        { type: string, enum: [success, error] }
                    rows_imported: { type: integer }
                    error_rows:    { type: integer }
                    message:       { type: string }
                    created_at:    { type: string }
                    run_by:        { type: string }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/developer/integrations/{id}/config:
    patch:
      operationId: updateIntegrationConfig
      tags: [Developer Console]
      summary: Replace an integration's type-specific config blob
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateIntegrationConfigRequest" }
      responses:
        "200":
          description: Config updated
          content:
            application/json:
              schema: { type: object, properties: { status: { type: string } } }
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/developer/form-integrations:
    get:
      operationId: listFormMappings
      tags: [Developer Console]
      summary: List form-to-metric mappings for a model
      parameters:
        - name: revision_id
          in: query
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Form mapping list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/FormMetricMapping" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      operationId: createFormMapping
      tags: [Developer Console]
      summary: Create a form-to-metric mapping (posts submitted form field values into a metric's facts)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateFormMappingRequest" }
      responses:
        "200":
          description: Mapping created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:     { type: string, format: uuid }
                  status: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/developer/form-integrations/{id}:
    patch:
      operationId: updateFormMapping
      tags: [Developer Console]
      summary: Update a form-to-metric mapping (immediately re-applies it to already-submitted records)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateFormMappingRequest" }
      responses:
        "200":
          description: Mapping updated
          content:
            application/json:
              schema: { type: object, properties: { status: { type: string } } }
        "400": { $ref: "#/components/responses/BadRequest" }
    delete:
      operationId: deleteFormMapping
      tags: [Developer Console]
      summary: Delete a form-to-metric mapping
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Mapping deleted
          content:
            application/json:
              schema: { type: object, properties: { status: { type: string } } }

  /api/developer/form-integrations/{id}/backfill:
    post:
      operationId: backfillFormMapping
      tags: [Developer Console]
      summary: Re-apply a form-to-metric mapping against all already-submitted records
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Backfill complete
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:            { type: string }
                  records_processed: { type: integer }

  /api/developer/form-integrations/{id}/preview:
    get:
      operationId: previewFormMapping
      tags: [Developer Console]
      summary: Preview the fact rows a mapping would currently produce, without writing them
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Preview rows
          content:
            application/json:
              schema:
                type: array
                items: { type: object, additionalProperties: {} }

  /api/developer/workflows:
    get:
      operationId: listWorkflows
      tags: [Developer Console]
      summary: List workflow definitions for an application
      parameters:
        - name: application_id
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Workflow list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/WorkflowDefSummary" }
        "400": { $ref: "#/components/responses/BadRequest" }
    post:
      operationId: createWorkflow
      tags: [Developer Console]
      summary: Create a new workflow definition (starts in draft status, with no steps)
      parameters:
        - name: application_id
          in: query
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateWorkflowRequest" }
      responses:
        "200":
          description: Workflow created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkflowDefFull" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/developer/workflows/{id}:
    get:
      operationId: getWorkflow
      tags: [Developer Console]
      summary: Get a workflow definition, including its full step configuration
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Workflow definition
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkflowDefFull" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: updateWorkflow
      tags: [Developer Console]
      summary: Update a workflow definition's steps or metadata
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateWorkflowRequest" }
      responses:
        "200":
          description: Workflow updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkflowDefFull" }
        "400": { $ref: "#/components/responses/BadRequest" }
    delete:
      operationId: deleteWorkflow
      tags: [Developer Console]
      summary: Delete a workflow definition
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Workflow deleted
          content:
            application/json:
              schema: { type: object, properties: { status: { type: string } } }
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/developer/workflows/{id}/validate:
    post:
      operationId: validateWorkflow
      tags: [Developer Console]
      summary: Run structural validation on a workflow definition without publishing it
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: false
        description: >-
          Optional unsaved draft to validate instead of the stored definition
          (name, steps, context_schema); nothing is persisted.
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                steps: { type: array, items: { type: object, additionalProperties: true } }
                context_schema: { type: array, items: { type: object, additionalProperties: true } }
      responses:
        "200":
          description: Validation result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValidateWorkflowResponse" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/developer/workflows/{id}/publish:
    post:
      operationId: publishWorkflow
      tags: [Developer Console]
      summary: Publish a workflow definition (rejected if it fails validation)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Workflow published
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkflowDefFull" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/developer/workflows/{id}/archive:
    post:
      operationId: archiveWorkflow
      tags: [Developer Console]
      summary: Archive a workflow definition
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Workflow archived
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkflowDefFull" }

  /api/developer/workflows/{id}/restore:
    post:
      operationId: restoreWorkflow
      tags: [Developer Console]
      summary: Restore an archived workflow definition to draft
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Workflow restored to draft
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkflowDefFull" }
        "400":
          description: Not archived
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/developer/workflows/{id}/duplicate:
    post:
      operationId: duplicateWorkflow
      tags: [Developer Console]
      summary: Duplicate a workflow definition as a new draft
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DuplicateWorkflowRequest" }
      responses:
        "200":
          description: Workflow duplicated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkflowDefFull" }

  /api/developer/workflows/{id}/usage:
    get:
      operationId: getWorkflowUsage
      tags: [Developer Console]
      summary: List the automation rules that reference a workflow definition
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Usage list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/WorkflowDefUsage" }

  /api/developer/workflows/{id}/instances:
    get:
      operationId: getWorkflowInstances
      tags: [Developer Console]
      summary: List the most recent 20 executions started from a workflow definition
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Recent executions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/WorkflowInstanceSummary" }

  /api/developer/workflows/{id}/test-run:
    post:
      operationId: testRunWorkflow
      tags: [Developer Console]
      summary: Start a workflow instance in test mode
      description: >-
        Test mode is a property of the instance (workflow_instance.test_run), not a context flag.
        The run advances through the graph exactly like a real one — routing, conditions and
        auto-steps all execute — but every durable side effect is suppressed: no notifications are
        sent and no on_approve fact copies are written.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TestRunWorkflowRequest" }
      responses:
        "200":
          description: Test instance started
          content:
            application/json:
              schema:
                type: object
                properties:
                  instance_id:         { type: string, format: uuid }
                  status:              { type: string, description: "The instance's status after the run advanced as far as it could" }
                  test_run:            { type: boolean, description: "Always true for this endpoint" }
                  current_step_id:     { type: string, description: "step_def_id of the step the run stopped on, absent if it ran to completion" }
                  current_step_status: { type: string }

  /api/developer/workflow-trigger-events:
    get:
      operationId: listWorkflowTriggerEvents
      tags: [Developer Console]
      summary: List the catalog of events (system, form-submit, integration-import) that can trigger a workflow
      parameters:
        - name: application_id
          in: query
          schema: { type: string, format: uuid }
          description: Defaults to the demo/current application for the caller's context.
      responses:
        "200":
          description: Trigger event catalog
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TriggerEventCatalogItem" }

  /api/developer/workflow-roles:
    get:
      operationId: listWorkflowRoles
      tags: [Developer Console]
      summary: List business roles in the application's workspace, selectable as a workflow step's approver/assignee
      parameters:
        - name: application_id
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Role list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/WorkflowRoleRef" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/admin/me:
    get:
      operationId: getAdminMe
      tags: [Admin]
      summary: Get the current actor's admin identity
      responses:
        "200":
          description: Actor identity
          content:
            application/json:
              schema:
                type: object
                properties:
                  user_id:      { type: string, format: uuid }
                  email:        { type: string, format: email }
                  display_name: { type: string }
                  roles:        { type: array, items: { type: string } }

  /api/admin/infra/nodes:
    get:
      operationId: adminInfraNodes
      tags: [Admin]
      summary: Latest health sample per cluster node (disk/memory/load), fed by the node-stats DaemonSet
      responses:
        "200":
          description: Node health list
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [node, disk_total_gb, disk_used_gb, disk_pct, mem_total_mb, mem_available_mb, load1, collected_at, stale]
                  properties:
                    node:             { type: string }
                    disk_total_gb:    { type: number }
                    disk_used_gb:     { type: number }
                    disk_pct:         { type: integer }
                    mem_total_mb:     { type: integer }
                    mem_available_mb: { type: integer }
                    load1:            { type: number }
                    collected_at:     { type: string }
                    stale:            { type: boolean }

  /api/admin/tenants:
    get:
      operationId: listAdminTenants
      tags: [Admin]
      summary: List all tenants with app/model/revision hierarchy
      responses:
        "200":
          description: Tenant hierarchy
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AdminTenant" }
    post:
      operationId: createTenant
      tags: [Admin]
      summary: Create a tenant (platform_admin only) with a default workspace
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateTenantRequest" }
      responses:
        "200":
          description: Tenant created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:           { type: string, format: uuid }
                  workspace_id: { type: string, format: uuid }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/admin/tenants/{id}:
    patch:
      operationId: updateTenant
      tags: [Admin]
      summary: Rename a tenant (tenant_admin scoped to their own tenant; platform_admin any)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateTenantRequest" }
      responses:
        "200":
          description: Tenant updated
          content:
            application/json:
              schema: { type: object, properties: { status: { type: string } } }
        "403": { $ref: "#/components/responses/Forbidden" }
    delete:
      operationId: deleteTenant
      tags: [Admin]
      summary: Delete a tenant and cascade-delete its applications (platform_admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Tenant deleted
          content:
            application/json:
              schema: { type: object, properties: { status: { type: string } } }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/developer/applications:
    get:
      operationId: listApplicationsForDeveloper
      tags: [Admin, Developer Console]
      summary: List all tenants with app/model/revision hierarchy, scoped to the caller's developer access when not an admin
      description: Same underlying handler as GET /api/admin/tenants; reachable by developer, platform_admin, or tenant_admin. A developer's results are additionally scoped to their reachable workspace/app/model access grants.
      responses:
        "200":
          description: Tenant hierarchy
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AdminTenant" }
    post:
      operationId: createTenantForDeveloper
      tags: [Admin, Developer Console]
      summary: Create a tenant with a default workspace
      description: Same underlying handler as POST /api/admin/tenants. Despite being reachable at a developer-role-gated path, tenant creation itself still requires platform_admin — a plain developer receives 403.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateTenantRequest" }
      responses:
        "200":
          description: Tenant created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:           { type: string, format: uuid }
                  workspace_id: { type: string, format: uuid }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/admin/applications:
    get:
      operationId: listAdminApplications
      tags: [Admin]
      summary: "List the applications in the caller's scope — every tenant's for a platform admin, their own tenant's for a tenant admin"
      responses:
        "200":
          description: Application list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AdminApplicationItem" }
    post:
      operationId: createAdminApplication
      tags: [Admin]
      summary: "Create an application under a tenant (a tenant admin: their own tenant only)"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateApplicationRequest" }
      responses:
        "200":
          description: Application created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:         { type: string, format: uuid }
                  created_at: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/admin/applications/{id}:
    patch:
      operationId: updateAdminApplication
      tags: [Admin]
      summary: Rename an application
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateApplicationRequest" }
      responses:
        "200":
          description: Application updated
          content:
            application/json:
              schema: { type: object, properties: { status: { type: string } } }
    delete:
      operationId: deleteAdminApplication
      tags: [Admin]
      summary: Delete an application
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Application deleted
          content:
            application/json:
              schema: { type: object, properties: { status: { type: string } } }

  /api/admin/models:
    post:
      operationId: createAdminModel
      tags: [Admin]
      summary: Create a model under an application (no list endpoint exists; models are reached via the tenant hierarchy)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateAdminModelRequest" }
      responses:
        "200":
          description: Model created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:         { type: string, format: uuid }
                  created_at: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/admin/models/{id}/active-revision:
    put:
      operationId: setActiveRevision
      tags: [Admin]
      summary: Set a model's active revision by name
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ActiveRevisionRequest" }
      responses:
        "200":
          description: Active revision set
          content:
            application/json:
              schema: { type: object, properties: { status: { type: string } } }
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/admin/models/{id}:
    delete:
      operationId: deleteAdminModel
      tags: [Admin]
      summary: Delete a model
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Model deleted
          content:
            application/json:
              schema: { type: object, properties: { status: { type: string } } }

  /api/admin/models/{id}/export:
    get:
      operationId: exportModel
      tags: [Admin]
      summary: Export a model revision as a self-contained transfer package (tenant admins for their own tenant, platform admins for any)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: revision_id
          in: query
          schema: { type: string, format: uuid }
          description: Defaults to the model's active revision.
        - name: include_data
          in: query
          schema: { type: boolean, default: true }
          description: >-
            false exports the model's definitions only — no entered values and
            no form records; true (the default) includes them.
      responses:
        "200":
          description: Export package (also sent with a Content-Disposition attachment header)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModelExportPackage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/admin/models/{id}/export/package:
    get:
      operationId: exportModelPackage
      tags: [Admin]
      summary: Download a standalone deployment package for a model revision — a tar.gz containing the entity graph (package.json), the complete database migrations, a provenance manifest, and an infra-only docker-compose (tenant admins for their own tenant, platform admins for any)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: revision_id
          in: query
          schema: { type: string, format: uuid }
          description: Defaults to the model's active revision.
        - name: include_data
          in: query
          schema: { type: boolean, default: true }
          description: >-
            false exports the model's definitions only — no entered values and
            no form records; true (the default) includes them.
      responses:
        "200":
          description: tar.gz deployment package (sent with a Content-Disposition attachment header)
          content:
            application/gzip:
              schema: { type: string, format: binary }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/admin/models/import:
    post:
      operationId: importModel
      tags: [Admin]
      summary: Import a model export package into an application, creating a new model and revision (tenant admins for their own tenant, platform admins for any)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ModelImportRequest" }
      responses:
        "200":
          description: Model imported
          content:
            application/json:
              schema:
                type: object
                properties:
                  model_id:    { type: string, format: uuid }
                  revision_id: { type: string, format: uuid }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/admin/revisions:
    post:
      operationId: createAdminRevision
      tags: [Admin]
      summary: Create a revision under a model, copying metrics/dimensions from the model's active (or NULL-revision) definitions
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateAdminRevisionRequest" }
      responses:
        "200":
          description: Revision created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/admin/revisions/{id}:
    patch:
      operationId: updateAdminRevision
      tags: [Admin]
      summary: Rename or redescribe a revision
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
