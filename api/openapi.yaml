            application/json:
              schema:
                type: object
                properties:
                  id:     { type: string, format: uuid }
                  status: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404":
          description: >-
            The query's revision_id (a malformed one included) or the body's well-formed revision_id is
            not a revision of the model
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

