openapi: "3.0.3"

info:
  title: maverickbuilds.app API
  description: |
    Every route the maverickbuilds.app gateway registers
    (route_spec_parity_test.go keeps the two in step). Authentication is a
    Keycloak-issued bearer JWT, validated against the realm's JWKS; X-Dev-User
    replaces it only when the gateway runs with DEV_MODE=true. Operations with
    `security: []` are public; SCIM uses the tenant's own SCIM token. See
    docs/API.md for an overview of route groups and role guards.
  version: "0.1.0"
  contact:
    name: maverickbuilds.app

servers:
  - url: http://localhost:8080
    description: Local development gateway

security:
  - bearerAuth: []

tags:
  - name: Developer Console
    description: Model-authoring endpoints (developer role) — metrics, dimensions, revisions, grids, dashboards, migrations, integrations, workflows.
  - name: Admin
    description: Platform/tenant administration — tenants, applications, models, revisions, users, workspaces, audit.
  - name: Business Admin
    description: Workspace-scoped role/user administration for business users — roles, dashboard assignment, access rules.
  - name: AI Assistant
    description: Developer-facing chat assistant — sessions, streaming chat, write proposals, documents, LLM provider settings.
  - name: Import & Integrations
    description: Business-facing CSV/XLSX fact import and saved integration execution (any authenticated actor — writes are scoped by the generic write guard, not a platform role).
  - name: Workflow
    description: Runtime workflow execution — starting/submitting instances, history, notifications. Separate from the Developer Console's workflow-authoring surface.
  - name: CRUD Forms
    description: Business-user-facing CRUD forms and their submitted records (any authenticated actor).
  - name: Automation
    description: Event/manual automation rules that start workflow instances, and their execution history.
  - name: Business Dashboards
    description: Business-user dashboard rendering and chart-data queries, scoped by business-role dashboard assignment.

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    scimBearer:
      type: http
      scheme: bearer
      description: A tenant's SCIM token (mvx_scim_…), issued under Admin › SCIM; not a user's JWT.

  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    InternalError:
      description: Internal server error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      description: >-
        The shape every gateway error response actually has (internal/gateway's
        jsonErr helper) — a single "error" string, not the {code, message}
        pair this schema previously (and incorrectly) documented.
      required: [error]
      properties:
        error: { type: string }

    SettingsScope:
      type: object
      description: >-
        Whose settings a per-tenant settings response shows. Every such
        request is about one tenant — named in X-Tenant-Id, or the tenant
        admin's own — or, for a platform admin naming none, the deployment's
        own row: the defaults a tenant inherits until it sets its own
        (enterprise feature deployment_settings).
      required: [deployment, inherited, deployment_settings_available]
      properties:
        customer_id: { type: string, format: uuid, description: The tenant; absent for the deployment row }
        deployment: { type: boolean }
        inherited: { type: boolean, description: The tenant has no row of its own and these are the deployment's values }
        deployment_settings_available: { type: boolean, description: Whether this edition has a deployment row at all }

    NotificationSettings:
      type: object
      description: >-
        Which outbound channels one tenant delivers on (scope says which
        tenant, or that these are the deployment's defaults). The SMTP relay
        is deployment configuration, not a setting here; mailer_configured
        (read only) says whether one exists. webhook_secret is write-only:
        it is never returned, and an empty value on update keeps the stored
        one.
      required: [email_enabled, webhook_enabled, webhook_url, reminders_enabled, reminder_lead_hours]
      properties:
        scope: { $ref: "#/components/schemas/SettingsScope" }
        email_enabled: { type: boolean }
        webhook_enabled: { type: boolean }
        webhook_url: { type: string }
        webhook_secret: { type: string, writeOnly: true }
        has_webhook_secret: { type: boolean, readOnly: true }
        reminders_enabled: { type: boolean }
        reminder_lead_hours:
          type: integer
          format: int32
          minimum: 0
          description: Remind this many hours before a task is due; 0 reminds at the due time.
        mailer_configured: { type: boolean, readOnly: true }

    GoogleConnection:
      type: object
      description: A tenant's Google service account, public half only.
      required: [configured]
      properties:
        configured: { type: boolean }
        client_email: { type: string, description: The address to share private sheets with }
        project_id: { type: string }
        updated_at: { type: string, format: date-time }

    TenantAISettings:
      type: object
      description: >-
        The tenant-level AI provider key (enterprise feature `tenant_ai_keys`).
        api_key is write-only: it is never returned, and an empty value on
        update keeps the stored one — has_key says whether one exists. When
        enforced is true the tenant key is the only key used for AI calls in
        this tenant and personal keys are ignored.
      required: [provider, model, has_key, enforced]
      properties:
        scope: { $ref: "#/components/schemas/SettingsScope" }
        provider:
          type: string
          enum: [openai, anthropic, google, mistral, deepseek]
        model:
          type: string
          description: Empty means the provider's default model.
        api_key: { type: string, writeOnly: true }
        has_key: { type: boolean, readOnly: true }
        enforced:
          type: boolean
          description: Ignore personal keys and use this one for every AI call in the tenant.

    ProviderProbeResult:
      type: object
      description: >-
        The result of a live one-shot call proving a provider/model/key can
        actually invoke tools, which the assistant requires. Always returned
        with status 200 so a failure renders inline rather than as a transport
        error.
      required: [ok, provider, model]
      properties:
        ok: { type: boolean }
        provider: { type: string }
        model: { type: string }
        reply: { type: string }
        error: { type: string }

    SsoSettings:
      type: object
      description: >-
        A tenant's single sign-on provider (enterprise feature `sso`),
        registered as a Keycloak identity provider under `alias`. The
        provider's secret is forwarded to Keycloak and never stored or
        returned; client_secret is write-only. broker_endpoint and
        sp_entity_id (read only) are what the tenant registers at their
        identity provider. registry_configured says the gateway can reach
        the identity-provider registry at all.
      required: [protocol, metadata_url, allowed_domains, jit_provisioning, default_role, enabled]
      properties:
        alias: { type: string, readOnly: true }
        protocol: { type: string, enum: [oidc, saml] }
        display_name: { type: string }
        metadata_url:
          type: string
          description: The OIDC discovery document or the SAML metadata document.
        client_id: { type: string }
        client_secret: { type: string, writeOnly: true }
        allowed_domains: { type: array, items: { type: string } }
        jit_provisioning: { type: boolean, description: Create an account on first sign-in. }
        default_role: { type: string, enum: [business_user, business_admin, developer, tenant_admin] }
        enabled: { type: boolean }
        configured: { type: boolean, readOnly: true }
        broker_endpoint: { type: string, readOnly: true }
        sp_entity_id: { type: string, readOnly: true }
        registry_configured: { type: boolean, readOnly: true }

    SsoDiscovery:
      type: object
      description: >-
        What the sign-in page needs before anyone is signed in: whether any
        tenant has single sign-on, and — given an e-mail — which provider
        alias to hint Keycloak with.
      required: [sso]
      properties:
        sso: { type: boolean }
        alias: { type: string }
        display_name: { type: string }

    ScimToken:
      type: object
      description: >-
        A SCIM bearer token. `token` is returned once, on creation, and
        never again; the database keeps only its hash.
      required: [id, name, default_role, created_at]
      properties:
        id: { type: string }
        name: { type: string }
        default_role: { type: string, enum: [business_user, business_admin, developer] }
        workspace_id: { type: string }
        created_at: { type: string, format: date-time }
        last_used_at: { type: string, format: date-time }
        revoked_at: { type: string, format: date-time }
        token: { type: string, readOnly: true }
        base_url: { type: string, readOnly: true }

    ScimResource:
      type: object
      description: A SCIM 2.0 resource (RFC 7643); the shape is the standard's, not the platform's.
      additionalProperties: true

    CellHistoryEntry:
      type: object
      description: >-
        One value an intersection held (enterprise feature `cell_history`).
        Rows come newest first; `current` marks the one the grid shows.
        Deleted rows carry when and why they left the record.
      required: [id, value, entered_at, entered_by, source, current]
      properties:
        id: { type: string }
        value: { type: number }
        entered_at: { type: string, format: date-time }
        entered_by:
          type: object
          properties:
            id: { type: string }
            name: { type: string }
            email: { type: string }
        source:
          type: object
          properties:
            kind: { type: string, enum: [typed, form, copied] }
            ref: { type: string }
            label: { type: string }
        current: { type: boolean }
        deleted_at: { type: string, format: date-time }
        delete_reason: { type: string }

    AuditSettings:
      type: object
      description: >-
        How long audit events are kept (enterprise feature `audit_export`).
        0 keeps them forever; any other value is at least min_retention_days.
      required: [retention_days]
      properties:
        retention_days: { type: integer, minimum: 0 }
        min_retention_days: { type: integer, readOnly: true }
        updated_at: { type: string, format: date-time, readOnly: true }
        scope: { $ref: "#/components/schemas/SettingsScope" }

    TenantUsage:
      type: object
      description: >-
        One tenant's usage (enterprise feature `usage_analytics`): people,
        what exists, space, and what ran in the period. active_users counts
        accounts the gateway saw or that signed in within the period.
        db_bytes is the tenant's own database size, 0 on a shared database.
      required: [customer_id, name, plan, users, active_users, applications, models, revisions]
      properties:
        customer_id: { type: string }
        name: { type: string }
        plan: { type: string }
        created_at: { type: string, format: date-time }
        users: { type: integer }
        active_users: { type: integer }
        applications: { type: integer }
        models: { type: integer }
        revisions: { type: integer }
        fact_rows: { type: integer }
        calc_rows: { type: integer }
        form_records: { type: integer }
        object_bytes: { type: integer }
        db_bytes: { type: integer }
        integration_runs: { type: integer }
        workflow_instances: { type: integer }
        ai_messages: { type: integer }
        audit_events: { type: integer }
        last_activity_at: { type: string, format: date-time }

    Branding:
      type: object
      description: >-
        A tenant's own look (feature `white_label`, commercial and
        enterprise). Images are base64 data URLs — logo at most 256 KB,
        favicon at most 32 KB — of PNG, JPEG, SVG, WebP or ICO. brand_color
        is a hex colour. custom_domain is the host whose visitors see this
        brand before sign-in; DNS, TLS and ingress for it are the
        operator's.
      properties:
        product_name: { type: string }
        tagline: { type: string }
        logo_data_url: { type: string }
        favicon_data_url: { type: string }
        brand_color: { type: string }
        email_from_name: { type: string }
        custom_domain: { type: string }
        configured: { type: boolean, readOnly: true }
        updated_at: { type: string, format: date-time, readOnly: true }

    BrandView:
      type: object
      description: What the console applies; source says how it was resolved.
      required: [configured, source]
      properties:
        product_name: { type: string }
        tagline: { type: string }
        logo_data_url: { type: string }
        favicon_data_url: { type: string }
        brand_color: { type: string }
        configured: { type: boolean }
        source: { type: string, enum: [tenant, host, default] }

    LicenseInfo:
      type: object
      description: >-
        The license in force, as pkg/license.Status renders it. edition is the
        EFFECTIVE edition — community whenever no key is configured or the key
        is invalid or expired; the key's own details are still reported so the
        console can say what ran out.
      required: [edition, state, features, catalog, source]
      properties:
        edition: { type: string, enum: [community, commercial, enterprise] }
        state: { type: string, enum: [community, active, expired, invalid] }
        features:
          type: array
          items: { type: string }
        catalog:
          type: array
          items: { $ref: "#/components/schemas/LicenseFeature" }
        source: { type: string, enum: [env, file, none] }
        license_id: { type: string }
        customer: { type: string }
        contact: { type: string }
        issued_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        limits:
          type: object
          additionalProperties: { type: integer, format: int64 }
        error: { type: string }

    LicenseFeature:
      type: object
      required: [key, name, description, min_edition]
      properties:
        key: { type: string }
        name: { type: string }
        description: { type: string }
        min_edition: { type: string, enum: [community, commercial, enterprise] }

    Actor:
      type: object
      required: [user_id, email, display_name, roles]
      properties:
        user_id:      { type: string, format: uuid }
        email:        { type: string, format: email }
        display_name: { type: string }
        roles:        { type: array, items: { type: string } }
        # The tenant the account belongs to, when it has one of its own.
        customer_id:  { type: string, format: uuid }
        # /api/me only: what the member's plan means right now, and where
        # "change the plan" leads.
        plan:         { $ref: "#/components/schemas/PlanState" }
        contact_url:  { type: string }

    PlanLimits:
      type: object
      description: What a plan allows; 0 or absent means unlimited (internal/plan).
      properties:
        max_users:                    { type: integer }
        max_applications:             { type: integer }
        max_models:                   { type: integer }
        max_metrics_per_model:        { type: integer }
        max_members_per_dimension:    { type: integer }
        max_fact_rows_per_model:      { type: integer }
        max_ai_messages_per_day:      { type: integer }
        max_integration_runs_per_day: { type: integer }
        max_storage_mb:               { type: integer }

    PlanInput:
      type: object
      required: [name]
      properties:
        name:         { type: string }
        description:  { type: string }
        self_service: { type: boolean, description: May be chosen at public sign-up }
        limits:       { $ref: "#/components/schemas/PlanLimits" }
        limit_note:   { type: string, description: "What a tenant is told when a limit stops it; empty: change the plan" }
        sort_order:   { type: integer }

    Plan:
      type: object
      required: [key, name, description, self_service, limits, sort_order, updated_at]
      properties:
        key:          { type: string }
        name:         { type: string }
        description:  { type: string }
        self_service: { type: boolean }
        limits:       { $ref: "#/components/schemas/PlanLimits" }
        limit_note:   { type: string }
        sort_order:   { type: integer }
        updated_at:   { type: string, format: date-time }

    PlanState:
      type: object
      description: A tenant's plan as it applies right now.
      required: [plan, plan_known, read_only, limit_state]
      properties:
        plan:             { $ref: "#/components/schemas/Plan" }
        plan_known:       { type: boolean, description: False when the tenant names a plan with no row (treated as unlimited) }
        read_only:        { type: boolean, description: Mutating requests are refused with 402 }
        code:             { type: string, enum: [over_limit] }
        reason:           { type: string }
        limit_state:      { type: string, enum: [ok, over] }
        limit_reason:     { type: string }
        usage_checked_at: { type: string, format: date-time }

    LegalInfo:
      type: object
      required: [published, builtin]
      properties:
        published:    { type: boolean, description: Both documents exist on this deployment }
        builtin:      { type: boolean, description: The shipped documents are rendered rather than an operator's own }
        terms_url:    { type: string, description: Where the terms of service live - empty when none are published }
        privacy_url:  { type: string, description: Where the privacy notice lives - empty when none is published }
        entity:       { type: string, description: The operator's legal name }
        address:      { type: string }
        email:        { type: string }
        jurisdiction: { type: string }
        hosting:      { type: string, description: Who hosts the deployment and where }
        updated:      { type: string, description: The date the documents last changed as YYYY-MM-DD }

    SignupOptions:
      type: object
      required: [enabled]
      properties:
        enabled:     { type: boolean }
        reason:      { type: string, description: Why sign-up is closed }
        contact_url: { type: string }
        plan:
          type: object
          properties:
            key:         { type: string }
            name:        { type: string }
            description: { type: string }
            limits:      { $ref: "#/components/schemas/PlanLimits" }
            limit_note:  { type: string, description: What a tenant is told when a limit stops it }

    SignupRequest:
      type: object
      required: [company, first_name, last_name, email]
      properties:
        company:    { type: string }
        first_name: { type: string }
        last_name:  { type: string }
        email:      { type: string, format: email }

    SignupResult:
      type: object
      required: [status, invited, email, tenant_id, application_id, model_id, plan]
      properties:
        status:         { type: string, enum: [created, invited] }
        invited:        { type: boolean }
        email:          { type: string }
        tenant_id:      { type: string, format: uuid }
        application_id: { type: string, format: uuid }
        model_id:       { type: string, format: uuid }
        plan:           { type: string }
        dev_persona:    { type: string, description: Dev stack only — the persona the new account is reachable as }

    DemoContext:
      type: object
      required: [app_id, model_id, revision, actor]
      properties:
        app_id:   { type: string, format: uuid }
        model_id: { type: string, format: uuid }
        revision: { type: string }
        actor:    { $ref: "#/components/schemas/Actor" }

    Metric:
      type: object
      required: [id, name, label, is_input]
      properties:
        id:       { type: string, format: uuid }
        name:     { type: string }
        label:    { type: string }
        formula:  { type: string, nullable: true }
        is_input: { type: boolean }

    Department:
      type: object
      required: [code, label]
      properties:
        code:  { type: string }
        label: { type: string }
        period_start: { type: string, format: date, description: "Time members only" }
        period_end:   { type: string, format: date, description: "Time members only" }
        time_index:   { type: integer, description: "Time members only: server-owned chronological ordinal, read-only" }

    GridData:
      type: object
      required: [revision_id, metrics, dimensions, departments, cells, totals]
      description: >-
        A grid is N-dimensional. `departments` is the first dimension's members under an
        older single-dimension name, kept for compatibility; `dimensions` is the real,
        ordered dimension list and is what new callers should read.
      properties:
        revision_id: { type: string, format: uuid }
        metrics:
          type: array
          items: { $ref: "#/components/schemas/Metric" }
          description: "Metrics on this grid, hidden-metric filtered for the caller"
        all_metrics:
          type: array
          items: { $ref: "#/components/schemas/Metric" }
          description: "Every metric in the revision, so a formula can reference one outside this grid"
        dimensions:
          type: array
          items: { $ref: "#/components/schemas/GridDimension" }
          description: "This grid's configured dimensions, in order, hidden-member filtered"
        all_dimensions:
          type: array
          items: { $ref: "#/components/schemas/GridDimension" }
          description: "Every dimension in the revision, so cross-dimension formula references can resolve"
        departments:
          type: array
          items: { $ref: "#/components/schemas/Department" }
          description: "Compatibility alias for the FIRST dimension's members"
        cells:
          type: object
          description: >-
            Composite key "metricId:code1[:code2...]" to value, where the codes are that
            metric's OWN grid dimensions in order — not a single dimension code.
          additionalProperties: { type: number }
        totals:
          type: object
          description: "metricId to its aggregate across the grid"
          additionalProperties: { type: number }
        access_rules: { $ref: "#/components/schemas/GridAccessRules" }
        rollup_source_grid_id:
          type: string
          format: uuid
          nullable: true
          description: >-
            Set when this grid mirrors another grid's metrics by rollup; its cells are read-only.

    GridDimension:
      type: object
      required: [id, name, dimension_type, members]
      properties:
        id:      { type: string, format: uuid }
        name:    { type: string }
        dimension_type:          { type: string, enum: [standard, time] }
        time_granularity:        { type: string, enum: [day, week, month, quarter, half_year, year, custom], description: "Time dimensions only" }
        fiscal_year_start_month: { type: integer, minimum: 1, maximum: 12, description: "Time dimensions only" }
        members: { type: array, items: { $ref: "#/components/schemas/Department" } }

    GridAccessRules:
      type: object
      description: "Per-caller access outcome for this grid, as applied to the payload above"
      additionalProperties: true

    WritebackRequest:
      type: object
      required: [model_id, metric_id, value]
      description: >-
        Identify the cell with `dim_codes` (one member code per dimension). `dim_code` is the
        older single-dimension form and is still accepted. There is no `revision` field —
        the revision is named by `revision_id`, and defaults to the model's active revision.
      properties:
        model_id:    { type: string, format: uuid }
        revision_id: { type: string, format: uuid, description: "Defaults to the model's active revision" }
        metric_id:   { type: string, format: uuid }
        dim_codes:
          type: object
          description: "dimensionId to member code — the preferred, N-dimensional form"
          additionalProperties: { type: string }
        dim_code:
          type: string
          description: "Legacy single-dimension member code, used when dim_codes is absent"
        value:       { type: number }

    SubmitBudgetRequest:
      type: object
      properties:
        model_id:    { type: string, format: uuid }
        revision_id: { type: string, format: uuid, description: "Defaults to the model's active revision" }

    Task:
      type: object
      required: [id, instance_id, workflow_name, step_def_id, created_at]
      properties:
        id:            { type: string, format: uuid }
        instance_id:   { type: string, format: uuid }
        workflow_name: { type: string }
        step_def_id:   { type: string }
        context:
          type: object
          additionalProperties: {}
        context_display:
          type: array
          description: Human-readable context lines — dimension member codes and metric ids resolved to display names.
          items: { $ref: "#/components/schemas/TaskContextEntry" }
        created_at:    { type: string, format: date-time }

    TaskContextEntry:
      type: object
      required: [key, value, display]
      properties:
        key:            { type: string }
        value:          { type: string, description: "Raw context value (stable code / id)" }
        display:        { type: string, description: "Resolved human name; equals value when nothing resolves" }
        dimension_name: { type: string, description: "Dimension a member value belongs to" }

    TaskActionRequest:
      type: object
      required: [decision]
      properties:
        decision: { type: string, enum: [approve, reject, send] }
        comment:  { type: string }

    WorkflowStep:
      type: object
      required: [id, step_def_id, step_name, step_type, status]
      properties:
        id:                { type: string, format: uuid }
        step_def_id:       { type: string }
        step_name:         { type: string }
        step_type:         { type: string, enum: [task, approval, notification, condition, join], description: "join synchronises parallel branches; see activateNextSteps" }
        status:            { type: string }
        decision:          { type: string, nullable: true }
        comment:           { type: string, nullable: true }
        assignee_user_id:  { type: string, format: uuid, nullable: true }
        completed_at:      { type: string, format: date-time, nullable: true }

    WorkflowInstance:
      type: object
      required: [id, workflow_name, status, started_at]
      properties:
        id:            { type: string, format: uuid }
        workflow_name: { type: string }
        status:        { type: string, enum: [running, completed, cancelled, failed] }
        context:       { type: object, additionalProperties: {} }
        context_display:
          type: array
          description: Human-readable context lines — dimension member codes and metric ids resolved to display names.
          items: { $ref: "#/components/schemas/TaskContextEntry" }
        steps:         { type: array, items: { $ref: "#/components/schemas/WorkflowStep" } }
        started_at:    { type: string, format: date-time }
        completed_at:  { type: string, format: date-time, nullable: true }

    StartWorkflowInstanceRequest:
      type: object
      required: [workflow_def_id]
      properties:
        workflow_def_id: { type: string, format: uuid }
        context:         { type: object, additionalProperties: { type: string } }

    UpdateWorkflowInstanceRequest:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [running, completed, cancelled, failed] }

    Notification:
      type: object
      required: [id, template_id, status, created_at]
      properties:
        id:            { type: string, format: uuid }
        template_id:   { type: string }
        status:        { type: string }
        template_vars: { type: object, additionalProperties: {} }
        created_at:    { type: string, format: date-time }
        delivered_at:  { type: string, format: date-time, nullable: true }

    MarkNotificationReadRequest:
      type: object
      required: [ids]
      properties:
        ids: { type: array, items: { type: string, format: uuid } }

    MetricDef:
      type: object
      required: [id, name, label, is_input, agg_rule, format, format_decimals, format_currency, depends_on, depended_by]
      properties:
        id:              { type: string, format: uuid }
        name:            { type: string }
        label:           { type: string }
        formula:         { type: string, nullable: true }
        is_input:        { type: boolean }
        agg_rule:        { type: string }
        format:          { type: string }
        format_decimals: { type: integer }
        format_currency: { type: string }
        time_summary:
          type: string
          enum: [sum, average, min, max, first, last, none]
          default: sum
          description: >-
            How the metric aggregates ACROSS its time dimension (agg_rule stays the rule for every
            other dimension): sum for flows, last for a closing balance, first for an opening balance,
            none when a time total is meaningless.
        depends_on:      { type: array, items: { type: string }, description: "Names of metrics/dimensions this formula references" }
        depended_by:     { type: array, items: { type: string }, description: "Names of metrics whose formula references this one" }

    DimensionMember:
      type: object
      required: [id, code, label]
      properties:
        id:                { type: string, format: uuid }
        code:              { type: string }
        label:             { type: string }
        parent_member_id:  { type: string, format: uuid, nullable: true }
        period_start:      { type: string, format: date, description: "Leaf periods of a time dimension only (YYYY-MM-DD); absent on an aggregate period (H1, FY26)" }
        period_end:        { type: string, format: date, description: "Leaf periods only (YYYY-MM-DD)" }
        time_index:        { type: integer, description: "Leaf periods only: server-owned chronological ordinal, read-only. Time functions move by this order, never by code or label; aggregate periods have none." }

    Dimension:
      type: object
      required: [id, name, agg_rule, dimension_type, members]
      properties:
        id:                   { type: string, format: uuid }
        name:                 { type: string }
        agg_rule:             { type: string }
        parent_dimension_id:  { type: string, format: uuid, nullable: true }
        dimension_type:
          type: string
          enum: [standard, time]
          description: "Explicit and immutable. A dimension called month is NOT a time dimension unless marked so."
        time_granularity:        { type: string, enum: [day, week, month, quarter, half_year, year, custom], description: "Time dimensions only" }
        fiscal_year_start_month: { type: integer, minimum: 1, maximum: 12, description: "Time dimensions only" }
        members:              { type: array, items: { $ref: "#/components/schemas/DimensionMember" }, description: "Time members in chronological order" }

    DimensionProperty:
      type: object
      required: [id, dimension_id, name, data_type]
      properties:
        id:           { type: string, format: uuid }
        dimension_id: { type: string, format: uuid }
        name:         { type: string }
        data_type:    { type: string }

    DevRevision:
      type: object
      required: [id, name, description, created_at, is_active]
      properties:
        id:          { type: string, format: uuid }
        name:        { type: string }
        description: { type: string }
        created_at:  { type: string }
        is_active:   { type: boolean }

    CreateMetricRequest:
      type: object
      required: [name, is_input]
      properties:
        name:            { type: string }
        is_input:        { type: boolean }
        formula:         { type: string, description: "Required when is_input is false" }
        revision_id:     { type: string, format: uuid }
        agg_rule:        { type: string, default: sum }
        format:          { type: string, default: number }
        format_decimals: { type: integer }
        format_currency: { type: string, default: "$" }
        time_summary:
          type: string
          enum: [sum, average, min, max, first, last, none]
          default: sum
          description: >-
            How the metric aggregates ACROSS its time dimension (agg_rule stays the rule for every
            other dimension): sum for flows, last for a closing balance, first for an opening balance,
            none when a time total is meaningless.

    UpdateMetricRequest:
      type: object
      properties:
        name:            { type: string }
        formula:         { type: string }
        agg_rule:        { type: string }
        format:          { type: string }
        format_decimals: { type: integer }
        format_currency: { type: string }
        time_summary:
          type: string
          enum: [sum, average, min, max, first, last, none]
          default: sum
          description: >-
            How the metric aggregates ACROSS its time dimension (agg_rule stays the rule for every
            other dimension): sum for flows, last for a closing balance, first for an opening balance,
            none when a time total is meaningless.

    CreateRevisionRequest:
      type: object
      required: [name]
      properties:
        name:                { type: string }
        source_revision_id:  { type: string, format: uuid, description: "Revision to duplicate from; defaults to the model's active revision" }

    CreateDimensionRequest:
      type: object
      required: [name]
      properties:
        name:                 { type: string }
        agg_rule:             { type: string, default: sum }
        revision_id:          { type: string, format: uuid }
        parent_dimension_id:  { type: string, format: uuid, nullable: true, description: "Not allowed on a time dimension" }
        dimension_type:
          type: string
          enum: [standard, time]
          default: standard
          description: >-
            Omitted defaults to standard. Only a dimension created as time supports time-series
            formulas; the name never implies it. Immutable after creation.
        time_granularity:
          type: string
          enum: [day, week, month, quarter, half_year, year, custom]
          description: "Required when dimension_type is time; immutable"
        fiscal_year_start_month:
          type: integer
          minimum: 1
          maximum: 12
          description: "Required when dimension_type is time; immutable"

    UpdateDimensionRequest:
      type: object
      properties:
        name:                 { type: string }
        agg_rule:             { type: string }
        parent_dimension_id:  { type: string, format: uuid, nullable: true }

    MemberRequest:
      type: object
      properties:
        code:              { type: string }
        label:             { type: string }
        parent_member_id:  { type: string, format: uuid, nullable: true, description: "On a time dimension the parent must be an aggregate (undated) period" }
        period_start:      { type: string, format: date, description: "Time dimensions: with period_end, makes the member a leaf period (YYYY-MM-DD); omit both for an aggregate period such as H1 or FY26" }
        period_end:        { type: string, format: date, description: "See period_start" }

    GeneratePeriodsRequest:
      type: object
      required: [start, end]
      properties:
        start: { type: string, format: date, description: "First period start (must sit on a boundary of the dimension's granularity)" }
        end:   { type: string, format: date, description: "Last date to cover, inclusive" }
        parent_member_id: { type: string, format: uuid, description: "Optional aggregate period the generated leaves go under" }

    PropertyRequest:
      type: object
      properties:
        name:      { type: string }
        data_type: { type: string, default: text }

    MigrationApplyRequest:
      type: object
      required: [model_id]
      properties:
        model_id:       { type: string, format: uuid }
        version_number: { type: integer }

    GridDef:
      type: object
      required: [id, name, revision_id, metric_ids, dimension_ids, dimension_levels]
      properties:
        id:           { type: string, format: uuid }
        name:         { type: string }
        revision_id:  { type: string }
        metric_ids:   { type: array, items: { type: string, format: uuid } }
        dimension_ids: { type: array, items: { type: string, format: uuid } }
        dimension_levels:
          type: object
          description: "dimension_id -> display level; null means all levels shown"
          additionalProperties: { type: integer, nullable: true }

    CreateGridRequest:
      type: object
      required: [name]
      properties:
        name:        { type: string }
        revision_id: { type: string, format: uuid }

    UpdateGridRequest:
      type: object
      required: [name]
      properties:
        name: { type: string }

    GridDimensionRequest:
      type: object
      properties:
        display_level: { type: integer, nullable: true, description: "null = all levels, 0 = leaf-only, n = level n" }

    DashboardFolder:
      type: object
      required: [id, name]
      properties:
        id:        { type: string, format: uuid }
        name:      { type: string }
        parent_id: { type: string, format: uuid, nullable: true }

    FolderRequest:
      type: object
      required: [name]
      properties:
        name:      { type: string }
        parent_id: { type: string, format: uuid }

    DashboardWidget:
      type: object
      required: [id, widget_type, show_title, sort_order, col_start, col_span, pos_x, pos_y, size_w, size_h]
      properties:
        id:           { type: string, format: uuid }
        widget_type:  { type: string }
        ref_id:       { type: string, format: uuid, nullable: true }
        content:      { type: string, nullable: true }
        title:        { type: string, nullable: true }
        show_title:   { type: boolean }
        widget_props: { type: object, additionalProperties: {}, nullable: true }
        sort_order:   { type: integer }
        col_start:    { type: integer }
        col_span:     { type: integer }
        pos_x:        { type: integer }
        pos_y:        { type: integer }
        size_w:       { type: integer }
        size_h:       { type: integer }

    DashboardDef:
      type: object
      required: [id, name, tags, widgets]
      properties:
        id:        { type: string, format: uuid }
        name:      { type: string }
        tags:      { type: array, items: { type: string } }
        folder_id: { type: string, format: uuid, nullable: true, description: "Dashboard folder this dashboard is filed under; null = at the root" }
        widgets:   { type: array, items: { $ref: "#/components/schemas/DashboardWidget" } }

    CreateDashboardRequest:
      type: object
      required: [name]
      properties:
        name:        { type: string }
        tags:        { type: array, items: { type: string } }
        revision_id: { type: string, format: uuid }
        folder_id:   { type: string, format: uuid, description: "Folder to file the new dashboard under; omit or empty for the root. Must be a folder of the same model." }

    UpdateDashboardRequest:
      type: object
      required: [name]
      properties:
        name:      { type: string }
        tags:      { type: array, items: { type: string } }
        folder_id: { type: string, nullable: true, description: "Omit to leave the dashboard where it is; null or an empty string moves it to the root; a folder UUID files it under that folder. Not format:uuid because the empty string is an accepted value." }

    CreateWidgetRequest:
      type: object
      required: [widget_type]
      properties:
        widget_type:  { type: string }
        ref_id:       { type: string, format: uuid, nullable: true }
        content:      { type: string, nullable: true }
        sort_order:   { type: integer }
        col_start:    { type: integer }
        col_span:     { type: integer }
        pos_x:        { type: integer }
        pos_y:        { type: integer }
        size_w:       { type: integer, description: "Minimum enforced by the server is 20; values below that are clamped to a 200 default." }
        size_h:       { type: integer, description: "Minimum enforced by the server is 20; values below that are clamped to a 60 default." }
        widget_props: { type: object, additionalProperties: {} }

    UpdateWidgetRequest:
      type: object
      properties:
        ref_id:       { type: string, format: uuid, nullable: true }
        content:      { type: string, nullable: true }
        title:        { type: string, nullable: true }
        show_title:   { type: boolean, nullable: true }
        widget_props: { type: object, additionalProperties: {} }
        pos_x:        { type: integer }
        pos_y:        { type: integer }
        size_w:       { type: integer, description: "Minimum enforced by the server is 20." }
        size_h:       { type: integer, description: "Minimum enforced by the server is 20." }

    IntegrationDef:
      type: object
      required: [id, name, type, target_type, target_id, config]
      properties:
        id:          { type: string, format: uuid }
        name:        { type: string }
        type:        { type: string }
        target_type: { type: string }
        target_id:   { type: string }
        config:      { type: object, additionalProperties: {} }

    CreateIntegrationRequest:
      type: object
      required: [name]
      properties:
        name:        { type: string }
        type:        { type: string, default: csv_import }
        target_type: { type: string }
        target_id:   { type: string, format: uuid }

    UpdateIntegrationRequest:
      type: object
      required: [name]
      properties:
        name:        { type: string }
        target_type: { type: string }
        target_id:   { type: string, format: uuid }

    UpdateIntegrationConfigRequest:
      type: object
      required: [config]
      properties:
        config: { type: object, additionalProperties: {} }

    FormMetricMapping:
      type: object
      required: [id, form_id, grid_id, name, source_field, target_metric_id, aggregation, posting_statuses, dimension_mappings, live_posting]
      properties:
        id:                 { type: string, format: uuid }
        form_id:            { type: string, format: uuid }
        grid_id:            { type: string }
        name:               { type: string }
        source_field:       { type: string }
        target_metric_id:   { type: string, format: uuid }
        aggregation:        { type: string }
        posting_statuses:   { type: array, items: { type: string } }
        dimension_mappings: { type: object, additionalProperties: { type: string } }
        live_posting:       { type: boolean }

    CreateFormMappingRequest:
      type: object
      required: [form_id, name]
      properties:
        form_id:            { type: string, format: uuid }
        grid_id:            { type: string, format: uuid }
        name:               { type: string }
        source_field:       { type: string }
        target_metric_id:   { type: string, format: uuid }
        aggregation:        { type: string, default: sum }
        posting_statuses:   { type: array, items: { type: string }, description: "Defaults to [\"approved\"] when omitted" }
        dimension_mappings: { type: object, additionalProperties: { type: string } }
        live_posting:       { type: boolean, default: true }

    UpdateFormMappingRequest:
      type: object
      properties:
        grid_id:            { type: string, format: uuid }
        name:               { type: string }
        source_field:       { type: string }
        target_metric_id:   { type: string, format: uuid }
        aggregation:        { type: string }
        posting_statuses:   { type: array, items: { type: string } }
        dimension_mappings: { type: object, additionalProperties: { type: string } }
        live_posting:       { type: boolean, default: true }

    WorkflowDefSummary:
      type: object
      required: [id, application_id, name, description, trigger_event, status, step_count, created_at, updated_at]
      properties:
        id:             { type: string, format: uuid }
        application_id: { type: string, format: uuid }
        name:           { type: string }
        description:    { type: string }
        trigger_event:  { type: string }
        status:         { type: string }
        step_count:     { type: integer }
        created_at:     { type: string, format: date-time }
        updated_at:     { type: string, format: date-time }
        published_at:   { type: string, format: date-time, nullable: true }
        archived_at:    { type: string, format: date-time, nullable: true }

    WorkflowDefFull:
      type: object
      required: [id, application_id, name, description, trigger_event, subject_type, subject_config, status, steps, context_schema, created_at, updated_at]
      properties:
        id:             { type: string, format: uuid }
        application_id: { type: string, format: uuid }
        name:           { type: string }
        description:    { type: string }
        trigger_event:  { type: string }
        subject_type:   { type: string }
        subject_config: { type: object, additionalProperties: {} }
        status:         { type: string, enum: [draft, published, archived] }
        steps:          { type: array, items: { type: object, additionalProperties: {} } }
        context_schema: { type: object, additionalProperties: {} }
        single_active_instance: { type: boolean, description: One running instance per dimension-member scope; a second start with the same members is refused as a duplicate. Default true. }
        created_at:     { type: string, format: date-time }
        updated_at:     { type: string, format: date-time }
        published_at:   { type: string, format: date-time, nullable: true }
        archived_at:    { type: string, format: date-time, nullable: true }

    CreateWorkflowRequest:
      type: object
      required: [name]
      properties:
        name:          { type: string }
        description:   { type: string }
        trigger_event: { type: string, default: manual }

    UpdateWorkflowRequest:
      type: object
      properties:
        name:           { type: string }
        description:    { type: string }
        trigger_event:  { type: string }
        subject_type:   { type: string }
        subject_config: { type: object, additionalProperties: {} }
        steps:          { type: array, items: { type: object, additionalProperties: {} } }
        context_schema: { type: object, additionalProperties: {} }
        single_active_instance: { type: boolean }

    DuplicateWorkflowRequest:
      type: object
      properties:
        name: { type: string, description: "Defaults to \"Copy\" when omitted" }

    TestRunWorkflowRequest:
      type: object
      properties:
        context: { type: object, additionalProperties: { type: string } }

    ValidateWorkflowResponse:
      type: object
      required: [valid, errors]
      properties:
        valid:  { type: boolean }
        errors: { type: array, items: { type: string } }

    WorkflowDefUsage:
      type: object
      required: [rule_id, rule_name, trigger_type, enabled]
      properties:
        rule_id:      { type: string, format: uuid }
        rule_name:    { type: string }
        trigger_type: { type: string }
        enabled:      { type: boolean }

    WorkflowInstanceSummary:
      type: object
      required: [id, rule_id, application_id, status, trigger_payload, started_at]
      properties:
        id:              { type: string, format: uuid }
        rule_id:         { type: string }
        application_id:  { type: string, format: uuid }
        status:          { type: string }
        trigger_payload: { type: object, additionalProperties: { type: string } }
        instance_id:     { type: string, format: uuid }
        error:           { type: string }
        started_at:      { type: string, format: date-time }
        completed_at:    { type: string, format: date-time, nullable: true }

    TriggerPayloadField:
      type: object
      required: [key, type, required]
      properties:
        key:      { type: string }
        type:     { type: string }
        required: { type: boolean }

    TriggerEventCatalogItem:
      type: object
      required: [key, label, description, category, source_type, payload_schema, enabled, created_from]
      properties:
        key:            { type: string }
        label:          { type: string }
        description:    { type: string }
        category:       { type: string }
        source_type:    { type: string }
        source_id:      { type: string }
        source_name:    { type: string }
        payload_schema: { type: array, items: { $ref: "#/components/schemas/TriggerPayloadField" } }
        enabled:        { type: boolean }
        created_from:   { type: string }

    WorkflowRoleRef:
      type: object
      required: [id, name]
      properties:
        id:   { type: string, format: uuid }
        name: { type: string }

    UserAssignment:
      type: object
      required: [role, workspace_id, workspace_name, customer_name]
      properties:
        role:           { type: string }
        workspace_id:   { type: string, description: Empty string means platform-level role }
        workspace_name: { type: string }
        customer_name:  { type: string }

    AdminUser:
      type: object
      required: [id, email, display_name, created_at, assignments, app_ids, model_ids]
      properties:
        id:            { type: string, format: uuid }
        email:         { type: string, format: email }
        display_name:  { type: string }
        created_at:    { type: string }
        assignments:   { type: array, items: { $ref: "#/components/schemas/UserAssignment" } }
        app_ids:       { type: array, items: { type: string, format: uuid } }
        model_ids:     { type: array, items: { type: string, format: uuid } }

    AuditEvent:
      type: object
      description: >-
        The shape actually returned by GET /api/admin/audit (auditEventItem
        in internal/gateway/handler.go). The endpoint accepts no query
        parameters despite the SQL comment structure suggesting filters —
        it unconditionally returns the 200 most recent events.
      required: [id, category, event_type, actor_name, actor_role, application_id, application_name, resource_type, resource_id, revision_id, revision_name, occurred_at]
      properties:
        id:            { type: string, format: uuid }
        category:
          type: string
          enum: [auth, data_change, model_change, policy_change, admin, ai_assistant]
        event_type:    { type: string }
        actor_name:    { type: string, description: "\"system\" when there is no actor user" }
        actor_role:    { type: string }
        application_id:   { type: string }
        application_name: { type: string }
        resource_type: { type: string }
        resource_id:   { type: string }
        revision_id:   { type: string }
        revision_name: { type: string }
        metadata:
          type: object
          additionalProperties: {}
        occurred_at:   { type: string, format: date-time }

    AdminRevisionItem:
      type: object
      required: [id, name, created_at]
      properties:
        id:         { type: string, format: uuid }
        name:       { type: string }
        created_at: { type: string }

    AdminModel:
      type: object
      required: [id, name, storage_type, active_revision, revisions]
      properties:
        id:              { type: string, format: uuid }
        name:            { type: string }
        storage_type:    { type: string }
        active_revision: { type: string, nullable: true }
        revisions:       { type: array, items: { $ref: "#/components/schemas/AdminRevisionItem" } }

    AdminApp:
      type: object
      required: [id, name, mode, status, models]
      properties:
        id:     { type: string, format: uuid }
        name:   { type: string }
        mode:   { type: string, enum: [planning, crud, execution] }
        status: { type: string }
        models: { type: array, items: { $ref: "#/components/schemas/AdminModel" } }

    AdminWorkspace:
      type: object
      required: [id, name, customer_name, customer_id]
      properties:
        id:            { type: string, format: uuid }
        name:          { type: string }
        customer_name: { type: string }
        customer_id:   { type: string, format: uuid }

    AdminTenant:
      type: object
      required: [id, name, plan, created_at, applications]
      properties:
        id:           { type: string, format: uuid }
        name:         { type: string }
        plan:         { type: string }
        created_at:   { type: string }
        applications: { type: array, items: { $ref: "#/components/schemas/AdminApp" } }
        plan_state:   { $ref: "#/components/schemas/PlanState" }

    CreateTenantRequest:
      type: object
      required: [name]
      properties:
        name: { type: string }
        plan: { type: string, default: standard }

    UpdateTenantRequest:
      type: object
      properties:
        name: { type: string }
        # Platform administrators only: the plan key.
        plan: { type: string }

    AdminApplicationItem:
      type: object
      required: [id, customer_id, name, mode, status, created_at]
      properties:
        id:          { type: string, format: uuid }
        customer_id: { type: string, format: uuid }
        name:        { type: string }
        mode:        { type: string, enum: [planning, crud, execution] }
        status:      { type: string }
        created_at:  { type: string }

    CreateApplicationRequest:
      type: object
      required: [customer_id, name]
      properties:
        customer_id: { type: string, format: uuid }
        name:        { type: string }
        mode:        { type: string, enum: [planning, crud, execution], default: planning }

    UpdateApplicationRequest:
      type: object
      properties:
        name: { type: string }

    CreateAdminModelRequest:
      type: object
      required: [application_id, name]
      properties:
        application_id: { type: string, format: uuid }
        name:           { type: string }
        storage_type:   { type: string, default: oltp }

    ActiveRevisionRequest:
      type: object
      required: [revision_name]
      properties:
        revision_name: { type: string }

    CreateAdminRevisionRequest:
      type: object
      required: [model_id, name]
      properties:
        model_id:    { type: string, format: uuid }
        name:        { type: string }
        description: { type: string }

    UpdateAdminRevisionRequest:
      type: object
      properties:
        name:        { type: string }
        description: { type: string }

    UpdateAdminUserRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          description: >
            Immutable. Accepted only when it equals the stored address, so a
            client may echo back what it read; any other value is rejected.
        display_name: { type: string }

    AddUserRoleRequest:
      type: object
      required: [role]
      properties:
        role:         { type: string }
        workspace_id: { type: string, format: uuid, description: "Omit for a platform-level (unscoped) grant" }

    ModelExportPackage:
      type: object
      description: >-
        Self-contained export of one model revision — the same entity set
        model.revision duplication copies (dimensions, metrics, dependencies,
        grids, folders, dashboards, forms, form records/mappings,
        integrations, workflows, automation rules, facts), plus an envelope.
        Nested entity shapes mirror the corresponding Developer Console
        resources and are not separately typed here.
      required: [format, version, exported_at, model_name, storage_type, revision_name]
      properties:
        format:           { type: string }
        version:          { type: integer }
        include_data:     { type: boolean, description: "false = definitions only (no facts, no form records)" }
        exported_at:      { type: string, format: date-time }
        model_name:       { type: string }
        storage_type:     { type: string }
        revision_name:    { type: string }
        facts_policy:     { type: string, description: "Explicit, inspectable statement of the export policy applied to facts: one latest-wins value per cell for direct entries, plus every form-posted value for that same cell (both survive — they are summed, not alternatives)." }
        dimensions:       { type: array, items: { type: object, additionalProperties: {} } }
        metrics:          { type: array, items: { type: object, additionalProperties: {} } }
        dependencies:     { type: array, items: { type: object, additionalProperties: {} } }
        grids:            { type: array, items: { type: object, additionalProperties: {} } }
        folders:          { type: array, items: { type: object, additionalProperties: {} } }
        dashboards:       { type: array, items: { type: object, additionalProperties: {} } }
        forms:            { type: array, items: { type: object, additionalProperties: {} } }
        form_records:     { type: array, items: { type: object, additionalProperties: {} } }
        form_mappings:    { type: array, items: { type: object, additionalProperties: {} } }
        integrations:     { type: array, items: { type: object, additionalProperties: {} } }
        workflows:        { type: array, items: { type: object, additionalProperties: {} } }
        automation_rules: { type: array, items: { type: object, additionalProperties: {} } }
        facts:            { type: array, items: { type: object, additionalProperties: {} } }

    ModelImportRequest:
      type: object
      required: [application_id, package]
      properties:
        application_id: { type: string, format: uuid }
        package:        { $ref: "#/components/schemas/ModelExportPackage" }

    BARole:
      type: object
      required: [id, name, member_count, dashboard_ids]
      properties:
        id:            { type: string, format: uuid }
        name:          { type: string }
        member_count:  { type: integer }
        dashboard_ids: { type: array, items: { type: string, format: uuid } }

    BARoleRequest:
      type: object
      required: [name]
      properties:
        name: { type: string }

    SetRoleDashboardsRequest:
      type: object
      required: [dashboard_ids]
      properties:
        dashboard_ids: { type: array, items: { type: string, format: uuid } }

    BARoleMember:
      type: object
      required: [user_id, display_name, email]
      properties:
        user_id:      { type: string, format: uuid }
        display_name: { type: string }
        email:        { type: string, format: email }

    AddRoleMemberRequest:
      type: object
      required: [user_id]
      properties:
        user_id: { type: string, format: uuid }

    BAUser:
      type: object
      required: [id, display_name, email, role]
      properties:
        id:           { type: string, format: uuid }
        display_name: { type: string }
        email:        { type: string, format: email }
        role:         { type: string }

    UserAccessRule:
      type: object
      required: [rule_type, ref_id, ref_name, access]
      properties:
        rule_type: { type: string }
        ref_id:    { type: string }
        ref_name:  { type: string, description: "Always empty — not populated by the current query" }
        access:    { type: string }

    SetUserAccessRulesRequest:
      type: object
      required: [rules]
      properties:
        rules:
          type: array
          items:
            type: object
            required: [rule_type, ref_id, access]
            properties:
              rule_type: { type: string }
              ref_id:    { type: string }
              access:    { type: string }

    BAAvailableItem:
      type: object
      required: [id, name]
      properties:
        id:    { type: string, format: uuid }
        name:  { type: string }
        group: { type: string, description: "Populated only for type=dashboards (tag list) and type=dimension_members (owning dimension name)" }

    AiSession:
      type: object
      required: [id, app_id, user_id, llm_provider, llm_model, created_at]
      properties:
        id:                { type: string, format: uuid }
        app_id:            { type: string, format: uuid }
        user_id:           { type: string, format: uuid }
        llm_provider:      { type: string }
        llm_model:         { type: string }
        title:             { type: string, description: "Human name; auto-generated from the first request, renameable. Empty = unnamed." }
        draft_revision_id: { type: string, format: uuid, description: "Set once this session's first confirmed proposal lazily creates an isolated draft revision" }
        created_at:        { type: string, format: date-time }

    AiToolCall:
      type: object
      required: [id, name, arguments]
      properties:
        id:        { type: string }
        name:      { type: string }
        arguments: { type: object, additionalProperties: {} }

    AiChatMessage:
      type: object
      required: [id, session_id, role, content, created_at]
      properties:
        id:            { type: string, format: uuid }
        session_id:    { type: string, format: uuid }
        role:          { type: string, enum: [user, assistant, tool] }
        content:       { type: string }
        tool_calls:    { type: array, items: { $ref: "#/components/schemas/AiToolCall" } }
        tool_call_id:  { type: string }
        tool_name:     { type: string }
        created_at:    { type: string, format: date-time }

    AiDocument:
      type: object
      required: [id, session_id, filename, mime_type, char_count, truncated, created_at]
      properties:
        id:         { type: string, format: uuid }
        session_id: { type: string, format: uuid }
        filename:   { type: string }
        mime_type:  { type: string }
        char_count: { type: integer }
        truncated:  { type: boolean }
        created_at: { type: string, format: date-time }

    AiSendMessageRequest:
      type: object
      required: [content]
      properties:
        content: { type: string }

    AiProposalStep:
      type: object
      required: [tool, description, params]
      properties:
        tool:        { type: string }
        description: { type: string }
        params:      { type: object, additionalProperties: {} }
        status:      { type: string, enum: [pending, success, failed] }
        result:      { type: string, description: "Human-readable outcome, set after execution" }
        created_id:  { type: string, description: "ID of the resource the step created, if any" }

    AiProposal:
      type: object
      required: [id, session_id, steps, status, created_at]
      properties:
        id:          { type: string, format: uuid }
        session_id:  { type: string, format: uuid }
        steps:       { type: array, items: { $ref: "#/components/schemas/AiProposalStep" } }
        status:      { type: string, enum: [pending, confirmed, rejected, executed, partial] }
        created_at:  { type: string, format: date-time }
        executed_at: { type: string, format: date-time, nullable: true }

    AiProposalWithSummary:
      allOf:
        - $ref: "#/components/schemas/AiProposal"
        - type: object
          required: [summary]
          properties:
            summary: { type: string, description: "Human-readable one-liner: buildExecutionSummary's per-step-collapsed text for executed/partial proposals, a short status line otherwise" }

    AiLLMSettings:
      type: object
      required: [provider, model, has_key]
      properties:
        provider: { type: string }
        model:    { type: string }
        has_key:  { type: boolean, description: "True when an API key is stored; the key itself is never returned" }

    AiSaveSettingsRequest:
      type: object
      properties:
        provider: { type: string, default: openai, description: "openai, anthropic, google, mistral or deepseek; anything else is refused" }
        model:    { type: string, description: "Any model ID the provider offers; empty means the provider's default model" }
        api_key:  { type: string, description: "Omit to keep the existing stored key" }

    AiTestSettingsRequest:
      type: object
      properties:
        provider: { type: string, description: "Falls back to the caller's stored settings, then \"openai\"" }
        model:    { type: string, description: "Falls back to the caller's stored settings, then the provider's default model" }
        api_key:  { type: string, description: "Falls back to the caller's stored (decrypted) key, then a provider-specific env var" }

    ImportUploadRequest:
      type: object
      properties:
        csv:          { type: string, description: "Raw CSV text; required unless xlsx_base64 is given" }
        xlsx_base64:  { type: string, description: "Base64-encoded .xlsx workbook; required unless csv is given" }
        revision_id:  { type: string, format: uuid, description: "Defaults to the model's active revision" }
        import_mode:  { type: string, enum: [incremental, replace, full_reload], default: incremental }

    ProtoTimestamp:
      type: object
      description: >-
        The wire shape of a google.protobuf.Timestamp field on this endpoint
        — ImportJob is a protobuf-generated Go struct serialized with the
        standard library's encoding/json (not protojson), so timestamps
        appear as their raw {seconds, nanos} fields rather than an RFC3339
        string.
      properties:
        seconds: { type: integer }
        nanos:   { type: integer }

    ColumnMapping:
      type: object
      properties:
        source_column: { type: string }
        target_field:  { type: string }

    ImportJob:
      type: object
      description: >-
        Also a raw protobuf-generated struct (see ProtoTimestamp) — status is
        the numeric enum value, not a string: 0=unspecified, 1=validating,
        2=staged, 3=committed, 4=failed, 5=aborted.
      properties:
        id:            { type: string, format: uuid }
        model_id:      { type: string, format: uuid }
        scenario:      { type: string, description: "Deprecated — use revision_id" }
        status:        { type: integer, enum: [0, 1, 2, 3, 4, 5] }
        total_rows:    { type: integer }
        valid_rows:    { type: integer }
        error_rows:    { type: integer }
        mappings:      { type: array, items: { $ref: "#/components/schemas/ColumnMapping" } }
        created_at:    { $ref: "#/components/schemas/ProtoTimestamp" }
        completed_at:  { $ref: "#/components/schemas/ProtoTimestamp" }
        revision_id:   { type: string, format: uuid }

    IntegrationRunRequest:
      type: object
      properties:
        csv:
          type: string
          description: Required for type "csv_import". Ignored for type "google_sheets" — those integrations re-fetch the sheet named by their config's sheet_url at run time.

    FormField:
      type: object
      required: [name, label, type, required]
      properties:
        name:            { type: string }
        label:           { type: string }
        type:            { type: string, enum: [text, number, select, date, boolean, dimension, metric] }
        required:        { type: boolean }
        options:         { type: array, items: { type: string } }
        dimension_id:    { type: string, format: uuid, description: "Set when type=dimension" }
        allowed_members: { type: array, items: { type: string }, description: "Set when type=dimension" }
        metric_id:       { type: string, format: uuid, description: "Set when type=metric" }
        value_field:     { type: string, description: "Set when type=metric — name of the sibling field holding the numeric amount" }

    FormDef:
      type: object
      required: [id, model_id, name, label, fields, created_at]
      properties:
        id:         { type: string, format: uuid }
        model_id:   { type: string, format: uuid }
        name:       { type: string }
        label:      { type: string }
        fields:     { type: array, items: { $ref: "#/components/schemas/FormField" } }
        created_at: { type: string, format: date-time }

    CreateFormRequest:
      type: object
      properties:
        name:   { type: string }
        label:  { type: string }
        fields: { type: array, items: { $ref: "#/components/schemas/FormField" } }

    FormRecord:
      type: object
      required: [id, form_id, data, status, created_by, created_at, updated_at]
      properties:
        id:         { type: string, format: uuid }
        form_id:    { type: string, format: uuid }
        data:       { type: object, additionalProperties: {} }
        status:     { type: string, enum: [draft, submitted, approved, rejected] }
        created_by: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    CreateRecordRequest:
      type: object
      properties:
        data: { type: object, additionalProperties: {} }

    UpdateRecordRequest:
      type: object
      properties:
        data:   { type: object, additionalProperties: {} }
        status: { type: string, enum: [draft, submitted, approved, rejected], default: draft }

    FormImportRequest:
      type: object
      properties:
        csv:         { type: string, description: "Raw CSV text; required unless xlsx_base64 is given. Columns match form field names, falling back to labels." }
        xlsx_base64: { type: string, description: "Base64-encoded .xlsx workbook; required unless csv is given" }

    AutomationRule:
      type: object
      required: [id, application_id, name, description, trigger_type, workflow_name, enabled, created_at, max_retries, retry_backoff_seconds]
      properties:
        id:                     { type: string, format: uuid }
        application_id:         { type: string, format: uuid }
        revision_id:            { type: string, format: uuid, description: "Empty means revision-global" }
        name:                   { type: string }
        description:            { type: string }
        trigger_type:           { type: string, enum: [manual, form_submit, api, form_approval, grid_change, schedule, integration_completed, integration_failed] }
        workflow_name:          { type: string }
        workflow_def_id:        { type: string, format: uuid }
        source_form_id:         { type: string, format: uuid }
        source_grid_id:         { type: string, format: uuid }
        source_integration_id:  { type: string, format: uuid, description: integration_completed / integration_failed rules only — one integration, or any when absent }
        enabled:                { type: boolean }
        created_at:             { type: string, format: date-time }
        cron_expr:              { type: string, description: "Standard 5-field cron expression; set only when trigger_type=schedule" }
        timezone:               { type: string, description: "IANA timezone name the cron expression is evaluated in" }
        misfire_policy:         { type: string, enum: [skip, fire_now], description: "What happens to a tick found significantly overdue (e.g. after downtime): skip it, or fire once for the most recent one" }
        max_retries:            { type: integer }
        retry_backoff_seconds:  { type: integer }
        next_fire_at:           { type: string, format: date-time, nullable: true }
        last_fire_at:           { type: string, format: date-time, nullable: true }

    AutomationRuleRequest:
      type: object
      properties:
        name:                  { type: string }
        description:           { type: string }
        trigger_type:          { type: string, enum: [manual, form_submit, api, form_approval, grid_change, schedule, integration_completed, integration_failed], default: manual }
        workflow_name:         { type: string }
        workflow_def_id:       { type: string, format: uuid }
        source_form_id:        { type: string, format: uuid }
        source_grid_id:        { type: string, format: uuid }
        source_integration_id: { type: string, format: uuid }
        enabled:               { type: boolean, description: "PATCH only" }
        cron_expr:             { type: string, description: "Required when trigger_type=schedule (create), or to (re)configure an existing schedule (update)" }
        timezone:              { type: string, default: UTC }
        misfire_policy:        { type: string, enum: [skip, fire_now], default: skip }
        max_retries:           { type: integer, default: 0 }
        retry_backoff_seconds: { type: integer, default: 60 }

    TriggerAutomationRequest:
      type: object
      properties:
        payload: { type: object, additionalProperties: { type: string } }

    AutomationExecution:
      type: object
      required: [id, rule_id, application_id, status, trigger_payload, started_at]
      properties:
        id:              { type: string, format: uuid }
        rule_id:         { type: string }
        application_id:  { type: string, format: uuid }
        status:          { type: string }
        trigger_payload: { type: object, additionalProperties: { type: string } }
        instance_id:     { type: string, format: uuid }
        error:           { type: string }
        started_at:      { type: string, format: date-time }
        scheduled_for:   { type: string, format: date-time, nullable: true, description: "Set only for scheduler-originated executions — the cron tick this execution claims" }
        claimed_by:      { type: string, description: "Worker-instance identifier that claimed this scheduled tick, for execution-ownership observability" }
        completed_at:    { type: string, format: date-time, nullable: true }

    BusinessDashboardSummary:
      type: object
      required: [id, name, tags]
      properties:
        id:        { type: string, format: uuid }
        name:      { type: string }
        tags:      { type: array, items: { type: string } }
        folder_id: { type: string, format: uuid, nullable: true, description: "Folder this dashboard is filed under; null = at the root" }

    ChartRuntimeRequest:
      type: object
      properties:
        context: { type: object, additionalProperties: { type: string }, description: "Overrides the widget's saved context_defaults for this render" }

    ChartContextMember:
      type: object
      required: [code, label]
      properties:
        code:        { type: string }
        label:       { type: string }
        parent_code: { type: string }

    ChartContextDim:
      type: object
      required: [id, name, members]
      properties:
        id:      { type: string, format: uuid }
        name:    { type: string }
        members: { type: array, items: { $ref: "#/components/schemas/ChartContextMember" } }

    ChartMetricLabel:
      type: object
      required: [id, label, format, format_decimals, format_currency]
      properties:
        id:              { type: string, format: uuid }
        label:           { type: string }
        format:          { type: string }
        format_decimals: { type: integer }
        format_currency: { type: string }

    GridChartCategory:
      type: object
      required: [key, label]
      properties:
        key:   { type: string }
        label: { type: string }

    GridChartSeries:
      type: object
      required: [metric_id, label, values, format, format_decimals, format_currency]
      properties:
        metric_id:       { type: string, format: uuid }
        label:           { type: string }
        values:          { type: array, items: { type: number, nullable: true } }
        format:          { type: string }
        format_decimals: { type: integer }
        format_currency: { type: string }

    CategoryChartData:
      type: object
      description: Returned when the widget's chart_type is bar, line, or pie.
      required: [chart_type, as_of, categories, series, context_dims]
      properties:
        chart_type:   { type: string, enum: [bar, line, pie] }
        as_of:        { type: string, format: date-time }
        categories:   { type: array, items: { $ref: "#/components/schemas/GridChartCategory" } }
        series:       { type: array, items: { $ref: "#/components/schemas/GridChartSeries" } }
        context_dims: { type: array, items: { $ref: "#/components/schemas/ChartContextDim" } }
        context:
          type: object
          additionalProperties: { type: string }
          description: >-
            The context the data was resolved for. Differs from the request when a
            requested member is hidden from the caller: the resolver substitutes that
            dimension's default visible member instead of failing.

    ScatterPoint:
      type: object
      required: [key, label, x, y]
      properties:
        key:   { type: string }
        label: { type: string }
        x:     { type: number }
        y:     { type: number }

    ScatterChartData:
      type: object
      description: Returned when the widget's chart_type is scatter.
      required: [chart_type, as_of, x_metric, y_metric, points, context_dims]
      properties:
        chart_type:   { type: string, enum: [scatter] }
        as_of:        { type: string, format: date-time }
        x_metric:     { $ref: "#/components/schemas/ChartMetricLabel" }
        y_metric:     { $ref: "#/components/schemas/ChartMetricLabel" }
        points:       { type: array, items: { $ref: "#/components/schemas/ScatterPoint" } }
        context_dims: { type: array, items: { $ref: "#/components/schemas/ChartContextDim" } }
        context:
          type: object
          additionalProperties: { type: string }
          description: >-
            The context the data was resolved for. Differs from the request when a
            requested member is hidden from the caller: the resolver substitutes that
            dimension's default visible member instead of failing.

    HistogramBin:
      type: object
      required: [min, max, count]
      properties:
        min:   { type: number }
        max:   { type: number }
        count: { type: integer }

    HistogramChartData:
      type: object
      description: Returned when the widget's chart_type is histogram.
      required: [chart_type, as_of, metric, observation_count, bins, context_dims]
      properties:
        chart_type:        { type: string, enum: [histogram] }
        as_of:             { type: string, format: date-time }
        metric:            { $ref: "#/components/schemas/ChartMetricLabel" }
        observation_count: { type: integer }
        bins:              { type: array, items: { $ref: "#/components/schemas/HistogramBin" } }
        context_dims:      { type: array, items: { $ref: "#/components/schemas/ChartContextDim" } }
        context:
          type: object
          additionalProperties: { type: string }
          description: >-
            The context the data was resolved for. Differs from the request when a
            requested member is hidden from the caller: the resolver substitutes that
            dimension's default visible member instead of failing.

    DevPersona:
      type: object
      required: [key, label, email, roles, tenant]
      properties:
        key:    { type: string, description: "Value to send as the X-Dev-User header" }
        label:  { type: string }
        email:  { type: string, format: email }
        roles:  { type: array, items: { type: string } }
        tenant: { type: string }

    UserApp:
      type: object
      required: [id, name, mode, workspace_name, model_name, active_revision]
      properties:
        id:              { type: string, format: uuid }
        name:            { type: string }
        mode:            { type: string, enum: [planning, crud, execution] }
        workspace_name:  { type: string }
        model_name:      { type: string }
        active_revision: { type: string }

    FormulaRefsRequest:
      type: object
      required: [formula]
      properties:
        formula: { type: string }

paths:
  /healthz:
    get:
      operationId: healthz
      summary: Health check
      security: []
      responses:
        "200":
          description: Service healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }

  /api/demo:
    get:
      operationId: getDemo
      summary: Get demo context (model, revision, actor for current persona)
      responses:
        "200":
          description: Demo context
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DemoContext" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/me:
    get:
      operationId: getMe
      summary: Get the resolved actor for the current identity (no model/app context required)
      responses:
        "200":
          description: Actor
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Actor" }
        "401": { description: Unauthorized }

  /api/notifications/settings:
    get:
      operationId: getNotificationSettings
      summary: Outbound notification settings for this tenant — which channels deliver, and whether overdue tasks are reminded (administrators)
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationSettings" }
        "403": { description: Forbidden }
    put:
      operationId: updateNotificationSettings
      summary: Update the outbound notification settings (administrators)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NotificationSettings" }
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationSettings" }
        "400":
          description: Invalid settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403": { description: Forbidden }
    delete:
      operationId: clearNotificationSettings
      summary: Drop the tenant's own delivery settings so it inherits the deployment's again (administrators)
      responses:
        "200":
          description: The settings now in force
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationSettings" }
        "400": { description: The deployment's own row cannot be cleared }
        "403": { description: Forbidden }

  /api/notifications/settings/test:
    post:
      operationId: sendNotificationTestMail
      summary: Send the calling administrator a test e-mail through the deployment's relay, synchronously — the relay's verdict comes back as the response (administrators)
      responses:
        "200":
          description: The relay accepted the message
          content:
            application/json:
              schema:
                type: object
                required: [sent_to]
                properties:
                  sent_to: { type: string, description: The caller's own address, the only recipient this can reach }
        "403": { description: Forbidden }
        "409":
          description: No relay is configured (SMTP_HOST), or the caller's account has no e-mail address
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "502":
          description: The relay refused the message or did not answer; the error carries the relay's own words
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/admin/ai-settings:
    get:
      operationId: getTenantAISettings
      summary: The tenant-level AI provider key for this tenant (administrators; enterprise feature tenant_ai_keys)
      responses:
        "200":
          description: Tenant AI settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TenantAISettings" }
        "403": { description: "Forbidden, or the licence does not include tenant_ai_keys" }
    put:
      operationId: updateTenantAISettings
      summary: Set the tenant AI provider, model, key and whether it is enforced (administrators; enterprise)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TenantAISettings" }
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TenantAISettings" }
        "400":
          description: Unknown provider, or enforcing with no key stored
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403": { description: "Forbidden, or the licence does not include tenant_ai_keys" }

  /api/admin/ai-settings/test:
    post:
      operationId: testTenantAISettings
      summary: Verify the tenant key with a live tool-calling probe before enforcing it (administrators; enterprise)
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TenantAISettings" }
      responses:
        "200":
          description: Probe result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProviderProbeResult" }
        "403": { description: "Forbidden, or the licence does not include tenant_ai_keys" }

  /api/admin/ai-settings/key:
    delete:
      operationId: clearTenantAIKey
      summary: Remove the stored tenant key and stop enforcing it, returning the tenant to personal keys (administrators; enterprise)
      responses:
        "200":
          description: Settings after clearing
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TenantAISettings" }
        "403": { description: "Forbidden, or the licence does not include tenant_ai_keys" }

  /api/developer/integrations/google-service-account:
    get:
      operationId: getGoogleConnection
      summary: The tenant's Google service account, public half only — the address to share sheets with (developers and administrators; the tenant of the application in X-App-Id)
      responses:
        "200":
          description: The connection
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GoogleConnection" }
        "403": { description: Forbidden }
        "409": { description: A platform admin named no tenant }
    put:
      operationId: putGoogleConnection
      summary: Store a Google service-account key file for this tenant — the JSON Google Cloud downloaded; only the address and the private key are kept, sealed (developers and administrators)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key_file]
              properties:
                key_file: { type: string, description: The key file's JSON text }
      responses:
        "200":
          description: Stored
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GoogleConnection" }
        "400": { description: Not a service-account key file, or its key does not parse }
        "403": { description: Forbidden }
        "503": { description: The deployment has no INTEGRATION_CRED_KEY and refuses to store credentials }
    delete:
      operationId: deleteGoogleConnection
      summary: Forget the tenant's Google service account; private sheets become unreachable again (developers and administrators)
      responses:
        "200":
          description: Removed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GoogleConnection" }
        "403": { description: Forbidden }

  /api/developer/integrations/google-service-account/test:
    post:
      operationId: testGoogleConnection
      summary: Prove the stored key by obtaining an access token from Google; nothing is read (developers and administrators)
      responses:
        "200":
          description: Google issued a token for the account
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  client_email: { type: string }
        "403": { description: Forbidden }
        "409": { description: No account is stored }
        "502": { description: Google refused the account; the error carries its words }

  /api/sso/discover:
    get:
      operationId: ssoDiscover
      security: []
      summary: Before sign-in, whether single sign-on exists and which provider an e-mail belongs to (public, rate-limited; answers nothing about e-mails it does not know)
      parameters:
        - in: query
          name: email
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Discovery result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SsoDiscovery" }
        "429": { description: Too many requests }

  /api/admin/sso:
    get:
      operationId: getSsoSettings
      summary: This tenant's single sign-on provider (administrators; enterprise feature sso)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SsoSettings" }
        "403": { description: "Forbidden, or the licence does not include this feature" }
    put:
      operationId: updateSsoSettings
      summary: Register or update the tenant's identity provider in Keycloak and save the settings (administrators; enterprise)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SsoSettings" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SsoSettings" }
        "400": { description: "Invalid settings, or the provider document could not be read" }
        "403": { description: "Forbidden, or the licence does not include this feature" }
        "502": { description: The identity-provider registry refused the change }
    delete:
      operationId: removeSso
      summary: Remove the tenant's identity provider from Keycloak and clear the settings (administrators; enterprise)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SsoSettings" }
        "403": { description: "Forbidden, or the licence does not include this feature" }

  /api/admin/sso/test:
    post:
      operationId: testSsoProvider
      summary: Read the provider's discovery or metadata document without registering it (administrators; enterprise)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SsoSettings" }
      responses:
        "200": { description: "What the document declares (issuer, endpoints, certificate presence)" }
        "400": { description: The document could not be read }
        "403": { description: "Forbidden, or the licence does not include this feature" }

  /api/admin/scim/tokens:
    get:
      operationId: listScimTokens
      summary: This tenant's SCIM tokens, revoked ones included, never the secret (administrators; enterprise feature scim)
      responses:
        "200": { description: Tokens }
        "403": { description: "Forbidden, or the licence does not include this feature" }
    post:
      operationId: createScimToken
      summary: Issue a SCIM bearer token; the plaintext is returned once (administrators; enterprise)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScimToken" }
      responses:
        "201":
          description: The token, with its plaintext
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScimToken" }
        "400": { description: Invalid request }
        "403": { description: "Forbidden, or the licence does not include this feature" }

  /api/admin/scim/tokens/{id}:
    delete:
      operationId: revokeScimToken
      summary: Revoke a SCIM token (administrators; enterprise)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Revoked }
        "403": { description: "Forbidden, or the licence does not include this feature" }
        "404": { description: Not found }

  /api/scim/v2/ServiceProviderConfig:
    get:
      operationId: scimServiceProviderConfig
      security:
        - scimBearer: []
      summary: SCIM 2.0 service provider configuration (SCIM bearer token)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScimResource" }
        "401": { description: Missing or invalid SCIM token }

  /api/scim/v2/ResourceTypes:
    get:
      operationId: scimResourceTypes
      security:
        - scimBearer: []
      summary: SCIM 2.0 resource types (SCIM bearer token)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScimResource" }
        "401": { description: Missing or invalid SCIM token }

  /api/scim/v2/Schemas:
    get:
      operationId: scimSchemas
      security:
        - scimBearer: []
      summary: SCIM 2.0 schemas (SCIM bearer token)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScimResource" }
        "401": { description: Missing or invalid SCIM token }

  /api/scim/v2/Users:
    get:
      operationId: scimListUsers
      security:
        - scimBearer: []
      summary: List or filter this tenant's users as SCIM resources (SCIM bearer token); filter supports attr eq "value" joined by and
      parameters:
        - { in: query, name: filter, required: false, schema: { type: string } }
        - { in: query, name: startIndex, required: false, schema: { type: integer } }
        - { in: query, name: count, required: false, schema: { type: integer } }
      responses:
        "200":
          description: ListResponse
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScimResource" }
        "400": { description: Invalid filter }
        "401": { description: Missing or invalid SCIM token }
    post:
      operationId: scimCreateUser
      security:
        - scimBearer: []
      summary: Create a user exactly as the console's Users screen would (SCIM bearer token)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScimResource" }
      responses:
        "201":
          description: The created user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScimResource" }
        "400": { description: Invalid resource }
        "401": { description: Missing or invalid SCIM token }
        "409": { description: userName already exists }
        "502": { description: The identity provider refused the account }

  /api/scim/v2/Users/{id}:
    get:
      operationId: scimGetUser
      security:
        - scimBearer: []
      summary: One user (SCIM bearer token)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScimResource" }
        "401": { description: Missing or invalid SCIM token }
        "404": { description: Not found }
    put:
      operationId: scimReplaceUser
      security:
        - scimBearer: []
      summary: Replace a user's attributes (SCIM bearer token)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScimResource" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScimResource" }
        "401": { description: Missing or invalid SCIM token }
        "404": { description: Not found }
        "409": { description: userName already exists }
    patch:
      operationId: scimPatchUser
      security:
        - scimBearer: []
      summary: Apply PatchOp operations to a user; active=false deactivates sign-in immediately (SCIM bearer token)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScimResource" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScimResource" }
        "400": { description: Unsupported operation or path }
        "401": { description: Missing or invalid SCIM token }
        "404": { description: Not found }
    delete:
      operationId: scimDeleteUser
      security:
        - scimBearer: []
      summary: Delete the user and their identity-provider account (SCIM bearer token)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204": { description: Deleted }
        "401": { description: Missing or invalid SCIM token }
        "404": { description: Not found }

  /api/scim/v2/Groups:
    get:
      operationId: scimListGroups
      security:
        - scimBearer: []
      summary: List or filter this tenant's business roles as SCIM groups (SCIM bearer token)
      parameters:
        - { in: query, name: filter, required: false, schema: { type: string } }
        - { in: query, name: startIndex, required: false, schema: { type: integer } }
        - { in: query, name: count, required: false, schema: { type: integer } }
      responses:
        "200":
          description: ListResponse
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScimResource" }
        "400": { description: Invalid filter }
        "401": { description: Missing or invalid SCIM token }
    post:
      operationId: scimCreateGroup
      security:
        - scimBearer: []
      summary: Create a business role with members (SCIM bearer token)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScimResource" }
      responses:
        "201":
          description: The created group
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScimResource" }
        "400": { description: Invalid resource or unknown member }
        "401": { description: Missing or invalid SCIM token }
        "409": { description: displayName already exists }

  /api/scim/v2/Groups/{id}:
    get:
      operationId: scimGetGroup
      security:
        - scimBearer: []
      summary: One group (SCIM bearer token)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScimResource" }
        "401": { description: Missing or invalid SCIM token }
        "404": { description: Not found }
    put:
      operationId: scimReplaceGroup
      security:
        - scimBearer: []
      summary: Replace a group's name and members (SCIM bearer token)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScimResource" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScimResource" }
        "401": { description: Missing or invalid SCIM token }
        "404": { description: Not found }
        "409": { description: displayName already exists }
    patch:
      operationId: scimPatchGroup
      security:
        - scimBearer: []
      summary: Add or remove members, rename (SCIM bearer token)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScimResource" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScimResource" }
        "400": { description: Unsupported operation }
        "401": { description: Missing or invalid SCIM token }
        "404": { description: Not found }
    delete:
      operationId: scimDeleteGroup
      security:
        - scimBearer: []
      summary: Delete the business role (SCIM bearer token)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204": { description: Deleted }
        "401": { description: Missing or invalid SCIM token }
        "404": { description: Not found }

  /api/cells/history:
    get:
      operationId: getCellHistory
      summary: Every value one intersection held, newest first, including rows later deleted and why (any user who can see the cell; enterprise feature cell_history)
      parameters:
        - { in: query, name: model_id, required: true, schema: { type: string } }
        - { in: query, name: revision_id, required: false, schema: { type: string } }
        - { in: query, name: metric_id, required: true, schema: { type: string } }
        - in: query
          name: dim_codes
          required: false
          schema: { type: string }
          description: JSON object of dimension id to member code, exactly as the cell write sends it.
        - { in: query, name: limit, required: false, schema: { type: integer } }
      responses:
        "200":
          description: History, newest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CellHistoryEntry" }
        "403": { description: "Forbidden — the cell is hidden from the caller, or the licence does not include cell_history" }
        "404": { description: Unknown metric or member }

  /api/branding:
    get:
      operationId: getBranding
      security: []
      summary: The brand to apply — a signed-in caller's tenant, else the tenant registered for the request's host, else the platform's own (public)
      responses:
        "200":
          description: Brand
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BrandView" }

  /api/admin/branding:
    get:
      operationId: getAdminBranding
      summary: This tenant's branding (administrators; feature white_label)
      responses:
        "200":
          description: Branding
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Branding" }
        "403": { description: "Forbidden, or the licence does not include white_label" }
    put:
      operationId: updateBranding
      summary: Set the tenant's name, tagline, logo, favicon, colour, e-mail sender name and custom domain (administrators; feature white_label)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Branding" }
      responses:
        "200":
          description: Saved branding
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Branding" }
        "400": { description: "Invalid colour, oversized or non-image data URL, invalid or already-registered domain" }
        "403": { description: "Forbidden, or the licence does not include white_label" }
    delete:
      operationId: removeBranding
      summary: Return the tenant to the platform's own look (administrators; feature white_label)
      responses:
        "200":
          description: Cleared branding
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Branding" }
        "403": { description: "Forbidden, or the licence does not include white_label" }

  /api/admin/usage:
    get:
      operationId: getUsage
      summary: Per-tenant usage — every tenant for a platform admin, their own for a tenant admin (administrators; enterprise feature usage_analytics)
      parameters:
        - { in: query, name: period, required: false, schema: { type: string }, description: Days of activity to count, e.g. 7d, 30d (default), 90d. }
      responses:
        "200":
          description: Usage per tenant
          content:
            application/json:
              schema:
                type: object
                properties:
                  period_days: { type: integer }
                  since: { type: string, format: date-time }
                  tenants:
                    type: array
                    items: { $ref: "#/components/schemas/TenantUsage" }
        "400": { description: Invalid period }
        "403": { description: "Forbidden, or the licence does not include usage_analytics" }

  /api/admin/audit/export:
    get:
      operationId: exportAudit
      summary: Stream the caller's audit events, oldest first, as a CSV download or JSON Lines for a collector; the same tenant scope as the listing (administrators; enterprise feature audit_export)
      parameters:
        - { in: query, name: format, required: false, schema: { type: string, enum: [csv, jsonl] } }
        - { in: query, name: since, required: false, schema: { type: string }, description: A date (2006-01-02) or RFC 3339 time, inclusive. }
        - { in: query, name: until, required: false, schema: { type: string }, description: A date (whole day) or RFC 3339 time, exclusive. }
        - { in: query, name: category, required: false, schema: { type: string } }
        - { in: query, name: event_type, required: false, schema: { type: string } }
        - { in: query, name: after, required: false, schema: { type: string }, description: Cursor from the previous page's final next_cursor line (jsonl). }
        - { in: query, name: limit, required: false, schema: { type: integer }, description: Events per page, default 10000, at most 100000. }
      responses:
        "200":
          description: The events; jsonl ends with a {"next_cursor"} line when another page follows
          content:
            text/csv: { schema: { type: string } }
            application/x-ndjson: { schema: { type: string } }
        "400": { description: "Invalid time, cursor or format" }
        "403": { description: "Forbidden, or the licence does not include audit_export" }

  /api/admin/audit/settings:
    get:
      operationId: getAuditSettings
      summary: The audit retention policy (administrators; enterprise)
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditSettings" }
        "403": { description: "Forbidden, or the licence does not include audit_export" }
    put:
      operationId: updateAuditSettings
      summary: Set how long audit events are kept; 0 forever, otherwise at least 30 days (administrators; enterprise)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AuditSettings" }
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditSettings" }
        "400": { description: Below the retention floor }
        "403": { description: "Forbidden, or the licence does not include audit_export" }
    delete:
      operationId: clearAuditSettings
      summary: Drop the tenant's own retention so it inherits the deployment's again (administrators; enterprise)
      responses:
        "200":
          description: The settings now in force
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditSettings" }
        "400": { description: The deployment's own row cannot be cleared }
        "403": { description: "Forbidden, or the licence does not include audit_export" }

  /api/license:
    get:
      operationId: getLicense
      summary: Report the edition in force, the features it unlocks and the full gated-feature catalog (any signed-in user; see pkg/license)
      responses:
        "200":
          description: License status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LicenseInfo" }
        "401": { description: Unauthorized }

  /api/legal:
    get:
      operationId: getLegalInfo
      security: []
      summary: The operator's identity and the documents it publishes, for the terms of service and privacy notice a visitor reads before signing up (public; see internal/gateway/legal.go)
      responses:
        "200":
          description: Legal information
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LegalInfo" }

  /api/signup/options:
    get:
      operationId: getSignupOptions
      security: []
      summary: Whether public self-service sign-up is open on this deployment and on what terms (public; see internal/gateway/signup.go)
      responses:
        "200":
          description: Sign-up options
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SignupOptions" }

  /api/signup:
    post:
      operationId: signup
      security: []
      summary: Register a tenant from the public sign-up page — the tenant on the self-service plan, its first administrator/developer, an application with the starter model, and an invitation to set a password (public, rate-limited per address)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SignupRequest" }
      responses:
        "200":
          description: Created; invited when an identity provider is configured
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SignupResult" }
        "400": { description: Invalid input }
        "409": { description: An account with this e-mail address already exists }
        "429": { description: Too many attempts from this address }
        "502": { description: "The identity provider refused, or the invitation could not be sent; nothing was created" }
        "503": { description: Sign-up is not enabled here }

  /api/admin/plans:
    get:
      operationId: listPlans
      tags: [Admin]
      summary: The plan catalog in display order (platform_admin and tenant_admin; internal/plan)
      responses:
        "200":
          description: Plans
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Plan" } }
        "401": { description: Unauthorized }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/admin/plans/{key}:
    put:
      operationId: upsertPlan
      tags: [Admin]
      summary: Create or change a plan — name, self-service flag and limits (platform_admin; applies to every tenant on the plan within a minute)
      parameters:
        - name: key
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlanInput" }
      responses:
        "200":
          description: The plan as stored
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Plan" }
        "400": { description: Invalid plan }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/apps:
    get:
      operationId: listUserApps
      summary: List applications accessible to the current user, scoped by tenant/workspace membership and app/model access grants
      responses:
        "200":
          description: Application list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/UserApp" }

  /api/dev/personas:
    get:
      operationId: listDevPersonas
      summary: List every user in the database as a switchable dev persona (dev mode only — 404s in production)
      responses:
        "200":
          description: Persona list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/DevPersona" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/formula/refs:
    post:
      operationId: extractFormulaRefs
      summary: Parse a formula string and return the metric/dimension names it references
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FormulaRefsRequest" }
      responses:
        "200":
          description: Referenced names (or a parse error, still with a 200 and an empty refs array)
          content:
            application/json:
              schema:
                type: object
                properties:
                  refs:  { type: array, items: { type: string } }
                  error: { type: string }

  /api/grid/export:
    get:
      operationId: exportGrid
      summary: Export a grid's raw input-metric values as CSV or XLSX (one row per dimension-member combination; round-trips through POST /api/import/upload)
      parameters:
        - name: grid_def_id
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: format
          in: query
          schema: { type: string, enum: [csv, xlsx], default: csv }
        - name: revision_id
          in: query
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: File download
          content:
            text/csv:
              schema: { type: string, format: binary }
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/grid:
    get:
      operationId: getGrid
      summary: Get planning grid for a revision
      parameters:
        - name: revision_id
          in: query
          description: Revision to read; omitted resolves the caller's ambient revision (X-Revision-Id header, else the model's active revision)
          schema: { type: string, format: uuid }
        - name: grid_def_id
          in: query
          description: Restrict metrics/dimensions to one grid definition; omitted returns the whole model
          schema: { type: string, format: uuid }
        - name: scope
          in: query
          description: 'JSON object of dimension id -> pinned member code, e.g. {"<dim-uuid>":"Q1"}. Cells/totals are restricted to the pinned subtree; a pin covering a whole dimension (its sole universal root) is dropped. Calc totals for a one-dimension pin are served from precomputed slice rows when available.'
          schema: { type: string }
        - name: meta_only
          in: query
          description: '"1" returns dimensions/metrics only — no cells or totals (fast first paint on large models)'
          schema: { type: string, enum: ["1"] }
        - name: totals_only
          in: query
          description: '"1" returns per-metric totals with no per-combo cells — the KPI read shape'
          schema: { type: string, enum: ["1"] }
      responses:
        "200":
          description: Grid data
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GridData" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/cells:
    post:
      operationId: writeback
      summary: Write a single cell value (triggers recalculation)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WritebackRequest" }
      responses:
        "200":
          description: Cell written
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
        "400": { $ref: "#/components/responses/BadRequest" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/metrics:
    get:
      operationId: listMetrics
      summary: List all metrics for the demo model
      responses:
        "200":
          description: Metric list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Metric" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/tasks:
    get:
      operationId: listTasks
      summary: List pending workflow tasks for the current user
      responses:
        "200":
          description: Task list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Task" }

  /api/tasks/{stepId}/complete:
    post:
      operationId: completeTask
      summary: Approve or reject a workflow step
      parameters:
        - name: stepId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TaskActionRequest" }
      responses:
        "200":
          description: Task completed
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/workflow/submit:
    post:
      operationId: submitBudget
      tags: [Workflow]
      summary: Submit a budget for approval (starts the model's workflow)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SubmitBudgetRequest" }
      responses:
        "200":
          description: Workflow started
          content:
            application/json:
              schema:
                type: object
                properties:
                  instance_id: { type: string, format: uuid }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/workflow/history:
    get:
      operationId: getWorkflowHistory
      tags: [Workflow]
      summary: List the 50 most recent workflow instances across the whole platform (business_admin only)
      responses:
        "200":
          description: Workflow history
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/WorkflowInstance" }

  /api/workflow/my-history:
    get:
      operationId: getMyWorkflowHistory
      tags: [Workflow]
      summary: List the 50 most recent workflow instances where the caller started the instance or was assigned a step
      responses:
        "200":
          description: Workflow history
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/WorkflowInstance" }

  /api/workflow/definitions:
    get:
      operationId: listWorkflowDefinitions
      tags: [Workflows]
      summary: Published workflow definitions of the caller's application, with context schemas — what the Planning workspace renders its start-workflow dialog from
      responses:
        "200":
          description: Published definitions
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:            { type: string, format: uuid }
                    name:          { type: string }
                    description:   { type: string }
                    trigger_event: { type: string }
                    context_schema:
                      type: array
                      items:
                        type: object
                        properties:
                          key:          { type: string }
                          label:        { type: string }
                          data_type:    { type: string }
                          dimension_id: { type: string }
        "401": { description: Unauthorized }

  /api/workflow/instances:
    post:
      operationId: startWorkflowInstance
      tags: [Workflow]
      summary: Start a workflow instance from a published workflow definition
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StartWorkflowInstanceRequest" }
      responses:
        "200":
          description: Instance started
          content:
            application/json:
              schema:
                type: object
                properties:
                  instance_id: { type: string, format: uuid }
        "400":
          description: Workflow is not published
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Caller has no RACI scope for this workflow
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: A duplicate instance already exists
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/workflow/instances/{id}:
    patch:
      operationId: updateWorkflowInstance
      tags: [Workflow]
      summary: Admin override of a workflow instance's status (business_admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateWorkflowInstanceRequest" }
      responses:
        "200":
          description: Instance updated
          content:
            application/json:
              schema: { type: object, properties: { status: { type: string } } }
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/notifications:
    get:
      operationId: listNotifications
      tags: [Workflow]
      summary: List the 50 most recent notifications for the current user
      responses:
        "200":
          description: Notification list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Notification" }

  /api/notifications/mark-read:
    post:
      operationId: markNotificationRead
      tags: [Workflow]
      summary: Mark one or more of the caller's own notifications as read
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MarkNotificationReadRequest" }
      responses:
        "200":
          description: Number of notifications updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  updated: { type: integer }

  /api/developer/model:
    get:
      operationId: getDeveloperModel
      tags: [Developer Console]
      summary: Get full model definition with metrics and dependencies
      parameters:
        - name: revision_id
          in: query
          schema: { type: string, format: uuid }
          description: When omitted, returns metrics across all revisions of the model.
      responses:
        "200":
          description: Developer model view
          content:
            application/json:
              schema:
                type: object
                required: [app_name, model_name, model_id, metrics]
                properties:
                  app_name:   { type: string }
                  model_id:   { type: string, format: uuid }
                  model_name: { type: string }
                  metrics:    { type: array, items: { $ref: "#/components/schemas/MetricDef" } }

  /api/developer/revisions:
    get:
      operationId: listRevisions
      tags: [Developer Console]
      summary: List revisions for a model
      parameters:
        - name: model_id
          in: query
          schema: { type: string, format: uuid }
          description: Defaults to the demo/current model for the caller's app context.
      responses:
        "200":
          description: Revision list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/DevRevision" }
    post:
      operationId: createRevision
      tags: [Developer Console]
      summary: Duplicate a revision (deep-copies metrics, dimensions, grids, dashboards, forms, workflows, and facts)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateRevisionRequest" }
      responses:
        "200":
          description: Revision created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/developer/revisions/{id}:
    delete:
      operationId: deleteRevision
      tags: [Developer Console]
      summary: Delete a revision (rejected if it is the model's active revision)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Revision deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
        "409":
          description: Cannot delete the active revision
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/developer/revisions/{id}/activate:
    put:
      operationId: activateRevision
      tags: [Developer Console]
      summary: Make a revision the model's active revision
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Revision activated
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/developer/metrics:
    post:
      operationId: createMetric
      tags: [Developer Console]
      summary: Create a new metric definition
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateMetricRequest" }
      responses:
        "200":
          description: Metric created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:     { type: string, format: uuid }
                  status: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/developer/metrics/{id}:
    patch:
      operationId: updateMetric
      tags: [Developer Console]
      summary: Update a metric definition (re-wires formula dependencies and recalculates affected revisions)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateMetricRequest" }
      responses:
        "200":
          description: Metric updated, with per-revision recalculated values
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  recalc:
                    type: array
                    items:
                      type: object
                      properties:
                        revision_id: { type: string, format: uuid }
                        metric:      { type: string }
                        value:       { type: number, nullable: true }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deleteMetric
      tags: [Developer Console]
      summary: Delete a metric definition
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Metric deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }

  /api/developer/dimensions:
    get:
      operationId: listDimensions
      tags: [Developer Console]
      summary: List dimensions with members
      parameters:
        - name: revision_id
          in: query
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Dimension list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Dimension" }
    post:
      operationId: createDimension
      tags: [Developer Console]
      summary: Create a new dimension
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateDimensionRequest" }
      responses:
        "200":
          description: Dimension created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:     { type: string, format: uuid }
                  status: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/developer/dimensions/{dimId}:
    patch:
      operationId: updateDimension
      tags: [Developer Console]
      summary: Update a dimension (rejects cycles in the parent-dimension hierarchy)
      parameters:
        - name: dimId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateDimensionRequest" }
      responses:
        "200":
          description: Dimension updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
    delete:
      operationId: deleteDimension
      tags: [Developer Console]
      summary: Delete a dimension
      parameters:
        - name: dimId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Dimension deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }

  /api/developer/dimensions/{dimId}/members:
    post:
      operationId: createDimensionMember
      tags: [Developer Console]
      summary: Add a member to a dimension (splits parent-level facts and triggers recalculation when this is the first child of an existing parent member)
      parameters:
        - name: dimId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MemberRequest" }
      responses:
        "200":
          description: Member created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/developer/dimensions/{dimId}/members/generate:
    post:
      operationId: generateDimensionPeriods
      tags: [Developer Console]
      summary: Bulk-generate a time dimension's periods between two dates (same validation and chronological indexing as single members; time dimensions only)
      parameters:
        - name: dimId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GeneratePeriodsRequest" }
      responses:
        "200":
          description: Periods created (existing codes are left untouched)
          content:
            application/json:
              schema:
                type: object
                properties:
                  created: { type: integer }
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/developer/dimensions/{dimId}/members/{memberId}:
    patch:
      operationId: updateDimensionMember
      tags: [Developer Console]
      summary: Update a dimension member (rejects cycles in the parent-member hierarchy)
      parameters:
        - name: dimId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: memberId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MemberRequest" }
      responses:
        "200":
          description: Member updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
    delete:
      operationId: deleteDimensionMember
      tags: [Developer Console]
      summary: Delete a dimension member
      parameters:
        - name: dimId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: memberId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Member deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }

  /api/developer/dimensions/{dimId}/properties:
    get:
      operationId: listDimensionProperties
      tags: [Developer Console]
      summary: List typed properties defined on a dimension
      parameters:
        - name: dimId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Property list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/DimensionProperty" }
    post:
      operationId: createDimensionProperty
      tags: [Developer Console]
      summary: Define a new typed property on a dimension
      parameters:
        - name: dimId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PropertyRequest" }
      responses:
        "200":
          description: Property created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }

  /api/developer/dimensions/{dimId}/properties/{propId}:
    patch:
      operationId: updateDimensionProperty
      tags: [Developer Console]
      summary: Update a dimension property
      parameters:
        - name: dimId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: propId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PropertyRequest" }
      responses:
        "200":
          description: Property updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
    delete:
      operationId: deleteDimensionProperty
      tags: [Developer Console]
      summary: Delete a dimension property
      parameters:
        - name: dimId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: propId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Property deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }

  /api/developer/migration/generate:
    post:
      operationId: generateMigration
      tags: [Developer Console]
      summary: Generate (but do not apply) the next schema migration for a model's current definition
      responses:
        "200":
          description: Generated migration files
          content:
            application/json:
              schema:
                type: object
                properties:
                  model_id:       { type: string, format: uuid }
                  version_number: { type: integer }
                  files:
                    type: object
                    additionalProperties: { type: string }

  /api/developer/migration/apply:
    post:
      operationId: applyMigration
      tags: [Developer Console]
      summary: Generate and immediately apply a schema migration for a model
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MigrationApplyRequest" }
      responses:
        "200":
          description: Migration applied
          content:
            application/json:
              schema:
                type: object
                properties:
                  migration_id:   { type: string, format: uuid }
                  version_number: { type: integer }
                  status:         { type: string }
                  files_applied:  { type: integer }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/developer/debug/facts:
    get:
      operationId: debugFacts
      tags: [Developer Console]
      summary: List the 50 most recently entered raw fact_input rows for a model (debugging aid)
      responses:
        "200":
          description: Recent fact rows
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    metric_id:     { type: string, format: uuid }
                    metric_name:   { type: string }
                    dim_members:   { type: string, description: "Raw jsonb dim_members, as text" }
                    value:         { type: number }
                    revision_name: { type: string }
                    revision_id:   { type: string, format: uuid, nullable: true }
                    entered_at:    { type: string }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/developer/debug/calc:
    get:
      operationId: debugCalc
      tags: [Developer Console]
      summary: Inspect persisted runtime.calc_result rows (debugging aid) — per-metric summary, or every metric's row at one exact dim_members combo
      parameters:
        - name: revision_id
          in: query
          schema: { type: string, format: uuid }
        - name: dim_members
          in: query
          description: 'Exact dim_members JSON to match, e.g. {"<dimension-id>":"Q1"}. Omit for the per-metric summary.'
          schema: { type: string }
      responses:
        "200":
          description: Without dim_members, a per-metric summary of persisted rows; with it, each metric's latest row at that exact combo
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    metric_id:      { type: string, format: uuid }
                    metric_name:    { type: string }
                    total_rows:     { type: integer, description: "Summary mode only" }
                    has_aggregate:  { type: boolean, description: "Summary mode only: a '{}' grand-total row exists" }
                    one_dim_slices: { type: integer, description: "Summary mode only: rows pinning exactly one dimension" }
                    value:          { type: number, description: "dim_members mode only" }
                    calc_at:        { type: string, description: "dim_members mode only" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/developer/integrations/{id}/duplicate:
    post:
      operationId: duplicateIntegration
      tags: [Developer Console]
      summary: Duplicate a rest_api integration (test state cleared, schedule copied disabled, no run history)
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        "200": {description: The duplicated integration, content: {application/json: {schema: {type: object}}}}
        "404": { $ref: "#/components/responses/NotFound" }

  /api/developer/integrations/{id}/validate:
    post:
      operationId: validateIntegration
      tags: [Developer Console]
      summary: Validate a rest_api integration's configuration and target/connection ownership without saving
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        "200": {description: Validation result, content: {application/json: {schema: {type: object, properties: {valid: {type: boolean}, config_hash: {type: string}, errors: {type: array, items: {type: string}}}}}}}
        "404": { $ref: "#/components/responses/NotFound" }

  /api/developer/integrations/{id}/test:
    post:
      operationId: testIntegration
      tags: [Developer Console]
      summary: Enqueue a test (or dry_run=1) execution — 202 + run id; the worker executes it, never the gateway. Mutation methods require acknowledge_side_effects=1.
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: dry_run, in: query, schema: {type: string, enum: ["1"]}}
        - {name: acknowledge_side_effects, in: query, schema: {type: string, enum: ["1"]}}
      responses:
        "202": {description: Queued, content: {application/json: {schema: {type: object, properties: {run_id: {type: string}, status: {type: string}}}}}}
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/developer/integration-runs/{runId}:
    get:
      operationId: getIntegrationRun
      tags: [Developer Console]
      summary: One run's full state (poll while queued/running)
      parameters: [{name: runId, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        "200": {description: Run, content: {application/json: {schema: {type: object}}}}
        "404": { $ref: "#/components/responses/NotFound" }

  /api/developer/integration-runs/{runId}/cancel:
    post:
      operationId: cancelIntegrationRun
      tags: [Developer Console]
      summary: Cancel a queued run immediately, or request cooperative cancellation of a running one
      parameters: [{name: runId, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        "200": {description: Resulting status, content: {application/json: {schema: {type: object, properties: {status: {type: string}}}}}}
        "404": { $ref: "#/components/responses/NotFound" }
        "409": {description: Not cancellable, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}

  /api/developer/integration-connections:
    get:
      operationId: listIntegrationConnections
      tags: [Developer Console]
      summary: List reusable credential connections (public metadata + has_secret only — secrets are write-only)
      responses:
        "200": {description: Connections, content: {application/json: {schema: {type: array, items: {type: object}}}}}
    post:
      operationId: createIntegrationConnection
      tags: [Developer Console]
      summary: Create a connection; the secret document is sealed with mandatory AEAD and never returned
      requestBody: {required: true, content: {application/json: {schema: {type: object, properties: {name: {type: string}, auth_type: {type: string}, meta: {type: object}, secret: {type: object}}}}}}
      responses:
        "200": {description: Created connection (no secret), content: {application/json: {schema: {type: object}}}}
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/developer/integration-connections/{id}:
    patch:
      operationId: updateIntegrationConnection
      tags: [Developer Console]
      summary: 'Update a connection. Secret semantics: field absent = keep, null = remove, object = replace.'
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody: {required: true, content: {application/json: {schema: {type: object}}}}
      responses:
        "200": {description: Updated connection (no secret), content: {application/json: {schema: {type: object}}}}
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deleteIntegrationConnection
      tags: [Developer Console]
      summary: Delete a connection (refused while any integration references it)
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        "200": {description: Deleted, content: {application/json: {schema: {type: object}}}}
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/developer/integration-connections/{id}/test:
    post:
      operationId: testIntegrationConnection
      tags: [Developer Console]
      summary: Verify the stored credential decrypts and matches its auth type's required fields (no network call — full round-trips go through an integration's own /test run)
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        "200": {description: Result, content: {application/json: {schema: {type: object, properties: {ok: {type: boolean}, error: {type: string}}}}}}
        "404": { $ref: "#/components/responses/NotFound" }

  /api/developer/integration-connections/{id}/oauth/start:
    post:
      operationId: startIntegrationOAuth
      tags: [Developer Console]
      summary: "Begin the OAuth 2.0 authorization-code consent for a connection of that auth type: records the pending authorisation (PKCE) and answers the provider URL to open; the provider returns the browser to /api/integrations/oauth/callback"
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                return_to: { type: string, description: Console path to return to afterwards ("/" when absent or not a path) }
      responses:
        "200":
          description: Where to send the browser
          content:
            application/json:
              schema:
                type: object
                required: [authorization_url, redirect_uri]
                properties:
                  authorization_url: { type: string }
                  redirect_uri: { type: string, description: The callback the provider must be registered with }
        "400": { description: Not an authorization-code connection, or its meta is incomplete }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/developer/integration-connections/{id}/oauth/disconnect:
    post:
      operationId: disconnectIntegrationOAuth
      tags: [Developer Console]
      summary: Forget the connection's tokens, keeping the client so it can be connected again
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        "200":
          description: The connection
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  name: { type: string }
                  auth_type: { type: string }
                  meta: { type: object }
                  has_secret: { type: boolean }
        "400": { description: Not an authorization-code connection }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/integrations/oauth/callback:
    get:
      operationId: integrationOAuthCallback
      security: []
      summary: "Where the provider sends the browser after consent (public: the person arrives with the state only). Exchanges the code, seals the tokens into the connection, and redirects to the console with ?oauth=connected or ?oauth=error&oauth_error=…"
      parameters:
        - { name: state, in: query, required: true, schema: { type: string } }
        - { name: code, in: query, schema: { type: string } }
        - { name: error, in: query, schema: { type: string } }
        - { name: error_description, in: query, schema: { type: string } }
      responses:
        "302": { description: Back to the console }

