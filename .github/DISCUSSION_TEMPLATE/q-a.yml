body:
  - type: markdown
    attributes:
      value: |
        The [self-hosting guide](https://github.com/Mavericka-SARL/maverick-builds-app/blob/main/docs/SELF_HOSTING.md) and the [documentation index](https://github.com/Mavericka-SARL/maverick-builds-app/blob/main/docs/README.md) may already answer it. Something that does not work the way the documentation says is a [bug report](https://github.com/Mavericka-SARL/maverick-builds-app/issues/new?template=bug_report.yml) instead.
        Remove passwords, tokens and licence keys from anything you paste.
  - type: textarea
    id: question
    attributes:
      label: Your question
      description: What you are trying to do, and what you have tried so far.
    validations:
      required: true
  - type: input
    id: release
    attributes:
      label: Release
      description: The release you run, if it matters.
      placeholder: "2026.09.26"
