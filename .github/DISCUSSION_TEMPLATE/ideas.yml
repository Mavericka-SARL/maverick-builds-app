body:
  - type: markdown
    attributes:
      value: |
        Ideas are where new features start. Upvote the ones you want: the most wanted ideas become issues on the [roadmap](https://github.com/Mavericka-SARL/maverick-builds-app/blob/main/CONTRIBUTING.md#roadmap-and-releases).
        Search first: an idea that already exists is better upvoted and commented than posted twice.
        Describe the problem first: a clear problem often has a better answer than the first solution that comes to mind.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: Who needs this (developer, administrator, business user), and what they cannot do today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you would like
      description: How it could work, from the point of view of the person who needs it.
  - type: textarea
    id: alternatives
    attributes:
      label: What you do instead today
      description: Workarounds you use now, or other tools you looked at.
