name: Feature request
description: Something maverickbuilds.app should do that it does not do today.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem first: a clear problem often has a better answer than the first solution that comes to mind.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: Who needs this (developer, administrator, business user), and what they cannot do today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you would like
      description: How it could work, from the point of view of the person who needs it.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What you do instead today
      description: Workarounds you use now, or other tools you looked at.
