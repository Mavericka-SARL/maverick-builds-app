# Static serving for the built SPA. Deliberately does NOT proxy /api.
#
# The app calls relative /api paths, and the Ingress routes /api to the gateway
# Service on the same host (see deploy/k8s/base/ingress.yaml), so a proxy here
# would add a second hop and hide the real client IP from the gateway. It would
# also make the container fail to start anywhere the upstream name doesn't
# resolve: nginx resolves proxy_pass hostnames when it parses the config, so a
# bare `docker run` with no `gateway` host would exit rather than serve.

server {
    # 8080, not 80: this runs as an unprivileged user and cannot bind <1024.
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # A directory asked for without its slash (/docs, /assets) is redirected.
    # Relative, so the browser keeps its own scheme and host: an absolute one
    # would name this container's port, http://<host>:8080/docs/, which
    # nothing outside the pod answers.
    absolute_redirect off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Runtime config is written per-container to a writable path (the image
    # itself is read-only), so it is served from there rather than from the
    # copy baked into the image.
    location = /config.js {
        alias /tmp/runtime/config.js;
        default_type application/javascript;
        add_header Cache-Control "no-store" always;
    }

    # index.html must never be cached: after a deploy, a stale copy would
    # reference hashed asset filenames that no longer exist.
    location = /index.html {
        add_header Cache-Control "no-store" always;
    }

    # Vite emits content-hashed filenames, so these can be cached hard.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # The manuals (web/Dockerfile copies them from docs/). A missing page or
    # picture is a real 404: the SPA fallback below would answer it with the
    # console's index.html and a 200. Not content-hashed, so revalidated.
    location /docs/ {
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
    }

    # The licences and third-party notices (web/Dockerfile), plain text.
    location /licenses/ {
        try_files $uri =404;
        charset utf-8;
        add_header Cache-Control "no-cache" always;
    }

    # SPA fallback: client-side routes are not files on disk.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
