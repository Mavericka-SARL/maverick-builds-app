<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- The app icon. The SVG is what a modern browser draws; the .ico is
         there for the ones that ask for /favicon.ico regardless (and for
         anything that pastes the link). Both are swapped together when a
         tenant has white-labelled the product — see branding/brand.ts. -->
    <!-- ?v= busts Chrome's favicon cache, which persists across sessions and
         does not reliably follow normal HTTP caching (a fresh /favicon.ico
         at the same URL kept showing an old, mis-cropped icon to returning
         visitors — reported live, 2026-09-24). Bump it whenever either file
         changes; index.html itself is never cached (see nginx.conf), so the
         bump takes effect on the next load. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=1" />
    <link rel="alternate icon" type="image/x-icon" href="/favicon.ico?v=1" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>maverickbuilds.app</title>
    <!-- Runtime configuration, written by the container at startup so one
         image serves every environment. Must load BEFORE the bundle. -->
    <script src="/config.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
