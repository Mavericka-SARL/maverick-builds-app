syntax = "proto3";

package common.v1;

option go_package = "github.com/mavericks-engine/mavericks/gen/go/common/v1;commonv1";

message UUID {
  string value = 1;
}

message PageRequest {
  int32 page_size = 1;
  string page_token = 2;
}

message PageResponse {
  string next_page_token = 1;
  int32 total_count = 2;
}

enum Role {
  ROLE_UNSPECIFIED = 0;
  ROLE_PLATFORM_ADMIN = 1;
  ROLE_DEVELOPER = 2;
  ROLE_BUSINESS_ADMIN = 3;
  ROLE_BUSINESS_USER = 4;
  ROLE_TENANT_ADMIN = 5;
}

message Actor {
  string user_id = 1;
  Role role = 2;
  string workspace_id = 3;
}

message Error {
  string code = 1;
  string message = 2;
  map<string, string> details = 3;
}
