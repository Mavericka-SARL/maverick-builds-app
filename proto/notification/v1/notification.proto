syntax = "proto3";

package notification.v1;

option go_package = "github.com/mavericks-engine/mavericks/gen/go/notification/v1;notificationv1";

import "google/protobuf/timestamp.proto";

enum NotificationChannel {
  NOTIFICATION_CHANNEL_UNSPECIFIED = 0;
  NOTIFICATION_CHANNEL_IN_APP = 1;
  NOTIFICATION_CHANNEL_EMAIL = 2;
  NOTIFICATION_CHANNEL_WEBHOOK = 3;
}

enum NotificationStatus {
  NOTIFICATION_STATUS_UNSPECIFIED = 0;
  NOTIFICATION_STATUS_PENDING = 1;
  NOTIFICATION_STATUS_DELIVERED = 2;
  NOTIFICATION_STATUS_FAILED = 3;
  NOTIFICATION_STATUS_READ = 4;
}

message Notification {
  string id = 1;
  string recipient_user_id = 2;
  NotificationChannel channel = 3;
  string template_id = 4;
  map<string, string> template_vars = 5;
  NotificationStatus status = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp delivered_at = 8;
}

